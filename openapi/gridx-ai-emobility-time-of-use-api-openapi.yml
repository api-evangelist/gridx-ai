openapi: 3.2.0
info:
  title: gridX Emobility Time Of Use API
  description: The gridX standard API makes it possible to build customised energy applications.
  version: 2.0.0
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: emobility-time-of-use
  description: Manages the Time of Use implementation for eMobility.
  x-displayName: emobility-time-of-use
paths:
  /systems/{systemID}/emobility/timeofuse:
    get:
      operationId: getEmobilityTimeOfUseSettings
      summary: Return the eMobility time-of-use settings for the specified system
      description: Returns the settings.
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      x-badges:
      - label: draft
        color: red
      tags:
      - emobility-time-of-use
      responses:
        '200':
          description: 'Response body for the time-of-use settings for a system.

            '
          content:
            application/json:
              schema:
                description: 'All options available to set the eMobility ToU settings.

                  '
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: true
                  energy:
                    description: 'Minimum amount of energy that should be transferred per charging session

                      and the minimum duration the EV will remain connected,

                      allowing for flexibility in the use of energy.

                      '
                    type: object
                    properties:
                      minEnergy:
                        type: integer
                        minimum: 0
                        description: 'Minimum energy required to charge in Wh during the minimum duration.

                          '
                      minDuration:
                        type: string
                        format: duration
                        description: 'Minimum duration vehicles are expected to be parked to charge the minimum energy, e.g. ''4h30m'' or just ''30m''.

                          Note that this must be compatible to the Golang duration format, not RFC3339.

                          '
                    required:
                    - minEnergy
                    - minDuration
                    x-readme-ref-name: EnergyGuarantee
                  tariff:
                    description: 'Describes the time-window during the day to consider for tariff optimization

                      as well as the percentile to consider low prices for.

                      `parkedUntil` must be strictly after `parkedFrom`; overnight parking periods

                      spanning midnight are not supported and are rejected with an HTTP 400.

                      '
                    type: object
                    properties:
                      parkedFrom:
                        description: A 24-hour wall-clock time of the day, with leading zeros.
                        type: string
                        pattern: ^\d{2}:\d{2}$
                        example: '16:15'
                        x-readme-ref-name: TimeOfDay
                      parkedUntil:
                        description: A 24-hour wall-clock time of the day, with leading zeros.
                        type: string
                        pattern: ^\d{2}:\d{2}$
                        example: '16:15'
                        x-readme-ref-name: TimeOfDay
                      percentile:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: 'Percentile for the price threshold between 0 and 100 in percent.

                          E.g. for 30 all vehicles will charge in the cheapest 30% of the considered hours.

                          '
                        example: 30
                    required:
                    - parkedFrom
                    - parkedUntil
                    - percentile
                    x-readme-ref-name: OptimizationParameters
                required:
                - enabled
                - energy
                - tariff
                x-readme-ref-name: EMobilityTimeOfUseSettings
        '400':
          description: Malformed request.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
