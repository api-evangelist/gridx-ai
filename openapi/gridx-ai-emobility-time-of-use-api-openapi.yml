    patch:
      operationId: patchEmobilityTimeOfUseSettings
      summary: Update eMobility time-of-use settings for the specified system
      description: Apply partial updates to the time-of-use settings for this system.
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
