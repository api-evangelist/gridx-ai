openapi: 3.2.0
info:
  title: gridX Measurements API
  description: The gridX standard API makes it possible to build customised energy applications.
  version: 2.0.0
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Measurements
  x-displayName: Measurements
paths:
  /systems/{systemID}/assets/{assetID}/measurements:
    get:
      x-badges:
      - label: beta
        color: orange
      operationId: getAssetMeasurements
      summary: List Asset Measurements
      description: 'Lists measurements of an asset over a period of time.


        The `start` and `end` parameters must define a range no longer than 24 hours.


        Measurements can be either sampled or aggregated.

        - A sampled measurement represents the asset at any specific point in time.

        - An aggregated measurement represents the asset over an interval of time.


        For aggregated measurements, the exact aggregation method for each specific field is shown in its description:


        - **Time-Weighted average**: average value weighted by time

        - **Min**: minimum value observed

        - **Max**: maximum value observed

        - **Last**: the last value observed


        The asset''s measurements are collected and then downsampled on the gridbox.

        The actual interval used is reflected in the measurements time metadata.


        Currently, we only aggregate measurements for HEMS sites.


        To retrieve measurements of hybrid inverters, use the asset IDs

        of the children (battery or PV) assets.


        Listing measurements is only supported for the following assets:

        * `Battery`

        * `Inverter`

        * `Heater`

        * `Meter`

        * `Heat Pump`

        * `EV Charging Station`'
      tags:
      - Measurements
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: assetID
        description: 'Unique identifier used to access an asset.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      - name: start
        description: 'Start time of the interval for the query in RFC3339.

          Measurements with timestamps after this value are included in the response.

          '
        in: query
        required: true
        example: '2025-08-05T18:00:00Z'
        schema:
          type: string
          format: date-time
      - name: end
        description: 'End time of the interval for the query in RFC3339.

          Measurements with timestamps that match exactly this value are included in the response.

          '
        in: query
        required: true
        example: '2025-08-05T19:00:00Z'
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Returned asset measurements.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: Measurements of an asset.
                type: object
                oneOf:
                - title: AssetBatteryMeasurements
                  description: Measurements of a battery asset.
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - BATTERY
                      description: The type of asset.
                    measurements:
                      type: array
                      items:
                        title: BatteryMeasurement
                        description: A measurement produced by a battery (inverter).
                        allOf:
                        - description: Measurement metadata of an asset.
                          type: object
                          oneOf:
                          - title: AggregatedTimeMetadata
                            description: A time interval for an aggregated measurement.
                            type: object
                            properties:
                              measuredFrom:
                                type: string
                                format: date-time
                                description: Time when the aggregation started.
                              measuredTo:
                                type: string
                                format: date-time
                                description: Time when the aggregation ended.
                            required:
                            - measuredFrom
                            - measuredTo
                            x-readme-ref-name: AggregatedTimeMetadata
                          - title: SampledTimeMetadata
                            description: A single timestamp for a measurement.
                            type: object
                            properties:
                              measuredAt:
                                type: string
                                format: date-time
                                description: Time when the data was measured.
                            required:
                            - measuredAt
                            x-readme-ref-name: SampledTimeMetadata
                          x-readme-ref-name: TimeMetadata
                        - type: object
                          properties:
                            capacity:
                              type: number
                              format: double
                              minimum: 0
                              description: 'Capacity in Wh.


                                Aggregation type: Time-Weighted average

                                '
                            nominalCapacity:
                              type: number
                              format: double
                              minimum: 0
                              description: 'Nominal capacity in Wh.


                                Aggregation type: Time-Weighted average

                                '
                            stateOfCharge:
                              type: number
                              format: double
                              minimum: 0
                              description: 'Value in range 0-100, state of charge in percent.


                                Aggregation type: Time-Weighted average

                                '
                            chargePower:
                              type: number
                              format: double
                              minimum: 0
                              description: 'Charge power of the battery in mW.


                                Aggregation type: Time-Weighted average

                                '
                            dischargePower:
                              type: number
                              format: double
                              minimum: 0
                              description: 'Discharge power of the battery in mW.


                                Aggregation type: Time-Weighted average

                                '
                            activePower:
                              type: number
                              format: double
                              description: "The active power of the battery in mW.\n  - negative values represent battery charging\n  - positive values represent battery discharging\n\nAggregation type: Time-Weighted average\n"
                        x-readme-ref-name: measurements.BatteryMeasurement
                      description: List of battery measurements.
                  required:
                  - type
                  - measurements
                  x-readme-ref-name: AssetBatteryMeasurements
                - title: AssetHeaterMeasurements
                  description: Measurements of a heater asset.
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - HEATER
                      description: The type of asset.
                    measurements:
                      type: array
                      items:
                        title: HeaterMeasurement
                        description: A measurement produced by a heater.
                        allOf:
                        - description: Measurement metadata of an asset.
                          type: object
                          oneOf:
                          - title: AggregatedTimeMetadata
