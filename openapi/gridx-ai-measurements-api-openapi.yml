                              type: number
                              format: double
                              description: 'Power measured by the heater in mW.


                                Aggregation type: Time-Weighted average

                                '
                            powerL1:
                              type: number
                              format: double
                              description: 'Power measured by the heater on the first phase in mW.


                                Aggregation type: Time-Weighted average

                                '
                            powerL2:
                              type: number
                              format: double
                              description: 'Power measured by the heater on the second phase in mW.


                                Aggregation type: Time-Weighted average

                                '
                            powerL3:
                              type: number
                              format: double
                              description: 'Power measured by the heater on the third phase in mW.


                                Aggregation type: Time-Weighted average

                                '
                            temperature:
                              type: number
                              format: double
                              description: 'The room or water temperature measured by the heater in °C.


                                Aggregation type: Time-Weighted average

                                '
                            minTemperature:
                              type: number
                              format: double
                              description: 'The minimum room or water temperature measured by the heater in °C.


                                Aggregation type: Min

                                '
                            maxTemperature:
                              type: number
                              format: double
                              description: 'The maximum room or water temperature measured by the heater in °C.


                                Aggregation type: Max

                                '
                            status:
                              type: string
                              enum:
                              - UNKNOWN
                              - 'OFF'
                              - START_UP
                              - ACTIVE
                              - KILL_MODE
                              - ERROR
                              - UNSUPPORTED
                              description: 'The operational status of the heater.


                                Aggregation type: Last

                                '
                        x-readme-ref-name: measurements.HeaterMeasurement
                      description: List of heater measurements.
                  required:
                  - type
                  - measurements
                  x-readme-ref-name: AssetHeaterMeasurements
