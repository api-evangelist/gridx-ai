openapi: 3.2.0
info:
  title: Gridx Ai Webhook API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Webhook across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Webhook
  x-displayName: Webhook
paths:
  /accounts/{accountID}/webhooks:
    get:
      operationId: listWebhookSubscriptions
      summary: List all Webhook Subscriptions
      x-badges:
      - label: beta
        color: orange
      description: Lists all webhook subscriptions for the account.
      tags:
      - Webhook
      security:
      - HeaderAuth:
        - WebhooksRead
      parameters:
      - name: accountID
        description: 'Unique identifier used to access an account.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 17874c1b-d073-4b06-bf01-a1497fbe1142
      responses:
        '200':
          description: Returns the list of webhook subscriptions.
          content:
            application/json:
              schema:
                type: object
                description: Returns a list of webhook subscriptions.
                required:
                - webhookSubscriptions
                properties:
                  webhookSubscriptions:
                    type: array
                    items:
                      allOf:
                      - required:
                        - id
                        - accountID
                        - createdAt
                        - createdBy
                        - active
                        - eventTypes
                        - targetURL
                        properties:
                          id:
                            type: string
                            format: uuid
                            readOnly: true
                          accountID:
                            type: string
                            format: uuid
                            readOnly: true
                          createdAt:
                            type: string
                            format: date-time
                            readOnly: true
                          createdBy:
                            type: string
                            format: uuid
                            readOnly: true
                      - type: object
                        properties:
                          active:
                            type: boolean
                            description: If not active, a webhook subscription doesn't react to events in the account.
                            externalDocs:
                              description: Webhook receiver guide
                              url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#consecutive-failures
                          eventTypes:
                            type: array
                            items:
                              type: string
                              description: Subscribable event type.
                              enum:
                              - appliance/create
                              - appliance/delete
                              - appliance/offline
                              - appliance/online
                              - appliance/update
                              - ev/charge-failed
                              - ev/charge-started
                              - ev/charge-stopped
                              - ev/control
                              - ev/create
                              - ev/delete
                              - ev/infeasible-charging-goals
                              - ev/measurement
                              - ev/plugged
                              - ev/unplugged
                              - ev/update
                              - gateway/create
                              - gateway/offline
                              - gateway/online
                              - grid-signal-processor/limitation-of-power-consumption/set
                              - grid-signal-processor/limitation-of-power-consumption/unset
                              - inverter/status
                              - system/action
                              x-readme-ref-name: WebhookSubscriptionEventType
                            minItems: 1
                            uniqueItems: true
                            description: The list of event types to subscribe to.
                            example:
                            - appliance/online
                            - appliance/offline
                            externalDocs:
                              description: Webhook receiver guide
                              url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#supported-event-types
                          targetURL:
                            type: string
                            format: uri
                            description: Matching events will be sent to this URL via HTTP POST requests.
                            example: https://example.com/hooks/xenon
                            externalDocs:
                              description: Webhook receiver guide
                              url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#handling-webhook-event-requests
                        x-readme-ref-name: WebhookSubscriptionBase
                      - description: Returns a webhook subscription.
                      x-readme-ref-name: WebhookSubscriptionResponse
                x-readme-ref-name: WebhookSubscriptionListResponse
        default:
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - type: object
                  description: "Error schema, that supports both:\n  - [gridX Exception schema](https://raw.githubusercontent.com/grid-x/api/refs/heads/main/partials/schemas/Exception.yaml)\n  - [Problem Details schema (RFC 9457)](https://datatracker.ietf.org/doc/html/rfc9457)"
                  required:
                  - status
                  - title
                  properties:
                    type:
                      type: string
                    status:
                      type: integer
                      format: int32
                    title:
                      type: string
                    detail:
                      type: string
                    instance:
                      type: string
                x-readme-ref-name: Error
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/accounts/accountID/webhooks"


          headers = {"accept": "application/json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/accounts/accountID/webhooks \\\n     --header 'accept: application/json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/accounts/accountID/webhooks\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/json'}};\n\nfetch('https://api.gridx.de/accounts/accountID/webhooks', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/accounts/accountID/webhooks\")\n  .get()\n  .addHeader(\"accept\", \"application/json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/accounts/accountID/webhooks\")\n  .get()\n  .addHeader(\"accept\", \"application/json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/accounts/accountID/webhooks")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/accounts/accountID/webhooks");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    post:
      operationId: createWebhookSubscription
      summary: Create a Webhook Subscription
      x-badges:
      - label: beta
        color: orange
      description: 'Creates a new webhook subscription for the account.


        The new webhook subscription''s HMAC secret will be returned only in this operation''s response. It can''t be

        retrieved again from the API.'
      tags:
      - Webhook
      security:
      - HeaderAuth:
        - WebhooksWrite
      parameters:
      - name: accountID
        description: 'Unique identifier used to access an account.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 17874c1b-d073-4b06-bf01-a1497fbe1142
      requestBody:
        description: Input parameters for creating a new webhook subscription in the account.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  active:
                    type: boolean
                    description: If not active, a webhook subscription doesn't react to events in the account.
                    externalDocs:
                      description: Webhook receiver guide
                      url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#consecutive-failures
                  eventTypes:
                    type: array
                    items:
                      type: string
                      description: Subscribable event type.
                      enum:
                      - appliance/create
                      - appliance/delete
                      - appliance/offline
                      - appliance/online
                      - appliance/update
                      - ev/charge-failed
                      - ev/charge-started
                      - ev/charge-stopped
                      - ev/control
                      - ev/create
                      - ev/delete
                      - ev/infeasible-charging-goals
                      - ev/measurement
                      - ev/plugged
                      - ev/unplugged
                      - ev/update
                      - gateway/create
                      - gateway/offline
                      - gateway/online
                      - grid-signal-processor/limitation-of-power-consumption/set
                      - grid-signal-processor/limitation-of-power-consumption/unset
                      - inverter/status
                      - system/action
                      x-readme-ref-name: WebhookSubscriptionEventType
                    minItems: 1
                    uniqueItems: true
                    description: The list of event types to subscribe to.
                    example:
                    - appliance/online
                    - appliance/offline
                    externalDocs:
                      description: Webhook receiver guide
                      url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#supported-event-types
                  targetURL:
                    type: string
                    format: uri
                    description: Matching events will be sent to this URL via HTTP POST requests.
                    example: https://example.com/hooks/xenon
                    externalDocs:
                      description: Webhook receiver guide
                      url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#handling-webhook-event-requests
                x-readme-ref-name: WebhookSubscriptionBase
              - description: Request body for creating a new webhook subscription.
                required:
                - active
                - eventTypes
                - targetURL
                properties:
                  secret:
                    type: string
                    minLength: 44
                    example: whsec_89d31d45a90e309f4e24b7a1e0503f56b5c9d92e59e78216d61f369f64985223c72b4c53d8e96f10a8d7c4912b5e60f78c9d0a6e8f4c5a3d8b5e60d7c4912b5e6
                    externalDocs:
                      description: See our documentation on request integrity verification.
                      url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#verify-request-integrity
                    description: "The HMAC SHA-512 secret key. \n\nIf not provided, an HMAC secret will be generated by us.\n\nIt's recommended to use a key that's at least as long as the output of the SHA-512 hashing function. \nThis means, it should be at least 64 bytes long, which is 44 characters with base64 encoding or 64 \ncharacters with hex encoding. Any UTF-8 string will be accepted, so a prefix like `whsec_` can be \nprepended if desired."
              x-readme-ref-name: WebhookSubscriptionCreationRequest
      responses:
        '201':
          description: Returns the new webhook subscription and its HMAC secret.
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - required:
                    - id
                    - accountID
                    - createdAt
                    - createdBy
                    - active
                    - eventTypes
                    - targetURL
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                      accountID:
                        type: string
                        format: uuid
                        readOnly: true
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                      createdBy:
                        type: string
                        format: uuid
                        readOnly: true
                  - type: object
                    properties:
                      active:
                        type: boolean
                        description: If not active, a webhook subscription doesn't react to events in the account.
                        externalDocs:
                          description: Webhook receiver guide
                          url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#consecutive-failures
                      eventTypes:
                        type: array
                        items:
                          type: string
                          description: Subscribable event type.
                          enum:
                          - appliance/create
                          - appliance/delete
                          - appliance/offline
                          - appliance/online
                          - appliance/update
                          - ev/charge-failed
                          - ev/charge-started
                          - ev/charge-stopped
                          - ev/control
                          - ev/create
                          - ev/delete
                          - ev/infeasible-charging-goals
                          - ev/measurement
                          - ev/plugged
                          - ev/unplugged
                          - ev/update
                          - gateway/create
                          - gateway/offline
                          - gateway/online
                          - grid-signal-processor/limitation-of-power-consumption/set
                          - grid-signal-processor/limitation-of-power-consumption/unset
                          - inverter/status
                          - system/action
                          x-readme-ref-name: WebhookSubscriptionEventType
                        minItems: 1
                        uniqueItems: true
                        description: The list of event types to subscribe to.
                        example:
                        - appliance/online
                        - appliance/offline
                        externalDocs:
                          description: Webhook receiver guide
                          url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#supported-event-types
                      targetURL:
                        type: string
                        format: uri
                        description: Matching events will be sent to this URL via HTTP POST requests.
                        example: https://example.com/hooks/xenon
                        externalDocs:
                          description: Webhook receiver guide
                          url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#handling-webhook-event-requests
                    x-readme-ref-name: WebhookSubscriptionBase
                  - description: Returns a webhook subscription.
                  x-readme-ref-name: WebhookSubscriptionResponse
                - type: object
                  description: Returns a new webhook subscription secret.
                  required:
                  - secret
                  properties:
                    secret:
                      type: string
                      pattern: ^whsec_[0-9a-f]{128,}$
                      readOnly: true
                      example: whsec_89d31d45a90e309f4e24b7a1e0503f56b5c9d92e59e78216d61f369f64985223c72b4c53d8e96f10a8d7c4912b5e60f78c9d0a6e8f4c5a3d8b5e60d7c4912b5e6
                      externalDocs:
                        description: See our documentation on request integrity verification.
                        url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md#verify-request-integrity
                  x-readme-ref-name: WebhookSubscriptionSecretResponse
                - description: Returns a new webhook subscription with its HMAC secret.
                x-readme-ref-name: WebhookSubscriptionCreationResponse
        default:
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - type: object
                  description: "Error schema, that supports both:\n  - [gridX Exception schema](https://raw.githubusercontent.com/grid-x/api/refs/heads/main/partials/schemas/Exception.yaml)\n  - [Problem Details schema (RFC 9457)](https://datatracker.ietf.org/doc/html/rfc9457)"
                  required:
                  - status
                  - title
                  properties:
                    type:
                      type: string
                    status:
                      type: integer
                      format: int32
                    title:
                      type: string
                    detail:
                      type: string
                    instance:
                      type: string
                x-readme-ref-name: Error
      callbacks:
        WebhookEvent:
          '{$request.body#/targetURL}':
            post:
              operationId: sendWebhookEvent
              summary: Send a Webhook Event
              description: Forward an event from the XENON account to the webhook subscription's target URL.
              externalDocs:
                description: Webhook receiver guide
                url: https://github.com/grid-x/example-webhook-receiver/blob/main/README.md
              parameters:
              - name: X-Signature
                in: header
                required: true
                description: HMAC-SHA-512 digest(s) for request integrity verification.
                schema:
                  type: string
                  pattern: ^sha512=[0-9a-fA-F]{128}(?:,\s?sha512=[0-9a-fA-F]{128})*$
                  description: "Can contain one or more digests, separated by a comma and a space (`, `). Each signature is prefixed with \n`sha512=`."
                  example: sha512=8e974e6f477383a8b27785a9c24098c1f96420377a06a6c0b396e67e37604d55b0a32d163f8202518e388d1d86d649d214c770d1820641042456578051613045
              requestBody:
                description: Forwards an event to a webhook subscription's target URL.
                required: true
                content:
                  application.json:
                    schema:
                      oneOf:
                      - allOf:
                        - type: object
                          description: 'Representation of an event in a gridX account. Follows the [CloudEvents v1.0.1 specification](

                            https://github.com/cloudevents/spec/blob/v1.0.1/spec.md).'
                          required:
                          - id
                          - source
                          - specVersion
                          - time
                          - type
                          - data
                          properties:
                            id:
                              format: uuid
                              type: string
                              description: The unique ID of the event instance.
                            time:
                              description: Time when the event has occurred in RFC3339 format.
                              format: date-time
                              type: string
                            dataContentType:
                              default: application/json
                              description: 'Content-Type indicating how to parse the `data` attribute.

                                Only ''application/json'' is supported for now. If omitted, it is guaranteed to be `application/json`.'
                              enum:
                              - application/json
                              example: application/json
                              type: string
                            specVersion:
                              description: 'The adhered CloudEvents specification version, currently "1.0".

                                Only consists of major and minor version parts, to allow patching in a backward-compatible fashion.'
                              example: '1.0'
                              type: string
                            source:
                              description: 'The source of the event is usually a resource identifier path that can be used to identify the object which

                                triggered the event.'
                              example: /systems/5eda17ec-4dc9-46d5-b3b8-c396f75a760f
                              type: string
                            correlationId:
                              description: Correlation ID to identify the request triggering the event.
                              format: uuid
                              type: string
                            type:
                              description: The type of the event.
                              type: string
                            data:
                              description: Contains the actual event payload. Deserialize depending on the `type` property.
                              type: object
                          x-readme-ref-name: WebhookEventBase
                        - properties:
                            type:
                              type: string
                              enum:
                              - appliance/create
                              - appliance/delete
                              - appliance/offline
                              - appliance/online
                              - appliance/update
                            data:
                              type: object
                              description: Payload for `appliance/*` events.
                              required:
                              - applianceID
                              - gatewayID
                              properties:
                                applianceID:
                                  description: ID of the appliance that caused this event.
                                  example: fc0a6ac7-64ce-4276-a7cd-bace946af433
                                  format: uuid
                                  type: string
                                gatewayID:
                                  description: The ID of the gateway that connects to the appliance.
                                  example: 25ccab17-cd40-4db1-a320-a986d1c15fb1
                                  format: uuid
                                  type: string
                                model:
                                  description: Model description of the appliance.
                                  example: ExampleModel
                                  type: string
                                manufacturer:
                                  description: Manufacturer of the appliance.
                                  example: ExampleManufacturer
                                  type: string
                                type:
                                  description: General type of the appliance.
                                  enum:
                                  - UNKNOWN
                                  - INVERTER
                                  - METER
                                  - EVSTATION
                                  - HEAT_PUMP
                                  - HEATER
                                  - CONTAINER
                                  example: METER
                                  type: string
                                kind:
                                  description: "Kind of the appliance is used to provide further details on the appliance configuration and mode of \noperation. \n\nThe kind property is only available for appliances with type `INVERTER` or `METER`. \n\nFor inverters, only `UNKNOWN`, `PV`, `BATTERY`, `HYBRID` and `PV_EXTERNAL` are valid values. They describe \nthe kind of connected appliance(s) and define the role of the inverter in the system. \n\nFor meters, kind specifies the appliance the meter is attached to. It resembles the location the meter is \ninstalled in."
                                  enum:
                                  - UNKNOWN
                                  - PV
                                  - BATTERY
                                  - HYBRID
                                  - PV_EXTERNAL
                                  - GRID
                                  - HEAT_PUMP
                                  - FUEL_CELL
                                  - HEAT_PUMP_EXTERNAL
                                  - EVSTATION
                                  - BTTP
                                  - HEATING
                                  - MISC
                                  - CLUSTER
                                  - WIND_TURBINE
                                  example: BATTERY
                                  type: string
                                name:
                                  description: The name of the appliance as defined by the customer.
                                  example: ExampleMeter
                                  type: string
                                serialNumber:
                                  description: Serial number of the appliance as returned by the appliance.
                                  example: '9312355'
                                  type: string
                                firmware:
                                  description: Firmware version of the appliance.
                                  type: string
                                parent:
                                  description: ID of the parent appliance, if any.
                                  type: string
                                gatewayType:
                                  description: Type of the gateway the appliance is connected to.
                                  example: GRIDBOX
                                  type: string
                                systemID:
                                  description: The ID of the system that the gateway and appliance run in.
                                  example: c9db369e-7cf8-4ad1-ade5-46f61a5125c2
                                  format: uuid
                                  type: string
                                systemName:
                                  description: Name of the system as defined by the customer.
                                  example: ExampleSystem
                                  type: string
                              x-readme-ref-name: ApplianceEventData
                        x-readme-ref-name: ApplianceEvent
                      - allOf:
                        - type: object
                          description: 'Representation of an event in a gridX account. Follows the [CloudEvents v1.0.1 specification](

                            https://github.com/cloudevents/spec/blob/v1.0.1/spec.md).'
                          required:
                          - id
                          - source
                          - specVersion
                          - time
                          - type
                          - data
                          properties:
                            id:
                              format: uuid
                              type: string
                              description: The unique ID of the event instance.
                            time:
                              description: Time when the event has occurred in RFC3339 format.
                              format: date-time
                              type: string
                            dataContentType:
                              default: application/json
                              description: 'Content-Type indicating how to parse the `data` attribute.

                                Only ''application/json'' is supported for now. If omitted, it is guaranteed to be `application/json`.'
                              enum:
                              - application/json
                              example: application/json
                              type: string
                            specVersion:
                              description: 'The adhered CloudEvents specification version, currently "1.0".

                                Only consists of major and minor version parts, to allow patching in a backward-compatible fashion.'
                              example: '1.0'
                              type: string
                            source:
                              description: 'The source of the event is usually a resource identifier path that can be used to identify the object which

                                triggered the event.'
                              example: /systems/5eda17ec-4dc9-46d5-b3b8-c396f75a760f
                              type: string
                            correlationId:
                              description: Correlation ID to identify the request triggering the event.
                              format: uuid
                              type: string
                            type:
                              description: The type of the event.
                              type: string
                            data:
                              description: Contains the actual event payload. Deserialize depending on the `type` property.
                              type: object
                          x-readme-ref-name: WebhookEventBase
                        - properties:
                            type:
                              type: string
                              enum:
                              - ev/measurement
                            data:
                              type: object
                              description: Measurement event (issued by the EV).
                              required:
                              - issuedAt
                              - atHome
                              - type
                              - systemID
                              - assetID
                              - gatewayID
                              - chargePower
                              - chargeState
                              - plugState
                              - isControllable
                              properties:
                                issuedAt:
