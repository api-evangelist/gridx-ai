                      type: string
                      format: uuid
                      description: Reference to the user to which the API token belongs. Can be used to set the token's "scope" by assigning groups to the user.
                      example: 123ee525-669f-45de-9bca-bf5a51829de3
                  required:
                  - user
                  - userID
                x-readme-ref-name: OrganizationalAPIToken
