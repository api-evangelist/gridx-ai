  /account/tokens/{tokenID}/rotate:
    post:
      operationId: rotateOrganizationalApiToken
      summary: Rotate an existing organizational API token
      description: 'Rotates a non-expired organizational API token for the given token ID by creating and returning a new token

        with the same properties as the original one, specified by the `tokenID` path parameter.

        The new token''s expiry date is based on the original one extended by the value specified in the `lifetime` query parameter.

        The original token''s permissions are copied verbatim.'
      parameters:
      - name: tokenID
        in: path
        description: Identifier of the original token to rotate.
        required: true
        schema:
          type: string
          format: uuid
        example: 218e8795-2442-42d7-901b-1588373e527f
      - name: lifetime
        description: Lifetime to add to the original token's expiry date.
        required: false
        in: query
        example: 1D
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - 1Y
      tags:
      - Token
      security:
      - HeaderAuth:
        - RotateAPIToken
      responses:
        '201':
          description: A new API token with the same properties as the original one, but with extended lifetime.
          content:
