    get:
      operationId: getOrganizationalApiToken
      summary: Get an organizational API token
      description: Retrieve the given organizational API token for the currently authenticated account.
      parameters:
      - name: tokenID
        in: path
        description: Identifier of the token.
        required: true
        schema:
          type: string
          format: uuid
        example: 218e8795-2442-42d7-901b-1588373e527f
      tags:
      - Token
      security:
      - HeaderAuth:
        - GetAPIToken
      responses:
        '200':
          description: API token
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: OrganizationalAPIToken
                allOf:
                - allOf:
                  - title: APIToken
                    description: 'API Tokens can be used as an alternative to Bearer Authentication for making requests.

                      They are instead used as an in-header API Key.

                      '
                    type: object
                    properties:
                      description:
                        type: string
                        example: My api token
                      expiresAt:
                        type: string
                        format: date-time
                        description: 'Time at which the token expires in UTC using the RFC3339 format.


                          **WARNING** - if `expiresAt` is not set, the token will never expire. We strongly recommend

                          that you set an expiration date to help keep your account and information secure.

                          '
                        example: '2021-11-10T23:00:00Z'
                    x-readme-ref-name: AbstractAPIToken
                  - properties:
                      id:
                        type: string
                        format: uuid
                        example: fc8ee525-669f-45de-9bca-bf5a51829de3
                        readOnly: true
                      createdAt:
                        type: string
                        description: Time at which the token was created in UTC using the RFC3339 format.
                        example: '2021-10-10T23:20:50Z'
                        format: date-time
                        readOnly: true
                    required:
                    - id
                    - createdAt
                  x-readme-ref-name: APIToken
                - properties:
                    user:
                      title: User
                      description: Represents a user of the Xenon platform.
                      type: object
                      properties:
                        id:
                          description: Unique identifier of the user.
                          type: string
                          format: uuid
                          example: 43a4f165-8233-426b-a1a4-e569665a25dd
                          readOnly: true
                        accountID:
                          description: Unique identifier of the account that the user belongs to.
                          type: string
                          format: uuid
                          example: 6dd0a658-5828-4d30-bc65-a03c6d6e425f
                          readOnly: true
                        newPassword:
                          description: Used to set a new password for the user.
                          type: string
                          writeOnly: true
                        loginsCount:
                          description: Number of user logins.
                          type: integer
                          readOnly: true
                        mfaEnabled:
                          description: Indicates whether MFA (Multi-Factor Authentication) is enabled.
                          type: boolean
                          readOnly: true
                        mfaReset:
                          description: Can be set to true if MFA (Multi-Factor Authentication) needs to to be reset. This will remove the MFA.
                          type: boolean
                          writeOnly: true
                        createdAt:
                          description: Time at which the user was created in UTC using the RFC3339 format.
                          type: string
                          format: date-time
                          example: '2009-11-10T23:20:50Z'
                          readOnly: true
                        updatedAt:
                          description: Time at which the user was last updated in UTC using the RFC3339 format.
                          type: string
                          format: date-time
                          example: '2009-11-10T23:20:50Z'
                          readOnly: true
                        fullName:
                          description: Full name of the user typically consisting of first name and last name.
                          type: string
                          example: John Doe
                        email:
                          description: The email address of the user that is used for login.
                          type: string
                          format: email
                          example: john@doe.com
                        groups:
                          description: Policy groups attached to this user which determine the effective permissions through policies.
                          type: array
                          items:
                            title: Policy Group
                            type: object
                            allOf:
                            - title: Policy Group
                              description: 'A policy group describes the permissions of a group.


                                This is the base type for the more concrete usages and not used directly within operations.

                                '
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Name of the policy group.
                                  example: group name
                                description:
                                  type: string
                                  description: Description of the group, omitted if empty
                                  example: Group provides read-access to accounts
                              x-readme-ref-name: AbstractPolicyGroup
                            - properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique identifier of the policy group.
                                  example: 97874c1b-d073-4b06-bf01-a1497fbe1146
                                  readOnly: true
                                accountID:
                                  type: string
                                  format: uuid
                                  description: Unique identifier of the creator account.
                                  example: 97874c1b-d073-4b06-bf01-a1497fbe1146
                                  readOnly: true
                                createdAt:
                                  description: Time at which the policy group was created in UTC (RFC 3339 format).
                                  type: string
                                  format: date-time
                                  example: '2019-11-06T15:33:00Z'
                                  readOnly: true
                                updatedAt:
                                  description: Time at which the policy group was last updated in UTC (RFC 3339 format).
                                  type: string
                                  format: date-time
                                  example: '2019-11-08T23:20:50Z'
                                  readOnly: true
                                userCount:
                                  type: integer
                                  description: Amount of users that are in this group.
                                  example: 10
                                  readOnly: true
                              required:
                              - id
                              - name
                              - accountID
                              - createdAt
                              - updatedAt
                            x-readme-ref-name: PolicyGroup
                        mainAddress:
                          title: Address
                          description: Represents a physical address of a customer.
                          allOf:
