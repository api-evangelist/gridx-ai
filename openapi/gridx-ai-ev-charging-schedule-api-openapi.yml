openapi: 3.2.0
info:
  title: Gridx Ai EV Charging Schedule API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged EV Charging Schedule across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: EV Charging Schedule
  x-displayName: EV Charging Schedule
paths:
  /systems/{systemID}/evcharging-schedules:
    get:
      deprecated: true
      operationId: listSystemEVChargingSchedules
      summary: List a System's EV charging schedules
      description: 'Lists EV charging schedules that belong to the specified system.


        It only contains the currently active schedules and schedules to be active in the

        next 24 hours.'
      tags:
      - EV Charging Schedule
      security:
      - HeaderAuth:
        - SchedulesRead
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Returned currently active and upcoming EV charging schedules.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  title: EV Charging Schedule
                  type: object
                  allOf:
                  - title: EV Charging Schedule
                    description: 'An Electric Vehicle charging schedule represents an interval in which

                      the electric vehicle is supposed to charge at a defined limit.

                      '
                    type: object
                    properties:
                      from:
                        type: string
                        format: date-time
                        example: '2021-11-04T00:00:00Z'
                        description: 'Specifies when the schedule should start in RFC3339 format.

                          '
                      to:
                        type: string
                        format: date-time
                        example: '2021-11-04T00:30:00Z'
                        description: 'Specifies when the schedule should end in RFC3339 format.

                          '
                      limit:
                        description: 'The maximum amount of power in Watts that will be used for scheduling charging in the interval [from, to].

                          '
                        example: 75000
                        title: Positive Power in Watt.
                        type: integer
                        format: int64
                        minimum: 0
                        x-readme-ref-name: PositivePower
                    x-readme-ref-name: AbstractEVChargingSchedule
                  - properties:
                      id:
                        type: string
                        format: uuid
                        example: ec4d0c89-a604-49ac-82f0-427f9cb42204
                        readOnly: true
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Specifies when the schedule was updated the last time.
                  - required:
                    - id
                    - from
                    - to
                    - limit
                  x-readme-ref-name: EVChargingSchedule
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: System not found
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '422':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Validation
                  description: 'Validation indicates that the request body contains fields which

                    does not pass the validation.

                    '
                  type: object
                  required:
                  - message
                  - details
                  example:
                    message: Validation failed
                    details:
                    - email is not valid
                x-readme-ref-name: InvalidException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/systems/systemID/evcharging-schedules"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
