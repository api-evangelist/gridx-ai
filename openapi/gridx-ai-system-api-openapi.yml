        If the account does not have access to the system, this operation is a no-op. It will give a successful response, but nothing is done.


        If the account is an end-user:

        - The end-user is unassigned from the system.

        If the account is a b2b:

        - The system is unassigned from the account, and any currently assigned end-user accounts are moved to its parent.


        It is not possible to:

        - Unassign a system with end-users from a b2b account whose parent is in a different audience. Any end-users must first be deleted.


        When a system gets unassigned from a b2b account, its product option may be unassigned if it is no longer reachable from its parent.

        If the parent has any default product options, they will be assigned, unless the system was already assigned to a product option which is still reachable from the parent.'
