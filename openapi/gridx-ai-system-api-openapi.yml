      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/systems/systemID/live\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/systems/systemID/live', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/systems/systemID/live\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/systems/systemID/live\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/systems/systemID/live")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/systems/systemID/live");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    servers:
    - url: https://api.gridx.de
      description: Production
  /systems/{systemID}/historical:
    get:
      operationId: getSystemHistoricalMeasurements
      summary: Historical Measurements for Systems
      description: 'Lists aggregated measurements of a system over a period of time.


        System measurements are the result of incorporating measurements from

        all appliances that are part of a system. This allows computing e.g.

        overall consumption adding producers (e.g. PV) and subtracting consumers

        (e.g. EV charging stations). This aggregation is performed in various

        resolutions to suit different use cases. See the ''resolution'' parameter

        for a list of options.


        Depending on the resolution parameter, the response contains either

        power or energy measurements (unless otherwise documented):

        - **power** (unit: W): `15m`, `1h`

        - **energy** (unit: Wh): `1d`, `1w`, `1M`


        Measurements are "aligned" differently whether they contain energy or

        power measurements:

        - For power values the data point is written after the aggregated time

        span. For the interval 2018-04-01T00:00:00Z/2018-04-02T00:00:00Z

        with resolution 15m the first observation will be recorded at

        2018-04-01T00:15:00Z

        - For energy values the observation is stored at the beginning of

        the aggregated time span. For the interval

        2018-04-01T00:00:00Z/2018-04-05T00:00:00Z and resolution 1d the first

        observation will be recorded at 2018-04-01T00:00:00Z


        The `total` object of the response contains an aggregation of the

        individual data points over time and therefore is an energy value.

        The `total.measuredAt` field is an interval containing all data points

        in the requested interval.


        In order to reduce the duration of the endpoint, the gridX API imposes

        limitations on the interval for a given resolution:


        | Resolution | Limit |

        |------------|-------------------------|

        | 15m | intervals up to 1 day |

        | 1h | intervals up to 1 week |

        | 1d | intervals up to 1 month |

        | 1w | intervals up to 1 month |

        | 1M | intervals up to 5 years |'
