      security:
      - HeaderAuth:
        - SystemsRead
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/systems"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/systems \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/systems\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/systems', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/systems\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/systems\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/systems")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/systems");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    post:
      operationId: createSystem
      summary: Create a System
      description: Creates a System.
      tags:
      - System
      parameters: []
      requestBody:
        description: The body of a system creation request.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                allOf:
                - title: System
                  description: "A System represents the logical view of one gateway and its appliances.\n\nFor example, a household can be represented as a system with a gateway such as a \ngridBox, and its connected appliances.\n"
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      maxLength: 200
                      description: Name of the System.
                      example: gridX Headquarter
                    solution:
                      type: string
                      description: "Represents the solution that the system uses:\n- HOME if the system is for a household. \n- CHARGE if the system is for charging station fleet management.\n"
                      x-extensible-enum:
                      - HOME
                      - CHARGE
                      - GENERAL
                      - SMART_DISTRICT
                      - MICROGRID
                      - HOME_VIRTUAL_METERING
                      - COMMERCIAL
                      - CUSTOM_P2P
                      x-readme-ref-name: SystemSolution
                    priorities:
                      description: Allows prioritisation of EMS functionalities by appliance type. Accepted values are ["BATTERY", "EV", "HEATPUMP", "HEATER"].
                      type: array
                      items:
                        type: string
                      example:
                      - EV
                      - BATTERY
                    appliancePriorities:
                      type: array
                      description: 'Allows prioritisation of EMS functionalities by appliance UUIDs.

                        This option takes precendence over `priorities` field as it is more explicit.

                        '
                      items:
                        type: string
                        format: uuid
                    plan:
                      description: "Charge plan of the system. Must be one of two possible options: \n  * `2020_DLM_EVS_00` - Use this value for Dynamic Load Management.\n  * `2020_SLM_EVS_00` - Use this value for Static Load Management.\n"
                      type: string
                      x-extensible-enum:
                      - 2020_DLM_EVS_00
                      - 2020_SLM_EVS_00
                      x-readme-ref-name: SystemChargePlan
                    operatingSince:
                      type: string
                      format: date-time
                      description: Date since when the system is active in RFC3339 format.
                      example: '2017-12-23T10:15:40Z'
                    curtailmentStrategy:
                      type: string
                      deprecated: true
                      description: "Deprecated: Only EQUALLY remains available and future implementations will likely use another field name.\nThe curtailment strategy describes how appliances shall be curtailed.\n  * EQUALLY: Every appliance gets equally (fair) curtailed.\n"
                      x-extensible-enum:
                      - EQUALLY
                      x-readme-ref-name: SystemCurtailmentStrategy
