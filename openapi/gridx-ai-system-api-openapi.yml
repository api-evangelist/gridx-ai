openapi: 3.2.0
info:
  title: Gridx Ai System API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged System across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: System
  x-displayName: System
paths:
  /systems/{systemID}/live:
    get:
      operationId: getSystemLiveMeasurements
      summary: Retrieve System's Live Measurement
      description: Retrieves a system's latest aggregated measurement.
      tags:
      - System
      security:
      - HeaderAuth:
        - SystemMeasurementsRead
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Successfully returned system's live measurements.
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: Measurement
                type: object
                properties:
                  measuredAt:
                    type: string
                    format: date-time
                    example: '2018-04-01T00:10:00Z'
                    description: "Date and time at which the data point was observed.\nFor power values the data point is written after the aggregated \ntime span. For energy values the observation is stored at the \nbeginning of the aggregated time span.\n"
                  grid:
                    type: number
                    format: double
                    description: 'Grid is the measured power/energy at the grid connection point.


                      For power values, Positive values indicate supply, Negative values

                      indicate feed in.

                      '
                  gridL1:
                    type: number
                    format: double
                    description: "GridL1 is the power/energy measured at the grid connection point's \nfirst phase.\n"
                  gridL2:
                    type: number
                    format: double
                    description: "GridL2 is the power/energy measured at the grid connection point's \nsecond phase.\n"
                  gridL3:
                    type: number
                    format: double
                    description: "GridL3 is the power/energy measured at the grid connection point's \nthird phase.\n"
                  gridSupplyLimit:
                    type: number
                    format: double
                    description: 'GridSupplyLimit is the restriction of supplied power at the grid

                      connection point.

                      '
                  photovoltaic:
                    type: number
                    format: double
                    description: 'Photovoltaic is the measured power/energy in front of the

                      photovoltaic systems.

                      '
                  photovoltaicExternal:
                    type: number
                    format: double
                    description: 'PhotovoltaicExternal is the measured power/energy in front of the

                      external photovoltaic systems.

                      '
                  blockTypeThermalPowerStation:
                    type: number
                    format: double
                    description: 'BTTPPower is the measured power for the block-type thermal power

                      station.

                      '
                  fuelCell:
                    type: number
                    format: double
                    description: 'FuelCell is the measured power/energy in front of the fuel cells.

                      '
                  production:
                    type: number
                    format: double
                    description: Sum of all energy producing appliances (e.g. PV).
                  battery:
                    title: Battery Measurement
                    description: 'MeasurementBattery represents the aggregated power or energy the gateway

                      measured from a battery.

                      '
                    type: object
                    properties:
                      applianceID:
                        type: string
                        description: 'ApplianceID is the battery''s appliance ID. It is empty for

                          aggregated batteries.

                          '
                        example: a7d56cb5-2dac-48d4-952a-6eb75ee0ce18
                      power:
                        type: number
                        format: double
                        description: 'Power is the measured power used to charge/discharge the battery.


                          Unit W, Meaning, Positive values indicate discharging. Negative

                          values indicate charging.

                          '
                      charge:
                        type: number
                        format: double
                        minimum: 0
                        description: 'Charge is the measured power used to charge the battery.


                          Unit W. Positive values indicate charging power.

                          '
                      discharge:
                        type: number
                        format: double
                        minimum: 0
                        description: 'Discharge is the measured power used to discharge the battery.


                          Unit W. Positive values indicate discharging power.

                          '
                      remainingCharge:
                        type: number
                        format: double
                        description: RemainingCharge is the amount of energy left.
                      capacity:
                        type: number
                        format: double
                        description: Maximum energy the battery can provide in Wh.
                      nominalCapacity:
                        type: number
                        format: double
                        description: Nominal capacity of the battery in Wh.
                      stateOfCharge:
                        type: number
                        format: double
                        description: 'State of Charge indicates how full a battery is. Unit Percentage

                          points 0.0-1.0.

                          '
                    x-readme-ref-name: BatteryMeasurement
                  batteries:
                    type: array
                    description: Battery measurements for each battery in the system.
                    items:
                      title: Battery Measurement
                      description: 'MeasurementBattery represents the aggregated power or energy the gateway

                        measured from a battery.

                        '
                      type: object
                      properties:
                        applianceID:
                          type: string
                          description: 'ApplianceID is the battery''s appliance ID. It is empty for

                            aggregated batteries.

                            '
                          example: a7d56cb5-2dac-48d4-952a-6eb75ee0ce18
                        power:
                          type: number
                          format: double
                          description: 'Power is the measured power used to charge/discharge the battery.


                            Unit W, Meaning, Positive values indicate discharging. Negative

                            values indicate charging.

                            '
                        charge:
                          type: number
                          format: double
                          minimum: 0
                          description: 'Charge is the measured power used to charge the battery.


                            Unit W. Positive values indicate charging power.

                            '
                        discharge:
                          type: number
                          format: double
                          minimum: 0
                          description: 'Discharge is the measured power used to discharge the battery.


                            Unit W. Positive values indicate discharging power.

                            '
                        remainingCharge:
                          type: number
                          format: double
                          description: RemainingCharge is the amount of energy left.
                        capacity:
                          type: number
                          format: double
                          description: Maximum energy the battery can provide in Wh.
                        nominalCapacity:
                          type: number
                          format: double
                          description: Nominal capacity of the battery in Wh.
                        stateOfCharge:
                          type: number
                          format: double
                          description: 'State of Charge indicates how full a battery is. Unit Percentage

                            points 0.0-1.0.

                            '
                      x-readme-ref-name: BatteryMeasurement
                  heatPump:
                    type: number
                    format: double
                    description: 'Aggregated measured power/energy for heat pumps.

                      '
                  heatPumpExternal:
                    type: number
                    format: double
                    description: "Aggregated measured power/energy for heat pumps that have their own \nheat pump tariff.\n"
                  heatPumps:
                    type: array
                    description: Heat pump measurements for each heat pump in the system.
                    items:
                      title: Heat pump measurement
                      type: object
                      properties:
                        applianceID:
                          type: string
                        power:
                          type: number
                          format: double
                        sgReadyState:
                          type: string
                          default: UNKNOWN
                          enum:
                          - UNKNOWN
                          - 'OFF'
                          - AUTO
                          - RECOMMEND_ON
                          - 'ON'
                          description: Defines the state set for SG Ready.
                      x-readme-ref-name: HeatPumpMeasurement
                  evChargingStation:
                    title: 'MeasurementEVStation represents the power or energy the gateway measured

                      from a ev charging station

                      '
                    type: object
                    properties:
                      applianceID:
                        type: string
                        description: gridX API internal ID of the appliance.
                        example: a7d56cb5-2dac-48d4-952a-6eb75ee0ce18
                      power:
                        type: number
                        format: double
                        description: 'Measured power used to charge/discharge via EV station,

                          positive values indicate charging, negatives discharging.

                          '
                      charge:
                        type: number
                        format: double
                        minimum: 0
                        description: 'Charge is the measured power used to charge the EV.


                          Unit W. Positive values indicate charging power.

                          '
                      discharge:
                        type: number
                        format: double
                        minimum: 0
                        description: 'Discharge is the measured power used to discharge the EV.


                          Unit W. Positive values indicate discharging power.

                          '
                      stateOfCharge:
                        type: number
                        format: double
                        description: 'Percentage of the EVs battery capacity charged (0.0-1.0).

                          '
                      readingTotal:
                        type: number
                        format: double
                        description: The sum of all meter readings in Wh.
                      readingTariff1:
                        type: number
                        format: double
                        description: The meter reading of meter tariff 1 in Wh.
                      readingTariff2:
                        type: number
                        format: double
                        description: The meter reading of meter tariff 2 in Wh.
                      plugState:
                        type: string
                        description: Defines whether this EV is currently plugged in the charging station and whether it's charging.
                        default: UNPLUGGED
                        enum:
                        - UNPLUGGED
                        - PLUGGED_ON_STATION
                        - PLUGGED_ON_STATION_AND_PLUGGED_ON_VEHICLE
                      stationState:
                        type: string
                        description: Describes the status of the charging station. Note that this value is only meaningful in live measurements.
                        default: UNKNOWN
                        enum:
                        - UNKNOWN
                        - NOT_READY
                        - READY
                        - CHARGING
                        - CHARGING_INTERRUPTED
                        - ERROR
                        - AUTHORIZATION_REJECTED
                        - ZERO_POWER_LOCK
                        - CHARGING_IN_PHASE_SWITCH
                      currentL1:
                        type: number
                        format: double
                        description: Current of the first phase in Ampere.
                      currentL2:
                        type: number
                        format: double
                        description: Current of the second phase in Ampere.
                      currentL3:
                        type: number
                        format: double
                        description: Current of the third phase in Ampere.
                    x-readme-ref-name: EVStationMeasurement
                  evChargingStations:
                    type: array
                    description: "Charging station measurements for all charging stations that are \npart of the system.\n"
                    items:
                      title: 'MeasurementEVStation represents the power or energy the gateway measured

                        from a ev charging station

                        '
                      type: object
                      properties:
                        applianceID:
                          type: string
                          description: gridX API internal ID of the appliance.
                          example: a7d56cb5-2dac-48d4-952a-6eb75ee0ce18
                        power:
                          type: number
                          format: double
                          description: 'Measured power used to charge/discharge via EV station,

                            positive values indicate charging, negatives discharging.

                            '
                        charge:
                          type: number
                          format: double
                          minimum: 0
                          description: 'Charge is the measured power used to charge the EV.


                            Unit W. Positive values indicate charging power.

                            '
                        discharge:
                          type: number
                          format: double
                          minimum: 0
                          description: 'Discharge is the measured power used to discharge the EV.


                            Unit W. Positive values indicate discharging power.

                            '
                        stateOfCharge:
                          type: number
                          format: double
                          description: 'Percentage of the EVs battery capacity charged (0.0-1.0).

                            '
                        readingTotal:
                          type: number
                          format: double
                          description: The sum of all meter readings in Wh.
                        readingTariff1:
                          type: number
                          format: double
                          description: The meter reading of meter tariff 1 in Wh.
                        readingTariff2:
                          type: number
                          format: double
                          description: The meter reading of meter tariff 2 in Wh.
                        plugState:
                          type: string
                          description: Defines whether this EV is currently plugged in the charging station and whether it's charging.
                          default: UNPLUGGED
                          enum:
                          - UNPLUGGED
                          - PLUGGED_ON_STATION
                          - PLUGGED_ON_STATION_AND_PLUGGED_ON_VEHICLE
                        stationState:
                          type: string
                          description: Describes the status of the charging station. Note that this value is only meaningful in live measurements.
                          default: UNKNOWN
                          enum:
                          - UNKNOWN
                          - NOT_READY
                          - READY
                          - CHARGING
