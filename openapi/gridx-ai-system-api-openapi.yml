          description: The created system.
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: System
                description: "A System represents the logical view of one gateway and its appliances.\n\nFor example, a household can be represented as a system with a gateway such as a \ngridBox, and its connected appliances.\n"
                allOf:
                - title: System
                  description: "A System represents the logical view of one gateway and its appliances.\n  \nFor example, a household can be represented as a system with a gateway such as a \ngridBox, and its connected appliances.\n"
                  type: object
                  allOf:
                  - title: System
                    description: "A System represents the logical view of one gateway and its appliances.\n\nFor example, a household can be represented as a system with a gateway such as a \ngridBox, and its connected appliances.\n"
                    properties:
                      name:
                        type:
                        - string
                        - 'null'
                        maxLength: 200
                        description: Name of the System.
                        example: gridX Headquarter
                      solution:
                        type: string
                        description: "Represents the solution that the system uses:\n- HOME if the system is for a household. \n- CHARGE if the system is for charging station fleet management.\n"
                        x-extensible-enum:
                        - HOME
                        - CHARGE
                        - GENERAL
                        - SMART_DISTRICT
                        - MICROGRID
                        - HOME_VIRTUAL_METERING
                        - COMMERCIAL
                        - CUSTOM_P2P
