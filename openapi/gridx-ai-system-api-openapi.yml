                            description: Date since when the system is active in RFC3339 format.
                            example: '2017-12-23T10:15:40Z'
                          curtailmentStrategy:
                            type: string
                            deprecated: true
                            description: "Deprecated: Only EQUALLY remains available and future implementations will likely use another field name.\nThe curtailment strategy describes how appliances shall be curtailed.\n  * EQUALLY: Every appliance gets equally (fair) curtailed.\n"
                            x-extensible-enum:
