    post:
      operationId: assignSystemToAccount
      summary: Assign a System to an Account
      description: 'Assigning a (list of) system(s) to an account grants that account and its parents access to the system(s).

        If the account or one of its children already has access to the system, this operation is a no-op. It will give a successful response, but nothing is done.


        If the account is an end-user:

        - If the system is unassigned (for example after it has been created), it is moved under the end-user account''s b2b parent.

        - If the system is already assigned, the end-user is assigned and moved under the system''s lowest currently assigned b2b account.

        If the account is a b2b:

        - The system gets assigned to the account, and any currently assigned end-user accounts are moved under it.


        It is not possible to:

        - Move a system with end-users to a b2b account in a different audience. Any end-users must first be deleted.

        - Assign an end-user to a system currently assigned to a b2b account in a different audience.


        When a system gets assigned to a different b2b account, its product option may be unassigned if it is no longer reachable from the newly assigned account.

        If the newly assigned account has any default product options, they will be assigned, unless the system was already assigned to a product option which is still valid (reachable) after the move.'
      tags:
      - System
      parameters:
      - name: accountID
        description: 'Unique identifier used to access an account.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 17874c1b-d073-4b06-bf01-a1497fbe1142
      requestBody:
        description: Assign a system (and its customers) to an account.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - title: System-Account assignment
                type: object
                required:
                - uuids
                properties:
                  moveSystemsAndCustomers:
                    description: '**Deprecated** - This parameter no longer carries any logic - the behavior is `true` by default, even if `false` is set in the body.


                      - `true`: Moves the system from the origin account to the target account (accountID parameter) and its parent accounts. The customers that belong to that account are also moved to the target account.

                      - `false`: Assigns the system to the target account (accountID parameter) and its parent accounts.

                      '
                    type: boolean
                    deprecated: true
                    default: true
                  moveVendorID:
                    description: "**Deprecated** - This parameter no longer carries any logic - the behavior is `true` by default, even if `false` is set in the body.\n\n  - `true`: Updates the vendorID of the gateway of the specified system to the target accountID.\n  - `false`: Does not update the vendorID of the gateway of the specified system.\n"
                    type: boolean
                    deprecated: true
                    default: true
                  uuids:
                    description: System IDs that will be moved to the target account. It can include up to 150 System IDs.
                    type: array
                    maxItems: 150
                    items:
                      type: string
                      example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
                x-readme-ref-name: SystemAccountAssignment
              - additionalProperties: false
              x-readme-ref-name: SystemAccountAssignmentStrict
