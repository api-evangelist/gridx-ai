                            - GENERAL
                            - SMART_DISTRICT
                            - MICROGRID
                            - HOME_VIRTUAL_METERING
                            - COMMERCIAL
                            - CUSTOM_P2P
                            x-readme-ref-name: SystemSolution
                          priorities:
                            description: Allows prioritisation of EMS functionalities by appliance type. Accepted values are ["BATTERY", "EV", "HEATPUMP", "HEATER"].
                            type: array
                            items:
                              type: string
                            example:
                            - EV
                            - BATTERY
                          appliancePriorities:
                            type: array
                            description: 'Allows prioritisation of EMS functionalities by appliance UUIDs.

                              This option takes precendence over `priorities` field as it is more explicit.

                              '
                            items:
                              type: string
                              format: uuid
                          plan:
                            description: "Charge plan of the system. Must be one of two possible options: \n  * `2020_DLM_EVS_00` - Use this value for Dynamic Load Management.\n  * `2020_SLM_EVS_00` - Use this value for Static Load Management.\n"
                            type: string
                            x-extensible-enum:
                            - 2020_DLM_EVS_00
                            - 2020_SLM_EVS_00
                            x-readme-ref-name: SystemChargePlan
                          operatingSince:
                            type: string
