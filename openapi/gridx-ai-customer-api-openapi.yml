        example: 17874c1b-d073-4b06-bf01-a1497fbe1142
      requestBody:
        description: Updates an end-customer account.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  name:
                    type: string
                    example: John Doe
                    description: Name of the account, can be chosen freely but should be kept terse and descriptive.
                    minLength: 1
                    maxLength: 256
                  email:
