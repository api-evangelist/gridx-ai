paths:
  /assets/{assetID}/intent/current:
    get:
      x-badges:
      - label: draft
        color: red
      summary: Current intent and active modifiers for an asset
      description: 'Returns the latest intent reported by the EMS for the given asset, together with

        the set of modifier flags active at the most recent reporting tick.


        If the EMS has not yet reported an intent for this asset, `intent` is `null`,

        `modifiers` is an empty array, and `reportedAt` is `null`.'
      operationId: getAssetIntentCurrent
      tags:
      - Intent
      parameters:
      - name: assetID
        description: 'Unique identifier used to access an asset.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      responses:
        '200':
          description: Current intent state for the asset
          content:
            application/json:
              schema:
                type: object
                required:
                - assetID
                - intent
                - modifiers
                - reportedAt
                properties:
                  assetID:
                    type: string
                    description: The asset this state belongs to.
                    example: asset-abc-123
                  intent:
                    type:
                    - string
                    - 'null'
                    description: 'The high-level strategic goal the EMS is pursuing for the asset.

                      `null` means no intent has been reported yet for this asset.


                      | Value | Description |

                      |---|---|

                      | `INTENT_UNSPECIFIED` | Default zero value. The EMS has not set a meaningful intent for the asset. |

                      | `INTENT_SSO` | Self-sufficiency optimisation. The asset control is determined by SSO targets. |

                      | `INTENT_INTERNAL_TARGET` | The EMS is driving the asset towards an internally defined target, for example during a force-charge session. |

                      | `INTENT_EXTERNAL_TARGET` | The EMS derived its decision for the asset from an external control input via DER-API. |'
                    enum:
                    - INTENT_UNSPECIFIED
                    - INTENT_SSO
                    - INTENT_INTERNAL_TARGET
                    - INTENT_EXTERNAL_TARGET
                    example: INTENT_SSO
                    x-readme-ref-name: Intent
                  modifiers:
                    type: array
                    description: 'The set of modifier flags active at the most recent reporting tick.

                      A tick is one aggregation window (currently one minute). Multiple modifiers

                      can be present simultaneously because each constraint is evaluated independently:

                      for example, an import limit and a fuse protection limit can both apply to

                      the same decision at the same tick.


                      | Value | Description |

                      |---|---|

                      | `MODIFIER_LIMITED_BY_FEED_IN` | Output is capped by a feed-in limitation regulation (e.g. EEG §9, G100). |

                      | `MODIFIER_LIMITED_BY_TAKEOFF` | Output is capped by a grid takeoff limitation (e.g. §14a, G100). |

                      | `MODIFIER_LIMITED_BY_SURPLUS` | The asset is operating in surplus-charge mode; insufficient power is available to increase the power allocation. |

                      | `MODIFIER_LIMITED_INTERNALLY` | An internal hardware limit or configuration from API is limiting the asset. |

                      | `MODIFIER_LIMITED_EXTERNALLY` | An external DER-API signal is limiting the asset. |

                      | `MODIFIER_FUSE_PROTECTION` | The asset is limited due to system fuse limits. |

                      | `MODIFIER_MINIMUM_POWER_NOT_REACHED` | The available or requested power is below the asset''s minimum threshold to charge. |'
                    items:
                      type: string
                      description: 'A real-time constraint that qualifies how the core intent is being executed.


                        | Value | Description |

                        |---|---|

                        | `MODIFIER_LIMITED_BY_FEED_IN` | Output is capped by a feed-in limitation regulation (e.g. EEG §9, G100). |

                        | `MODIFIER_LIMITED_BY_TAKEOFF` | Output is capped by a grid takeoff limitation (e.g. §14a, G100). |

                        | `MODIFIER_LIMITED_BY_SURPLUS` | The asset is operating in surplus-charge mode; insufficient power is available to increase the power allocation. |

                        | `MODIFIER_LIMITED_INTERNALLY` | An internal hardware limit or configuration from API is limiting the asset. |

                        | `MODIFIER_LIMITED_EXTERNALLY` | An external DER-API signal is limiting the asset. |

                        | `MODIFIER_FUSE_PROTECTION` | The asset is limited due to system fuse limits. |

                        | `MODIFIER_MINIMUM_POWER_NOT_REACHED` | The available or requested power is below the asset''s minimum threshold to charge. |'
                      enum:
                      - MODIFIER_LIMITED_BY_FEED_IN
                      - MODIFIER_LIMITED_BY_TAKEOFF
                      - MODIFIER_LIMITED_BY_SURPLUS
                      - MODIFIER_LIMITED_INTERNALLY
                      - MODIFIER_LIMITED_EXTERNALLY
                      - MODIFIER_FUSE_PROTECTION
                      - MODIFIER_MINIMUM_POWER_NOT_REACHED
                      x-readme-ref-name: Modifier
                    example:
                    - MODIFIER_LIMITED_BY_FEED_IN
                    - MODIFIER_LIMITED_BY_SURPLUS
                  reportedAt:
                    type: string
                    format: date-time
                    description: 'Timestamp of the most recent report that produced this state.

                      `null` if the EMS has not yet reported for this asset.'
                    example: '2026-06-09T10:05:00Z'
                x-readme-ref-name: AssetIntentCurrent
              examples:
                sso_with_modifiers:
                  summary: Asset controlled for SSO, with two active limitations
                  description: "The EMS is running self-sufficiency optimisation. \nTwo modifiers are active simultaneously for the decision \nas the asset is limited by fuse protection (phase specific limits) and total \nimport power limits."
                  value:
                    assetID: asset-abc-123
                    intent: INTENT_SSO
                    modifiers:
                    - MODIFIER_FUSE_PROTECTION
                    - MODIFIER_LIMITED_BY_TAKEOFF
                    reportedAt: '2026-06-09T10:05:00Z'
                external_target_and_limit:
                  summary: Asset controlled according to external target, with one active external limitations
                  description: 'The EMS is controlling the asset according to an external target (e.g. Time-of-Use).

                    At the same time, the asset is also limited to a reduced operating range.

                    One example of this is following a specific external battery-charge target, but preventing

                    charging too quickly (for example if there is additional local surplus).'
                  value:
                    assetID: asset-abc-123
                    intent: INTENT_EXTERNAL_TARGET
                    modifiers:
                    - MODIFIER_LIMITED_EXTERNALLY
                    reportedAt: '2026-06-09T10:05:00Z'
                no_intent_yet:
                  summary: EMS has not reported yet
                  description: 'The EMS has not sent a report for this asset. All fields are null and

                    modifiers is empty.'
                  value:
                    assetID: asset-abc-123
                    intent: null
                    modifiers: []
                    reportedAt: null
        '400':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
