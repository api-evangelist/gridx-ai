  /assets/{assetID}/intent/history:
    get:
      x-badges:
      - label: draft
        color: red
      summary: Historical intent and modifier segments for an asset
      description: 'Returns closed `[from, to)` intervals during which a given intent or modifier was

        continuously active, bounded by the requested time range.


        **Intent segments** are derived from the sparse change-event log. A gap between

        two segments means the EMS reported a different intent during that period.


        **Modifier segments** are derived from the minute-resolution modifier log.

        A gap of more than one reporting tick (> 1 minute) closes a segment. The

        `gapTolerance` parameter overrides this threshold.


        A segment with `to` omitted was still active at query time and was not clipped by

        the `to` boundary. A segment whose `to` equals the request `to` was clipped at

        the query boundary and may still be ongoing.


        The maximum allowed range between `from` and `to` is 30 days.


        For examples, see also `/assets/{assetID}/intent/current`.'
      operationId: getAssetIntentHistory
      tags:
      - Intent
      parameters:
      - name: assetID
        description: 'Unique identifier used to access an asset.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      - name: from
        in: query
        required: true
        description: Start of the time range (inclusive), RFC 3339.
        schema:
          type: string
          format: date-time
        example: '2026-06-09T08:00:00Z'
      - name: to
        in: query
        required: true
        description: End of the time range (exclusive), RFC 3339.
        schema:
          type: string
          format: date-time
        example: '2026-06-09T10:00:00Z'
      - name: gapTolerance
        in: query
        required: false
        description: 'Maximum gap between consecutive modifier reports before the segment is considered

          closed, expressed as a duration string (e.g. `2m`, `5m`). Defaults to `2m`.'
        schema:
          type: string
          default: 2m
        example: 2m
      responses:
        '200':
          description: Intent and modifier segments within the requested range
          content:
            application/json:
              schema:
                type: object
                required:
                - assetID
                - from
                - to
                - intentSegments
                - modifierSegments
                properties:
                  assetID:
                    type: string
                    example: asset-abc-123
                  from:
                    type: string
                    format: date-time
                    description: The requested range start (echoed back).
                    example: '2026-06-09T08:00:00Z'
                  to:
                    type: string
                    format: date-time
                    description: The requested range end (echoed back).
                    example: '2026-06-09T10:00:00Z'
                  intentSegments:
                    type: array
                    description: 'Intervals during which a specific intent was active, ordered by `from` ascending.

                      Intent is a point-in-time value: exactly one intent is active per asset at any

                      given timestamp, so these segments never overlap and together partition the

                      timeline within the requested range.'
                    items:
                      type: object
                      required:
                      - from
                      - intent
                      description: A closed interval during which the asset held a specific intent.
                      properties:
                        from:
                          type: string
                          format: date-time
                          description: Start of the interval (inclusive).
                          example: '2026-06-09T08:00:00Z'
                        to:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'End of the interval (exclusive). Omitted when the intent is still active at

                            query time and was not clipped by the request `to` boundary.'
                          example: '2026-06-09T09:30:00Z'
                        intent:
                          type:
                          - string
                          - 'null'
                          description: 'The high-level strategic goal the EMS is pursuing for the asset.

                            `null` means no intent has been reported yet for this asset.


                            | Value | Description |

                            |---|---|

                            | `INTENT_UNSPECIFIED` | Default zero value. The EMS has not set a meaningful intent for the asset. |

                            | `INTENT_SSO` | Self-sufficiency optimisation. The asset control is determined by SSO targets. |

                            | `INTENT_INTERNAL_TARGET` | The EMS is driving the asset towards an internally defined target, for example during a force-charge session. |

                            | `INTENT_EXTERNAL_TARGET` | The EMS derived its decision for the asset from an external control input via DER-API. |'
                          enum:
                          - INTENT_UNSPECIFIED
                          - INTENT_SSO
                          - INTENT_INTERNAL_TARGET
                          - INTENT_EXTERNAL_TARGET
                          example: INTENT_SSO
                          x-readme-ref-name: Intent
                      x-readme-ref-name: IntentSegment
                  modifierSegments:
                    type: object
                    description: 'Map of modifier flag → list of intervals during which that flag was continuously

                      active. Keys are values from the `Modifier` enum (e.g. MODIFIER_LIMITED_BY_SURPLUS).

                      Each list is ordered by `from` ascending. A modifier absent from the map was not

                      active during the requested range.


                      Modifier intervals are derived from the minute-resolution aggregation (one minute

                      by default), so each interval spans at least one aggregation window. Unlike intent

                      segments, modifier intervals across different keys can overlap: multiple modifiers

                      can apply to the same asset during the same window because each one is evaluated

                      independently.'
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - from
                        description: A closed [from, to) interval.
                        properties:
                          from:
                            type: string
                            format: date-time
                            description: Start of the interval (inclusive).
                            example: '2026-06-16T00:00:00Z'
                          to:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'End of the interval (exclusive). Omitted when the interval is still active at

                              query time and was not clipped by the request `to` boundary.'
                            example: '2026-06-16T00:04:00Z'
                        x-readme-ref-name: TimeInterval
                    example:
                      MODIFIER_LIMITED_BY_SURPLUS:
                      - from: '2026-06-16T00:00:00Z'
                        to: '2026-06-16T00:04:00Z'
                      - from: '2026-06-16T00:12:00Z'
                        to: '2026-06-16T00:40:00Z'
                x-readme-ref-name: AssetIntentHistory
        '400':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
