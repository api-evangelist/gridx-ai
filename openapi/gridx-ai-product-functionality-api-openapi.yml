openapi: 3.2.0
info:
  title: Gridx Ai Product Functionality API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Product Functionality across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Product Functionality
  x-displayName: Product Functionality
paths:
  /product-functionalities:
    get:
      summary: List Product Functionalities
      operationId: listProductFunctionalities
      description: Lists all product functionalities.
      tags:
      - Product Functionality
      security:
      - HeaderAuth: []
      parameters:
      - name: functionalityIDs
        description: 'IDs of the product functionalities to filter by.

          '
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
          example:
          - 12a2cfc0-f873-11ed-b67e-0242ac120002
          - a95a052a-b1e6-49ac-90f4-a3a5d3684762
      responses:
        '200':
          description: List of product functionalities.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  type: object
                  allOf:
                  - description: 'A product functionality describes a feature.


                      It is used to manage access to this feature via product options.


                      This is the base type for the more concrete usages and not used directly within operations.

                      '
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 256
                        description: Name of the product functionality.
                        example: EV Manager
                      hide:
                        type: boolean
                        description: Indicates whether the product functionality should be hidden or shown.
                      description:
                        type: string
                        description: Describes the purpose of the product functionality.
                    x-readme-ref-name: AbstractProductFunctionality
                  - properties:
                      id:
                        description: Unique identifier of the product functionality.
                        type: string
                        format: uuid
                        example: 4e3392ce-ed94-4946-8a11-665e0443723e
                    required:
                    - id
                    - name
                    - hide
                  x-readme-ref-name: ProductFunctionality
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/product-functionalities"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/product-functionalities \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/product-functionalities\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/product-functionalities', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/product-functionalities\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/product-functionalities\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/product-functionalities")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/product-functionalities");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    servers:
    - url: https://api.gridx.de
      description: Production
  /product-functionalities/{functionalityID}:
    get:
      summary: Get a Product Functionality
      operationId: getProductFunctionality
      description: Lists all product functionalities.
      tags:
      - Product Functionality
      security:
      - HeaderAuth: []
      parameters:
      - name: functionalityID
        description: 'Unique identifier of the product functionality.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 12a2cfc0-f873-11ed-b67e-0242ac120002
      responses:
        '200':
          description: Requested product functionality.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: object
                allOf:
                - description: 'A product functionality describes a feature.


                    It is used to manage access to this feature via product options.


                    This is the base type for the more concrete usages and not used directly within operations.

                    '
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 256
                      description: Name of the product functionality.
                      example: EV Manager
                    hide:
                      type: boolean
                      description: Indicates whether the product functionality should be hidden or shown.
                    description:
                      type: string
                      description: Describes the purpose of the product functionality.
                  x-readme-ref-name: AbstractProductFunctionality
                - properties:
                    id:
                      description: Unique identifier of the product functionality.
                      type: string
                      format: uuid
                      example: 4e3392ce-ed94-4946-8a11-665e0443723e
                  required:
                  - id
                  - name
                  - hide
                x-readme-ref-name: ProductFunctionality
        '404':
          description: Requested entity not found.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '422':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Validation
                  description: 'Validation indicates that the request body contains fields which

                    does not pass the validation.

                    '
                  type: object
                  required:
                  - message
                  - details
                  example:
                    message: Validation failed
                    details:
                    - email is not valid
                x-readme-ref-name: InvalidException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
