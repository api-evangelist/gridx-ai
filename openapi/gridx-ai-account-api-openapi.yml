openapi: 3.2.0
info:
  title: Gridx Ai Account API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Account across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Account
  x-displayName: Account
paths:
  /account:
    get:
      operationId: getAuthenticatedAccount
      summary: Retrieve the authenticated Account
      description: Get the account that is currently logged in.
      tags:
      - Account
      security:
      - HeaderAuth:
        - AccountRead
      parameters:
      - name: include
        description: 'This query param allows to set certain fields only when needed.

          This makes the request faster as it requires to load only necessary data.


          If this param is set, only the specified fields are included.

          All other fields, which are possible to include, will be excluded then.

          '
        in: query
        example:
        - address
        - customization
        - systemCount
        schema:
          type: array
          items:
            type: string
            enum:
            - address
            - customization
            - systemCount
            - totalCount
      responses:
        '200':
          description: Account returned.
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: Account
                description: 'An account describes an organizational unit to manage access to systems for one or multiple users.

                  '
                type: object
                readOnly: true
                properties:
                  name:
                    type: string
                    example: John Doe
                    description: Name of the account, can be chosen freely but should be kept terse and descriptive.
                    minLength: 1
                    maxLength: 256
                  email:
                    type: string
                    format: email
                    example: john@doe.com
                    description: The email field of the account can optionally be chosen e.g. for contact purposes (in order to reach the responsible person for the account).
                    maxLength: 256
                  solution:
                    type: string
                    description: "Represents the supported solutions within the account:\n- HOME if the account contains household-like systems. \n- CHARGE if the account is used solely for charging station fleet management.\n- GENERAL if unsure what the account should contain or if it's a mix of multiple solutions.\n- SMART_DISTRICT if the account is used solely for smart district management.\nIf not set, the parent account's solution will be assumed.\n"
                    enum:
                    - HOME
                    - CHARGE
                    - GENERAL
                    - SMART_DISTRICT
                    - MICROGRID
                    - HOME_VIRTUAL_METERING
                    - COMMERCIAL
                    - CUSTOM_P2P
                    x-readme-ref-name: AccountSolution
                  id:
                    type: string
                    format: uuid
                    example: 49a4f165-8233-426b-a1a4-e569665a25dd
                    description: Uniquely identifies the account.
                  parentID:
                    type: string
                    format: uuid
                    example: 19a4f165-8233-426b-a1a4-e569665a25dd
                    description: Parent of the account for a tree-like account structure. Only the root account does not have a parent ID.
                  createdAt:
                    type: string
                    format: date-time
                    description: Specifies when the account was created.
                    readOnly: true
                  updatedAt:
                    type: string
                    format: date-time
                    description: Specifies when the account was updated.
                    readOnly: true
                  systemsCount:
                    type: integer
                    description: SystemCount is the number of systems assigned to this account
                    example: 1
                  kind:
                    type: string
                    readOnly: true
                    enum:
                    - b2b
                    - end-user
                    description: If b2b, the account is a regular account. If end-user, the account is a customer account which contains just one user.
                    x-readme-ref-name: AccountKind
                  mainAddress:
                    title: Address
                    description: Represents a physical address of a customer.
                    allOf:
                    - type: object
                      properties:
                        city:
                          description: The city of the location.
                          type: string
                          example: Aachen
                        country:
                          description: The country of the location.
                          type: string
                          example: Germany
                        addressLine1:
                          description: "First line of the location's address, typically containing the \nmain information such as the street name and house number.\n"
                          type: string
                          example: Oppenhoffallee 143
                        addressLine2:
                          description: "Second line of the location's address, typically containing additional \ninformation such as apartment numbers, suite numbers, or other details \nthat can help in identifying the exact location of the address.\n"
                          type: string
                        addressLine3:
                          description: "Third line of the location's address, typically containing any other \ndetails that can help in identifying the exact location of the address.\n"
                          type: string
                        addressLine4:
                          description: "Fourth line of the location's address, typically containing any other \ndetails that can help in identifying the exact location of the address.\n"
                          type: string
                        timeZone:
                          description: The TZ Identifier of the location's timezone.
                          type: string
                          example: Europe/Berlin
                          readOnly: true
                      x-readme-ref-name: AbstractLocation
                    - type: object
                      properties:
                        postalcode:
                          description: The postal code of the location.
                          type: string
                          example: '52062'
                        region:
                          description: The region of the address.
                          type: string
                        telephone:
                          description: The telephone number of the customer.
                          type: string
                    x-readme-ref-name: Address
                  customization:
                    description: Customization can be used to store arbitrary data.
                  productBundles:
                    type: array
                    readOnly: true
                    description: 'Product bundles active on this account. Only present for B2B accounts.

                      CONNECT is always included. Absent for end-user accounts.

                      '
                    items:
                      type: string
                      description: 'Represents an active product bundle on a B2B account.

                        - CONNECT is always active and present on every B2B account.

                        - CONTROL, OPTIMIZE, and FLEX can additionally be active.

                        Non-B2B accounts expose no product bundles.

                        '
                      enum:
                      - CONNECT
                      - CONTROL
                      - OPTIMIZE
                      - FLEX
                      x-readme-ref-name: ProductBundle
                required:
                - id
                - createdAt
                - updatedAt
                x-readme-ref-name: Account
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: Account not found.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/account"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/account \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/account\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/account', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/account\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/account\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/account")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/account");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    patch:
      operationId: updateAuthenticatedAccount
      summary: Update the authenticated Account
      description: Update the user data of the authenticated account.
      tags:
      - Account
      security:
      - HeaderAuth:
        - AccountWrite
      requestBody:
        description: Updates an account.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  name:
                    type: string
                    example: John Doe
                    description: Name of the account, can be chosen freely but should be kept terse and descriptive.
                    minLength: 1
                    maxLength: 256
                  email:
                    type: string
                    format: email
                    example: john@doe.com
                    description: The email field of the account can optionally be chosen e.g. for contact purposes (in order to reach the responsible person for the account).
                    maxLength: 256
                  kind:
                    type: string
                    readOnly: true
                    enum:
                    - b2b
                    - end-user
                    description: 'Deprecated: This field is a no-op for update operations. The account kind cannot be changed after creation.

                      '
                    x-readme-ref-name: AccountKind
                    deprecated: true
                  solution:
                    type: string
                    description: 'Deprecated: This field is a no-op for update operations. The account solution cannot be changed after creation.

                      '
                    enum:
                    - HOME
                    - CHARGE
                    - GENERAL
                    - SMART_DISTRICT
                    - MICROGRID
                    - HOME_VIRTUAL_METERING
                    - COMMERCIAL
                    - CUSTOM_P2P
                    x-readme-ref-name: AccountSolution
                    deprecated: true
                  customization:
                    description: Customization can be used to store arbitrary data.
                  mainAddress:
                    title: Address
                    description: Represents a physical address of a customer.
                    allOf:
                    - type: object
                      properties:
                        city:
                          description: The city of the location.
                          type: string
                          example: Aachen
                        country:
                          description: The country of the location.
                          type: string
                          example: Germany
                        addressLine1:
                          description: "First line of the location's address, typically containing the \nmain information such as the street name and house number.\n"
                          type: string
                          example: Oppenhoffallee 143
                        addressLine2:
                          description: "Second line of the location's address, typically containing additional \ninformation such as apartment numbers, suite numbers, or other details \nthat can help in identifying the exact location of the address.\n"
                          type: string
                        addressLine3:
                          description: "Third line of the location's address, typically containing any other \ndetails that can help in identifying the exact location of the address.\n"
                          type: string
                        addressLine4:
                          description: "Fourth line of the location's address, typically containing any other \ndetails that can help in identifying the exact location of the address.\n"
                          type: string
                        timeZone:
                          description: The TZ Identifier of the location's timezone.
                          type: string
                          example: Europe/Berlin
                          readOnly: true
                      x-readme-ref-name: AbstractLocation
                    - type: object
                      properties:
                        postalcode:
                          description: The postal code of the location.
                          type: string
                          example: '52062'
                        region:
                          description: The region of the address.
                          type: string
                        telephone:
                          description: The telephone number of the customer.
                          type: string
                    x-readme-ref-name: Address
                  productBundles:
                    type: array
                    description: "Product bundles to activate on the account. Only applicable to B2B child accounts.\n\n- If omitted (`null` / field absent), the existing bundles are left unchanged\n  (standard PATCH semantics).\n- An empty array is rejected with `422`; CONNECT must always be present.\n- All specified bundles must be active on the parent account; violating this\n  is rejected with `422`.\n- The provided set fully replaces the current bundles — values are not merged.\n- Removing a bundle also removes it from all descendant accounts on which it\n  is currently active. Adding a bundle only activates it on this account; it\n  is not inherited by child accounts and must be added to each of them\n  explicitly.\n- Bundles on your own account (the authenticated account) cannot be changed;\n  attempting this is rejected with `403`. Only child accounts are writable.\n- Cannot be set on non-B2B accounts.\n\n**Errors:** Rejected requests return `422`. If bundles are missing on the parent\naccount, `details` contains one entry per offending bundle in the format\n`bundle_not_in_parent: <BUNDLE>`, e.g. `bundle_not_in_parent: FLEX`. All\noffending bundles are reported at once. Other violations return a descriptive\nmessage in `details` that is not meant to be parsed.\n"
                    items:
                      type: string
                      description: 'Represents an active product bundle on a B2B account.

                        - CONNECT is always active and present on every B2B account.

                        - CONTROL, OPTIMIZE, and FLEX can additionally be active.

                        Non-B2B accounts expose no product bundles.

                        '
                      enum:
                      - CONNECT
                      - CONTROL
                      - OPTIMIZE
                      - FLEX
                      x-readme-ref-name: ProductBundle
                x-readme-ref-name: AccountUpdate
              - additionalProperties: false
              x-readme-ref-name: AccountUpdateStrict
