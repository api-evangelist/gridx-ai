  /systems/{systemID}/power-limit-schedules-intervals:
    get:
      operationId: listSystemPowerLimitScheduleIntervals
      summary: List applied power limits intervals
      description: 'Returns a list of scheduled power limit intervals.


        Intervals in the past are fixed and will never change.

        Intervals in the future can change if the underlying schedule is changed.'
      tags:
      - Power Limit Schedule
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        description: 'Requested time interval, formatted in ISO8601.


          In this format the start and end point of the interval are formatted according

          to RFC3339 and separated by a slash "/".

          '
        in: query
        required: true
        allowReserved: true
        example: 2021-12-24T18:21:00Z/2021-12-25T18:21:00Z
        schema:
          type: string
          format: datetime
      responses:
        '200':
          description: Applied power limits intervals.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: 'Ascending ordered list of intervals in which a scheduled power limit was applied.

                  '
                type: object
                required:
                - from
                - to
                - intervals
                properties:
                  from:
                    description: 'From when the first interval of this object applied (inclusive).

                      Equal to requested `interval` start, if there are no intervals.

                      '
                    type: string
                    format: date-time
                  to:
                    description: 'Until when the last interval of this object applied (exclusive).

                      Equal to requested `interval` start, if there are no intervals.

                      '
                    type: string
                    format: date-time
                  intervals:
                    type: array
                    items:
                      type: object
                      required:
                      - from
                      - to
                      - maxPower
                      properties:
                        from:
                          description: From when the interval applied (inclusive).
                          type: string
                          format: date-time
                        to:
                          description: Until when the interval applied (exclusive).
                          type: string
                          format: date-time
                        maxPower:
                          description: Max import power in Watt applied during the interval.
                          type: integer
                          minimum: 0
                          format: int64
