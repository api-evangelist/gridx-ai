    post:
      operationId: createSystemPowerLimitSchedule
      summary: Create a power limit schedule
      description: Creates a power limit schedule for this system.
      tags:
      - Power Limit Schedule
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      requestBody:
        description: Power limit schedule to be created.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - title: Power Limit Schedule
                  description: "A Power Limit Schedule is a schedule that defines recurring import power limits, \nwhich should be applied to the grid meter.\n\nThe schedule is recurring inside the interval bounds defined by `from` and `to`.\n\nThere can be only one active timeframe for every point in time.\nSchedules can overlap, but they must not have overlapping timeframes. \n"
                  type: object
                  properties:
                    title:
                      type: string
                      description: Name of this schedule. Must be unique for this system.
                    from:
                      type: string
                      format: date-time
                      description: From when the schedule applies (inclusive).
                    to:
                      type: string
                      format: date-time
                      description: Until when the schedule applies (exclusive).
                    timezone:
                      type: string
                      description: 'Fully qualified identifier of the timezone ([IANA timezone database identifiers](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)) this schedule should be applied in.

                        Used to determine time of day of the timeframes.

                        '
                    timeframes:
                      description: 'List of timeframes containing which import limit should be applied at which time of the day.


                        They must not overlap in this schedule and also not with timeframes of other schedules of this system.

                        '
                      type: array
                      items:
                        type: object
                        required:
                        - from
                        - to
                        - maxPower
                        properties:
                          from:
                            description: 'Time of day from when the limit of this timeframe should be applied (inclusive).

                              '
                            type: string
                            example: 00:00
                          to:
                            description: 'Time of day until when the limit of this timeframe should be applied (exclusive).

                              '
                            type: string
                            example: '14:00'
                          maxPower:
                            description: Max import power in Watt to apply to the grid meter during this timeframe.
                            type: integer
                            format: int64
                            minimum: 0
                            example: 100000
                    recurrence:
                      type: object
                      description: 'Recurrence rules for this schedule.


                        Inspired by [RFC5545](https://www.rfc-editor.org/rfc/rfc5545#section-3.3.10) and supporting a small subset of it.

                        '
                      required:
                      - frequency
                      properties:
                        frequency:
                          description: Type of recurrence rule.
                          type: string
                          enum:
                          - DAILY
                        byDayOfWeek:
                          description: 'Specifies a list of weekdays this rule should apply to.

                            Only valid for `frequency=DAILY`.


                            Omitting it is the same as selecting all days.

                            '
                          type: array
                          items:
                            type: string
                            enum:
                            - SU
                            - MO
                            - TU
                            - WE
                            - TH
                            - FR
                            - SA
                  x-readme-ref-name: AbstractPowerLimitSchedule
                - required:
                  - title
                  - from
                  - to
                  - timeframes
                  - recurrence
                  properties:
                    timezone:
                      default: Europe/Berlin
                    timeframes:
                      minItems: 1
                x-readme-ref-name: PowerLimitScheduleCreate
              - additionalProperties: false
              x-readme-ref-name: PowerLimitScheduleCreateStrict
            examples:
              dailyRepetition:
                summary: Daily repeating
                value:
                  title: Daily repeating
                  from: '2024-01-01T00:00:00+02:00'
                  to: '2025-01-01T00:00:00+02:00'
                  timeframes:
                  - from: 00:00
                    to: '18:00'
