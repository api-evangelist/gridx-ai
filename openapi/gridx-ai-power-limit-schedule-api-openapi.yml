                  from: '2024-01-01T00:00:00+02:00'
                  to: '2025-01-01T00:00:00+02:00'
                  timeframes:
                  - from: 00:00
                    to: 00:00
                    maxPower: 100000
                  recurrence:
                    frequency: DAILY
                    byDayOfWeek:
                    - SA
                    - SU
