openapi: 3.2.0
info:
  title: Gridx Ai Power Limit Schedule API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Power Limit Schedule across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Power Limit Schedule
  x-displayName: Power Limit Schedule
paths:
  /systems/{systemID}/power-limit-schedules:
    get:
      operationId: listSystemPowerLimitSchedules
      summary: List a Systems power limit schedules
      description: List all power limit schedules of the system.
      tags:
      - Power Limit Schedule
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: page
        description: 'Requested page, to be used in combination with the `per_page` parameter.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
        example: 1
      - name: per_page
        description: 'Requested number of items per page.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 20
          maximum: 500
        example: 10
      responses:
        '200':
          description: Power limit schedules ordered by `from` and `to` in ascending order.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  allOf:
                  - title: Power Limit Schedule
                    description: "A Power Limit Schedule is a schedule that defines recurring import power limits, \nwhich should be applied to the grid meter.\n\nThe schedule is recurring inside the interval bounds defined by `from` and `to`.\n\nThere can be only one active timeframe for every point in time.\nSchedules can overlap, but they must not have overlapping timeframes. \n"
                    type: object
                    properties:
                      title:
                        type: string
                        description: Name of this schedule. Must be unique for this system.
                      from:
                        type: string
                        format: date-time
                        description: From when the schedule applies (inclusive).
                      to:
                        type: string
                        format: date-time
                        description: Until when the schedule applies (exclusive).
                      timezone:
                        type: string
                        description: 'Fully qualified identifier of the timezone ([IANA timezone database identifiers](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)) this schedule should be applied in.

                          Used to determine time of day of the timeframes.

                          '
                      timeframes:
                        description: 'List of timeframes containing which import limit should be applied at which time of the day.


                          They must not overlap in this schedule and also not with timeframes of other schedules of this system.

                          '
                        type: array
                        items:
                          type: object
                          required:
                          - from
                          - to
                          - maxPower
                          properties:
                            from:
                              description: 'Time of day from when the limit of this timeframe should be applied (inclusive).

                                '
                              type: string
                              example: 00:00
                            to:
                              description: 'Time of day until when the limit of this timeframe should be applied (exclusive).

                                '
                              type: string
                              example: '14:00'
                            maxPower:
                              description: Max import power in Watt to apply to the grid meter during this timeframe.
                              type: integer
                              format: int64
                              minimum: 0
                              example: 100000
                      recurrence:
                        type: object
                        description: 'Recurrence rules for this schedule.


                          Inspired by [RFC5545](https://www.rfc-editor.org/rfc/rfc5545#section-3.3.10) and supporting a small subset of it.

                          '
                        required:
                        - frequency
                        properties:
                          frequency:
                            description: Type of recurrence rule.
                            type: string
                            enum:
                            - DAILY
                          byDayOfWeek:
                            description: 'Specifies a list of weekdays this rule should apply to.

                              Only valid for `frequency=DAILY`.


                              Omitting it is the same as selecting all days.

                              '
                            type: array
                            items:
                              type: string
                              enum:
                              - SU
                              - MO
                              - TU
                              - WE
                              - TH
                              - FR
                              - SA
                    x-readme-ref-name: AbstractPowerLimitSchedule
                  - required:
                    - id
                    - title
                    - from
                    - to
                    - timezone
                    - timeframes
                    - recurrence
                    - status
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID of this schedule.
                      timeframes:
                        minItems: 1
                      status:
                        description: 'Status of the schedule.


                          - `ACTIVE`: A timeframe of this schedule is currently being applied.

                          - `OUTDATED`: No more timeframes from this schedule will be applied.

                          - `UPCOMING`: A timeframe of this schedule will be applied in the future.

                          '
                        type: string
                        enum:
                        - ACTIVE
                        - OUTDATED
                        - UPCOMING
                      createdAt:
                        description: When the Power Limit Schedule was created.
                        type: string
                        format: date-time
                      updatedAt:
                        description: When the Power Limit Schedule was last updated.
                        type: string
                        format: date-time
                  x-readme-ref-name: PowerLimitSchedule
        '400':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Validation
                  description: 'Validation indicates that the request body contains fields which

                    does not pass the validation.

                    '
                  type: object
                  required:
                  - message
                  - details
                  example:
                    message: Validation failed
                    details:
                    - email is not valid
                x-readme-ref-name: InvalidException
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: System not found
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
