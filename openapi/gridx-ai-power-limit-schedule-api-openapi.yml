      - lang: python
        label: Python
        source: "import requests\n\nurl = \"https://api.gridx.de/systems/systemID/power-limit-schedules\"\n\npayload = {\n    \"title\": \"Daily repeating\",\n    \"from\": \"2024-01-01T00:00:00+02:00\",\n    \"to\": \"2025-01-01T00:00:00+02:00\",\n    \"timeframes\": [\n        {\n            \"from\": \"00:00\",\n            \"to\": \"18:00\",\n            \"maxPower\": 100000\n        },\n        {\n            \"from\": \"18:00\",\n            \"to\": \"00:00\",\n            \"maxPower\": 150000\n        }\n    ],\n    \"recurrence\": { \"frequency\": \"DAILY\" }\n}\nheaders = {\n    \"accept\": \"application/vnd.gridx.v2+json\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.post(url, json=payload, headers=headers)\n\nprint(response.text)"
