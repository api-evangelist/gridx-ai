      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nMediaType mediaType = MediaType.parse(\"application/vnd.gridx.v2+json\");\nRequestBody body = RequestBody.create(mediaType, \"{\\\"email\\\":\\\"john@doe.com\\\",\\\"fullName\\\":\\\"John Doe\\\",\\\"language\\\":{\\\"tag\\\":\\\"de_DE\\\"},\\\"mfaEnabled\\\":true,\\\"newPassword\\\":\\\"string\\\"}\");\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/accounts/accountID/users/userID\")\n  .patch(body)\n  .addHeader(\"accept\", \"application/json\")\n  .addHeader(\"content-type\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
