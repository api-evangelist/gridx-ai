                            - MENNEKES_4YOU_CHARGING_STATION
                            - EKOENERGETYKA_CHARGING_STATION
                            - VIESSMANN_EEBUS_INVERTER_AND_HEAT_PUMP
                            - VAILLANT_EEBUS_HEAT_PUMP
                            - PROLAN_EEBUS_STB
                            - PPC_EEBUS_METER
                            - THEBEN_SE_EEBUS_METER
                            - DAIKIN_ALTHERMA4_MODBUS_TCP_HEAT_PUMP
                            - FOXESS_CHARGING_STATION
                            - BOSCH_BUDERUS_EEBUS_HEAT_PUMP
                            - KOSTAL_EBOX_DC_B11_EEBUS_CHARGING_STATION
                            - SOLPLANET_IBC_SOLAR_CHARGING_STATION
                            - ADS_TEC_CHARGING_STATION
                            - WOLF_EEBUS_HEAT_PUMP
                            - SHELLY_3EMPRO_HTTP_METER
                            - SHELLY_PRO2_HTTP_IO_DEVICE
                            - SWISTEC_EEBUS_METER
                            - BMW_DC_WALLBOX_EEBUS_CHARGING_STATION
                            - SUNGROW_CHARGING_STATION
                            - ETREL_INCH_DUO_CHARGING_STATION
                            - ALPHAESS_SMILE_G3_T4_T10
                            - SUNGROW_EMS300CP_BESS
                            - HUAWEI_SMART_LOGGER_BESS
                            - SOLAX_MODBUS_TCP_METER
                            x-readme-ref-name: ScannerName
                          startedAt:
                            description: The time at which the scan has started.
                            type: string
                            format: date-time
                            readOnly: true
                            example: '2018-04-15T00:00:00Z'
                          finishedAt:
                            description: The time at which the scan has finished.
                            type:
                            - string
                            - 'null'
                            format: date-time
                            readOnly: true
                            example: '2018-04-15T00:00:00Z'
                        required:
                        - id
                        - name
                        - startedAt
                        - finishedAt
                        x-readme-ref-name: Scanner
                    appliances:
                      description: Represents a list of appliances that have been detected during a scan.
                      type: array
                      items:
                        title: Appliance
                        description: 'Appliance represents a monitor-/controllable device such as Inverters,

                          Meters and Heat Pumps.

                          '
                        readOnly: true
                        oneOf:
                        - title: Inverter
                          description: 'Inverter represents a monitor-/controllable inverter. It can be of kind:

                            - `PV`/`PV_EXTERNAL`: used as photovoltaic only.

                            - `BATTERY`: used as battery only.

                            - `HYBRID`: used as both photovoltaic and battery.

                            - `UNKNOWN`: default, when the inverter kind is not determined.

                            '
                          allOf:
                          - title: Base Appliance
                            description: 'BaseAppliance contains fields that all appliances have in common.


                              Specific appliance types extend this schema and add new fields.

                              '
                            type: object
                            required:
                            - id
                            - inactive
                            - createdAt
                            - updatedAt
                            - type
                            - position
                            - reverseFlow
                            - connectionStatus
                            - gatewayType
                            - state
                            - deviceID
                            - systemID
                            properties:
                              id:
                                type: string
                                format: uuid
                                example: ec4d0c89-a604-49ac-82f0-427f9cb42204
                                description: Uniquely identifies the appliance.
                              createdAt:
                                type: string
                                format: date-time
                                description: Specifies when the appliance was created.
                              updatedAt:
                                type: string
                                format: date-time
                                description: Specifies when the appliance was updated the last time.
                              connectionStatus:
                                title: Appliance connection status
                                type: object
                                readOnly: true
                                required:
                                - status
                                properties:
                                  status:
                                    type: string
                                    description: "Indicates the connection status of an appliance.\n    \nThe connection status of an appliance is determined by the gateway. The gateway regularly\nsends the connection status of all connected appliances.\n\nIt is one of:\n- `AVAILABLE`: Appliance was reported as available by the gateway.\n- `UNAVAILABLE`: Appliance was reported as unavailable by the gateway.\n- `UNKNOWN`: The gateway didn't report a status for the appliance.\n\nIn case the connection status of the gateway this appliance belongs to is `TEMPORARILY_UNAVAILABLE` or `UNAVAILABLE`\nthe status is always `UNAVAILABLE`. \n"
                                    enum:
                                    - AVAILABLE
                                    - UNAVAILABLE
                                    - UNKNOWN
                                  contactedAt:
                                    type: string
                                    format: date-time
                                    deprecated: true
                                    description: "No longer supported. \n\nWill be set approximately to a value matching the status field.\nIf the appliance is `AVAILABLE`, it will be the current datetime.\nIf the appliance is `UNAVAILABLE`, it will be a datetime 24 hours in the past. \n"
                                  lastHeartbeatReceivedAt:
                                    type: string
                                    format: date-time
                                    description: 'When the last heartbeat of the gateway this appliance is connected was received.


                                      Deprecated: gateway heartbeats will be removed in future versions and this will be only estimated.

                                      '
                                    deprecated: true
                                x-readme-ref-name: ApplianceConnectionStatus
                              gatewayType:
                                type: string
                                x-extensible-enum:
                                - GRIDBOX
                                - CLOUD
                                description: 'Type of the gateway used to communicate with this asset:

                                  GRIDBOX → The asset is physically connected to a gridbox, through which it sends measurements and can be controlled.

                                  CLOUD → The asset is connected via a cloud-to-cloud integration, through which we receive measurements and can send commands.

                                  '
                              status:
                                description: 'Status of the appliance. This field is set dynamically in the appliance handler.


                                  **Deprecated** - Use `ConnectionStatus` instead.

                                  '
                                type: string
                                enum:
                                - UNDEFINED
                                - OK
                                - WARNING
                                - ERROR
                                deprecated: true
                                x-readme-ref-name: ApplianceStatus
                              type:
                                type: string
                                example: INVERTER
                                description: 'Describes the ''physical'' type of the appliance.


                                  See `kind` for further distinction of the type in terms of the appliance''s purpose/role,

                                  e.g. appliance with type=INVERTER and kind=BATTERY represents a battery inverter.

                                  '
                                x-readme-ref-name: ApplianceType
                              inactive:
                                type: boolean
                                x-readme-ref-name: ApplianceInactive
                              name:
                                type: string
                                description: Name of the appliance.
                                x-readme-ref-name: ApplianceName
                              reverseFlow:
                                description: "**Supported ONLY for Meters.**\nFor all other asset types (e.g., EV Chargers, Inverters), this field is unused and **scheduled for removal**.\n\n**Usage (Meters only):**\nIf true, changes the energy flow's direction.\nIf during installation the input/output wiring is mixed up, set it to true in order to compensate for that.\nThis impact the consumption/production calculation as follows: \nIt switches the algebraic sign of the appliance's measurements, e.g. if an appliance measurement showed supply (+), it will change to feed-in (-) after this field is set to true (and vice versa).\n"
                                type: boolean
                                x-readme-ref-name: ApplianceReverseFlow
                              room:
                                type: string
                                description: The physical room/location of the appliance in the building.
                                x-readme-ref-name: ApplianceRoom
                              serialnumber:
                                type: string
                                example: '1901000652'
                                description: Serialnumber of the appliance.
                                x-readme-ref-name: ApplianceSerialNumber
                              network:
                                title: Network
                                description: Represents a network connection.
                                type: object
                                properties:
                                  interface:
                                    type: string
                                    example: eth0
                                    description: Used network interface such as "eth0", "vpn0" etc.
                                  address:
                                    type: string
                                    example: 192.168.178.153
                                    description: IP address of the device.
                                  port:
                                    type: integer
                                    format: int32
                                    example: 0
                                    description: Port used for the connection.
                                  protocol:
                                    type: string
                                    example: tcp/modbus
                                    description: Protocol used for the connection.
                                x-readme-ref-name: Network
                              parent:
                                type: string
                                format: uuid
                                description: Specifies the parent appliance ID, for an appliance which is a child of a `INVERTER` of kind `HYBRID`.
                                x-readme-ref-name: ApplianceParent
                              loadSettings:
                                title: Load Settings
                                description: Configure load of appliance.
                                type: object
                                required:
                                - disabled
                                properties:
                                  disabled:
                                    type: boolean
                                    description: If true, disable electrical load of the appliance (e.g. stops charging for EV charging station).
                                x-readme-ref-name: LoadSettings
                              sensorSettings:
                                title: Sensor Settings
                                type: object
                                allOf:
                                - title: Sensor Settings
                                  description: '**DEPRECATED:** This is being phased out. It is historically only applicable to `METER` asset types and is deprecated/ignored for all other asset types.


                                    Settings specific to B-Control sensorbar appliances.

                                    Allows grouping sensors of one bar as different phases of a single appliance.

                                    '
                                  type: object
                                  properties:
                                    sensorL1:
                                      type: integer
                                      description: '**DEPRECATED:** This property is only applicable to `METER` asset types.


                                        SensorID for phase 1 of the appliance

                                        '
                                    sensorL2:
                                      type: integer
                                      description: '**DEPRECATED:** This property is only applicable to `METER` asset types.


                                        SensorID for phase 2 of the appliance

                                        '
                                    sensorL3:
                                      type: integer
                                      description: '**DEPRECATED:** This property is only applicable to `METER` asset types.


                                        SensorID for phase 3 of the appliance

                                        '
                                  x-readme-ref-name: AbstractSensorSettings
                                - required:
                                  - createdAt
                                  - updatedAt
                                  properties:
                                    createdAt:
                                      type: string
                                      format: date-time
                                    updatedAt:
                                      type: string
                                      format: date-time
                                x-readme-ref-name: SensorSettings
                              source:
                                title: Source
                                type: object
                                required:
                                - origin
                                properties:
                                  origin:
                                    type: string
                                    description: "Specifies who created the appliance. This can be one of:\n- `GRIDBOX` if the appliance was found during a scan using a gridBox.\n- `API` if a user of the gridX API used the 'Create Appliance' endpoint\n  to create this appliance.\n- `UNKNOWN` otherwise.\n"
                                    enum:
                                    - UNKNOWN
                                    - GRIDBOX
                                    - API
                                    example: API
                                  uri:
                                    type: string
                                    deprecated: true
                                    description: 'Contains an URI identifying the exact resource that created this appliance.


                                      If origin is ''GRIDBOX'' the value will point to the gateway object of the gridBox. If

                                      origin is ''API'' the value will be empty.

                                      The ''UNKNOWN'' origin should not occur in practice and is reserved for special cases (for now).

                                      '
                                    example: gateways/b30510fa-a8a5-475f-a75d-82a46cb62582
                                x-readme-ref-name: Source
                              commissioningKind:
                                title: Commissioning Kind
                                description: 'Indicates special requirements to be fulfilled during the commissioning for this appliance.


                                  If empty or unset (default), the appliance can be commissioned as regular.

                                  - `property:CryptoSettings` means that the appliance property `CryptoSettings` needs to be set, e.g. for authenticating towards it with an appliance-specific API token.

                                  - `flow:Pairing` means that a coupling or pairing flow has to be initiated and run-through in order for the appliance to behave correctly.

                                  '
                                type: string
                                enum:
                                - property:CryptoSettings
                                - flow:Pairing
                                x-readme-ref-name: CommissioningKind
                              state:
                                title: State
                                description: Contains information about the appliance's state.
                                type: object
                                allOf:
                                - title: State
                                  description: Contains information about the appliance's state.
                                  type: object
                                  properties:
                                    current:
                                      description: The state the appliance is currently in.
                                      example: SCANNED
                                      title: Appliance State
                                      type: string
                                      enum:
                                      - UNKNOWN_APPLIANCE_STATE
                                      - SCANNED
                                      - CONNECTING
                                      - VERIFYING
                                      - UNTRUSTED
                                      - CONNECTED
                                      - DISCONNECTED
                                      x-readme-ref-name: ApplianceState
                                    transitions:
                                      description: "List with all the possible state transitions an appliance can go through. \nAn appliance can go from a `starting` state to a `target` state.\n"
                                      type: array
                                      items:
                                        title: State Transition
                                        description: Defines the properties of a transition an appliance can go through.
                                        type: object
                                        required:
                                        - start
                                        - target
                                        properties:
                                          start:
                                            description: The starting state of the appliance.
                                            example: CONNECTING
                                            title: Appliance State
                                            type: string
                                            enum:
                                            - UNKNOWN_APPLIANCE_STATE
                                            - SCANNED
                                            - CONNECTING
                                            - VERIFYING
                                            - UNTRUSTED
                                            - CONNECTED
                                            - DISCONNECTED
                                            x-readme-ref-name: ApplianceState
                                          target:
                                            description: The target state of the appliance.
                                            example: DISCONNECTED
                                            title: Appliance State
                                            type: string
                                            enum:
                                            - UNKNOWN_APPLIANCE_STATE
                                            - SCANNED
                                            - CONNECTING
                                            - VERIFYING
                                            - UNTRUSTED
                                            - CONNECTED
                                            - DISCONNECTED
                                            x-readme-ref-name: ApplianceState
                                        x-readme-ref-name: StateTransition
                                  x-readme-ref-name: AbstractState
                                - required:
                                  - current
                                  - desired
                                  properties:
                                    desired:
                                      description: The desired state of the appliance.
                                      example: CONNECTED
                                      x-readme-ref-name: DesiredState
                                      title: Appliance State
                                      type: string
                                      enum:
                                      - UNKNOWN_APPLIANCE_STATE
                                      - SCANNED
                                      - CONNECTING
                                      - VERIFYING
                                      - UNTRUSTED
                                      - CONNECTED
                                      - DISCONNECTED
                                x-readme-ref-name: State
                              energySettings:
                                title: Energy Management Settings
                                description: Contains energy management information
                                type: object
                                allOf:
                                - title: Energy Management Settings
                                  description: Contains energy management information
                                  type: object
                                  properties:
                                    minControlInterval:
                                      type: integer
                                      deprecated: true
                                      description: '**DEPRECATED.** Legacy artifact. This field is non-functional and scheduled for removal.


                                        Minimum interval in milliseconds in which this appliance can receive control commands, e.g. new power setpoint.

                                        '
                                    socMax:
                                      deprecated: true
                                      description: '**DEPRECATED.** This field will be removed in a future version.


                                        The maximum state of charge an energy storage can be charged to in a range from [0-100] in %.

                                        '
                                      type: number
                                      format: double
                                      minimum: 0
                                      maximum: 100
                                    socLockMax:
                                      deprecated: true
                                      description: '**DEPRECATED.** Legacy artifact. This field is non-functional and scheduled for removal.


                                        The threshold above which no charging is allowed once SoC max is reached, in a range from [0-100] in %.

                                        Must be smaller than or equal to socMax.

                                        '
                                      type: number
                                      format: double
                                      minimum: 0
                                      maximum: 100
                                    socMin:
                                      deprecated: true
                                      description: '**DEPRECATED.** Legacy artifact. This field is non-functional and scheduled for removal.


                                        The minimum state of charge an energy storage can be discharged to in a range from [0-100] in %.

                                        '
                                      type: number
                                      format: double
                                      minimum: 0
                                      maximum: 100
                                    socLockMin:
                                      deprecated: true
                                      description: '**DEPRECATED.** Legacy artifact. This field is non-functional and scheduled for removal.


                                        The threshold below which no discharging is allowed once SoC min is reached, in a range from [0-100] in %.

                                        Must be larger than or equal to socMin.

                                        '
                                      type: number
                                      format: double
                                      minimum: 0
                                      maximum: 100
                                    socDeepDischarge:
                                      deprecated: true
                                      description: '**DEPRECATED.** Legacy artifact. This field is non-functional and scheduled for removal.


                                        The lowest state of charge an energy storage can reach, in a range from [0-100] in %.

                                        Below this it is not usable and a forced recharge to at least socMin is required.

                                        '
                                      type: number
                                      format: double
                                      minimum: 0
                                      maximum: 100
                                    phaseMapping:
                                      description: "Contains three indices representing the actual phases on the grid connection point this appliance is connected to. \nNote that the first phase has index 0 and last phase index 2.\nThe index of the sequence is the phase on the gcp and the values are the appliance phases. Unused phases are marked with -1.\n"
                                      type:
                                      - array
                                      - 'null'
                                      minItems: 3
                                      maxItems: 3
                                      items:
                                        type: integer
                                    temperatureExtremeMax:
                                      description: 'The temperature to which the system should be heated up to in °C, if there is an energy surplus.


                                        *Deprecated for non-heater assets: This property is only applicable to Heaters. Setting this value for any other asset type has absolutely no effect and it will be explicitly removed from the schema for all non-heater assets in the future.*

