                            - SOLARLOG_MONITOR
                            - CUSTOMER_HOLFELDER_METER
                            - CUSTOMER_HOLFELDER_INVERTER
                            - E3DC_INVERTER_METER
                            - KOSTAL_INVERTER
                            - STUDER_INVERTER
                            - FRONIUS_INVERTER
                            - HUAWEI_INVERTER
                            - KEBA_CHARGING_STATION
                            - ECHARGE_CHARGING_STATION
                            - INNOGY_CHARGING_STATION
                            - ELECTRIS_METER
                            - SOLARWATT_INVERTER_METER
                            - ABL_CHARGING_STATION
                            - SIEMENS_PAC_METER
                            - JANITZA_METER
                            - JANITZA_METER_RTU
                            - EVTEC_CHARGING_STATION
                            - HIKING_METER_RTU
