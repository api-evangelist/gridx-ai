openapi: 3.2.0
info:
  title: gridX Scan API
  description: The gridX standard API makes it possible to build customised energy applications.
  version: 2.0.0
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Scan
  x-displayName: Scan
paths:
  /gateways/{gatewayID}/scans:
    get:
      operationId: listGatewayScans
      summary: List Gateway's Scans
      description: 'List of scans for the given gateway and the given interval.


        If no interval is specified, the entire period is considered and all scans are listed.'
      tags:
      - Scan
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      - name: interval
        description: 'Requested time interval, formatted in ISO8601.


          In this format the start and end point of the interval are formatted according

          to RFC3339 and separated by a slash "/".

          '
        in: query
        required: true
        allowReserved: true
        example: 2021-12-24T18:21:00Z/2021-12-25T18:21:00Z
        schema:
          type: string
          format: datetime
      - name: page
        description: 'Requested page, to be used in combination with the `per_page` parameter.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
        example: 1
      - name: per_page
        description: 'Requested number of items per page.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 20
          maximum: 500
        example: 10
      - name: sort
        description: 'The field to sort the results by, to be used in combination with the `order` parameter.

          Defaults to `finished`.

          '
        in: query
        schema:
          type: string
          enum:
          - started
          - finished
          default: finished
        example: started
      - name: order
        description: 'Order direction of the results, to be used in combination with the `sort` parameter.

          Defaults to `asc`.

          '
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: desc
      responses:
        '200':
          description: 'An array of scans, sorted by `sort` and `order`.

            '
          content:
            application/vnd.gridx.v2+json:
              schema:
                type:
                - array
                - 'null'
                items:
                  title: Scan
                  description: Represents a group of scanners than have to run on a specific gridbox.
                  type: object
                  properties:
                    id:
                      description: Unique identifier of a scan.
                      type: string
                      format: uuid
                      example: 9ee88ee2-49f4-434d-a96f-67aca96aaa0a
                    startedAt:
                      description: The time at which the scan has started.
                      type: string
                      format: date-time
                      readOnly: true
                      example: '2018-04-15T00:00:00Z'
                    finishedAt:
                      description: The time at which the scan has finished.
                      type: string
                      format: date-time
                      readOnly: true
                      example: '2018-04-15T00:00:00Z'
                    scanners:
                      description: Represents a list of scanners that have to run.
                      type: array
                      items:
                        title: Scanner
                        description: Represents a scanner within a scan.
                        type: object
                        properties:
                          id:
                            description: Unique identifier of a scanner.
                            type: string
                            format: uuid
                            example: 7992f38a-df67-49d9-9f2f-98c63015a20c
                          name:
                            type: string
                            description: The name of the scanner which searches for the appliance in the network.
                            example: SMA_INVERTER_IGMP_HOST_DISCOVERY
