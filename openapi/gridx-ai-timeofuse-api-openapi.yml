                          * `UNSUPPORTED_CHARGE_MODE_QUICK` - Time-of-Use not working optimally due

                          to EV set to Quick Charge Mode, which is not supported.


                          * `UNSUPPORTED_CHARGE_MODE_SURPLUS` - Time-of-Use not working optimally due

                          to EV set to Surplus Charge Mode, which is not supported.


                          * `UNSUPPORTED_CHARGE_MODE_SAFETY` - Time-of-Use not working optimally due

                          to EV set to Safety Charge Mode, which is not supported.


                          * `UNSUPPORTED_CHARGE_MODE_UNKNOWN` - Time-of-Use not working optimally due

                          to EV set to unknown charge mode.


                          * `BATTERY_UNCONTROLLABLE` - Time-of-Use not working optimally due to battery

                          being uncontrollable.


                          * `BATTERY_OEM_ERROR` - Time-of-Use not working optimally due to battery

                          being in error state.


                          * `INVALID_DEPARTURE_TIME` - Time-of-Use not working optimally due to

                          missing or invalid departure time for EV or EVCS.'
