  /systems/{systemID}/timeofuse/forecasts/pv:
    get:
      tags:
      - TimeOfUse
      summary: Get the PV forecast for a system
      operationId: getSystemTimeOfUseForecastPv
      description: 'Returns forecasted PV export active power for the specified system in watts.

        Forecasts are provided in 15-minute intervals and are available

        from the current time

        up to 48 hours into the future. Historical forecast data is not

        available.


        The `interval` parameter specifies the time window for returned

        forecasts.

        If omitted, defaults to `[now, now + 48h]`.


        If the requested interval extends beyond the 48-hour forecast

        horizon or includes past times,

        only the available subset within `[now, now + 48h]` is returned.

        If the requested interval is entirely outside this range, an empty

        list is returned.'
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        in: query
        required: false
        schema:
          type: string
          format: datetime
          example: 2018-04-01T15:00:00Z/2018-04-25T00:00:00Z
        description: 'A time interval [start_timestamp, end_timestamp] encoded as a unique string start_timestamp/end_timestamp.


          Each timestamp should be specified in the RFC3339 format.


          The maximum time interval that can be requested is 48 hours.


          IMPORTANT: it has to be fully URL encoded (also known as Percent-encoding), including the `/`.'
      responses:
        '200':
          description: 'Successful request. Retrieved PV forecasts for given `systemID`.

            '
          content:
            application/json:
              schema:
                description: 'Forecasted PV export active power in watts for the system over the given time period.

                  '
                type: array
                items:
                  type: object
                  description: 'PV forecast period.

                    '
                  properties:
                    from:
                      type: string
                      format: date-time
                      example: '2020-09-21T00:00:00Z'
                      description: 'Timestamp in RFC3339 format that marks the beginning of the period.

                        '
                    to:
