  /systems/{systemID}/timeofuse/kpi:
    get:
      operationId: listHistoricalSystemTimeOfUseKPIs
      summary: Get the historical KPIs of the Time-of-Use service
      description: 'Provides Key Performance Indicators (KPIs) for system cost analysis

        under Time-of-Use (ToU) and


        Self-Sufficiency Optimization (SSO) models. Returns interval-based ToU and

        SSO costs to evaluate potential savings between the two scenarios."'
      tags:
      - TimeOfUse
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        in: query
        required: false
        schema:
          type: string
          format: datetime
          example: 2018-04-01T15:00:00Z/2018-04-25T00:00:00Z
        description: 'A time interval [start_timestamp, end_timestamp] encoded as a unique string start_timestamp/end_timestamp.


          Each timestamp should be specified in the RFC3339 format.


          The maximum time interval that can be requested is 48 hours.


          IMPORTANT: it has to be fully URL encoded (also known as Percent-encoding), including the `/`.'
      responses:
        '200':
          description: Successful request. Retrieved historical KPI for given parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          format: date-time
                          example: '2020-09-21T00:00:00Z'
                          description: 'Timestamp in RFC3339 format that marks the beginning of the

                            period.'
                        to:
                          type: string
                          format: date-time
                          example: '2020-09-22T00:00:00Z'
                          description: Timestamp in RFC3339 format that marks the end of the period.
                        touCost:
                          type: number
                          description: ToU cost for the requested interval.
                        touCostCurrency:
                          type: string
                          description: A currency for a ToU cost for the requested interval.
                        ssoCost:
                          type: number
                          description: SSO cost for the requested interval.
                        ssoCostCurrency:
                          type: string
                          description: A currency for a SSO cost for the requested interval.
                        errorCode:
                          type: string
                          description: 'Error code describing the reason of a failed saving calculation

                            run.'
                      description: Time-of-Use KPI record.
                      x-readme-ref-name: KPI
                    description: Time-of-Use KPI collection.
                    x-readme-ref-name: KPIs
                description: 'Time-of-Use KPI history for the system for which the request is

                  made.'
                x-readme-ref-name: KPIHistory
        '400':
          description: Malformed request.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
