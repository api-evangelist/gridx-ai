openapi: 3.2.0
info:
  title: gridX Time Of Use API
  description: The gridX standard API makes it possible to build customised energy applications.
  version: 2.0.0
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: TimeOfUse
  x-displayName: TimeOfUse
paths:
  /systems/{systemID}/timeofuse/decisions:
    get:
      operationId: getSystemTimeOfUseDecisions
      summary: Get time of use optimization decisions of a system
      description: 'Get optimization decisions and associated metrics for a system

        with `system_id`,


        within given time interval. Note that decisions may not always cover the complete

        time interval.


        Only decisions with `start_at` in the past are returned.


        The maximum time interval that can be requested is 48 hours.'
      tags:
      - TimeOfUse
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        description: 'Requested time interval, formatted in ISO8601.


          In this format the start and end point of the interval are formatted according

          to RFC3339 and separated by a slash "/".

          '
        in: query
        required: true
        allowReserved: true
        example: 2021-12-24T18:21:00Z/2021-12-25T18:21:00Z
        schema:
          type: string
          format: datetime
      responses:
        '200':
          description: Array of optimization decisions and associated metrics.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: Collection of ToU decisions and decision metrics.
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      description: ToU decision entry.
                      type: object
                      properties:
                        from:
                          type: string
                          format: date-time
                        to:
                          type: string
                          format: date-time
                        case_name:
                          type: string
                          enum:
                          - BATTERY_SELF_CONSUMPTION
                          - BATTERY_NO_DISCHARGE
                          - BATTERY_CHARGE_FROM_GRID
                          - BATTERY_CHARGE_FROM_SURPLUS
                          - BATTERY_DISCHARGE_TO_GRID
                          - BATTERY_NO_CHARGE
                          - BATTERY_NO_CHARGE_NO_DISCHARGE
                          - BATTERY_LIMIT_CHARGE
                          - BATTERY_LIMIT_DISCHARGE
                          - BATTERY_UNDEFINED_DECISION
                          - EV_NO_DECISION
                          - EV_CHARGE_FROM_GRID
                          - EV_NO_CHARGE
                          - EV_LIMIT_CHARGE
                          - EV_LIMIT_DISCHARGE
                          - EV_CHARGE_WITH_MIN_POWER
                          - EV_UNDEFINED_DECISION
                          - HEATPUMP_RECOMMEND_ON
                          - HEATPUMP_AUTO
                          - GCP_EXPORT_LIMIT
                          - GCP_NO_LIMIT
                          - PV_CURTAILMENT
                          - PV_NO_DECISION
                          example: BATTERY_CHARGE_FROM_GRID
                          description: "Identifies underlying the decision case that this decision is based on.\n\nThe following cases are implemented:\n\n1. `BATTERY_SELF_CONSUMPTION`: No time-of-use decision applied for the battery.\n  In this case, the default self-consumption maximization logic applies to\n  the battery.\n\n2. `BATTERY_NO_DISCHARGE`: Do not discharge the battery, even if there is\n  demand and no PV surplus. Demand is served with power from the grid,\n  instead of discharging the battery.\n\n3. `BATTERY_CHARGE_FROM_GRID`: Charge the battery with power from the grid,\n  instead of only charging the PV surplus. The battery is forced to charge\n  with maximum charging power.\n\n4. `BATTERY_CHARGE_FROM_SURPLUS`: Charge the battery with power from the\n  surplus.\n\n5. `BATTERY_DISCHARGE_TO_GRID`: Discharge the battery into the grid, instead of\n  only discharging to serve demand. Discharge of the battery may coincide\n  with PV surplus, to benefit from high grid export prices. The battery is\n  forced to discharge with maximum power.\n\n6. `BATTERY_NO_CHARGE`: Do not charge the battery, even if there is PV\n  surplus. PV surplus is injected into the grid, instead of charging the\n  battery.\n\n7. `BATTERY_NO_CHARGE_NO_DISCHARGE`: Do not charge or discharge the battery,\n  regardless of PV surplus or insufficient PV production to meet demand.\n\n8. `BATTERY_LIMIT_CHARGE`: Limit the charging power of the battery, even if\n  there is additional PV surplus.\n\n9. `BATTERY_LIMIT_DISCHARGE`: Limit the discharging power of the battery, even\n  if there is additional demand.\n\n10. `BATTERY_UNDEFINED_DECISION`: Decision applied to the battery, but the\n    decision cannot be mapped to any other decision case. This case is used as\n    a fallback for newly implemented decision cases.\n\n11. `EV_NO_DECISION`: No time-of-use decision applied for the EV. In this case,\n    the default charge logic applies to the EV, depending on the charge mode.\n\n12. `EV_CHARGE_FROM_GRID`: Charge the EV with power from the grid, instead of\n    only charging the PV surplus. The EV is forced to charge with maximum\n    charging power.\n\n13. `EV_NO_CHARGE`: Do not charge the EV, even if there is PV surplus.\n\n14. `EV_LIMIT_CHARGE`: Limit the charging power of the EV.\n\n15. `EV_LIMIT_DISCHARGE`: Limit the discharging power of the EV.\n\n16. `EV_CHARGE_WITH_MIN_POWER`: Charge the EV with minimum charging power.\n\n17. `EV_UNDEFINED_DECISION`: Decision applied to the EV, but the decision\n    cannot be mapped to any other decision case. This case is used as a\n    fallback for newly implemented decision cases.\n\n18. `HEATPUMP_RECOMMEND_ON`: Recommending the heat pump to switch on.\n\n19. `HEATPUMP_AUTO`: The heat pump is set to run in its energy-efficient\n    normal mode.\n\n20. `GCP_EXPORT_LIMIT`: The grid export is limited at the grid connection\n    point (GCP).\n\n21. `GCP_NO_LIMIT`: No grid export limit is applied.\n\n22. `PV_CURTAILMENT`: The PV production is curtailed to avoid grid export\n    during periods of negative feed-in prices.\n\n23. `PV_NO_DECISION`: No time-of-use decision applied for the PV."
                        insight:
                          description: ToU decision insight entry.
                          type: object
                          properties:
                            motives:
                              type: array
                              items:
                                type: string
                                enum:
                                - BATTERY_CHARGE_TO_COVER_LOAD
                                - BATTERY_CHARGE_TO_DISCHARGE_TO_GRID
                                - BATTERY_CHARGE_SURPLUS_TO_COVER_LOAD
                                - BATTERY_CHARGE_SURPLUS_TO_DISCHARGE_TO_GRID
                                - BATTERY_KEEP_TO_COVER_LOAD
                                - BATTERY_KEEP_TO_DISCHARGE_TO_GRID
                                - BATTERY_PREVENT_CHARGE_TO_EXPORT_SURPLUS_AT_HIGH_EXPORT_PRICE
                                - BATTERY_DISCHARGE_TO_GRID
                                - BATTERY_DISCHARGE_TO_GRID_TO_FREE_CAPACITY_FOR_WORSE_NEGATIVE_PRICES
                                - BATTERY_PREVENT_CHARGE_TO_RESERVE_CAPACITY_FOR_WORSE_NEGATIVE_PRICES
                                - EV_CHARGE_IN_LOW_PRICES
                                - EV_CHARGE_IN_EXPECTED_SURPLUS
                                - EV_CHARGE_TO_SATISFY_DESIRED_SOC
                                - EV_FORCE_CHARGE
                                - EV_STOP_CHARGE
                                - EV_KEEP_TO_EXPORT_SURPLUS_AND_CHARGE_FROM_GRID_LATER
                                - EV_DELAY_CHARGE_TO_LOW_PRICES
                                - EV_DELAY_CHARGE_TO_SURPLUS
                                - HEAT_PUMP_RECOMMEND_ON_MOTIVE
                              example:
                              - BATTERY_CHARGE_TO_COVER_LOAD
                              description: 'Identifies the motivation behind a ToU decision. The following

                                insights are implemented:


                                1. `BATTERY_CHARGE_TO_COVER_LOAD`: Charge the battery in low `import_price`

                                to cover load at higher import prices (> `break_even_import_price`) between

                                `start_time` and `end_time`.


                                2. `BATTERY_CHARGE_TO_DISCHARGE_TO_GRID`: Charge the battery in low `import_price`

                                to discharge to grid at higher export prices (> `break_even_export_price`)

                                between `start_time` and `end_time`.


                                3. `BATTERY_CHARGE_SURPLUS_TO_COVER_LOAD`: Charge the battery from surplus

                                to cover load later at higher import prices.


                                4. `BATTERY_CHARGE_SURPLUS_TO_DISCHARGE_TO_GRID`: Charge the battery from

                                surplus to discharge to grid at higher export prices.


                                5. `BATTERY_KEEP_TO_COVER_LOAD`: Delay battery discharge to cover load

                                at higher import prices (> `break_even_import_price`) between `start_time`

                                and `end_time`.


                                6. `BATTERY_KEEP_TO_DISCHARGE_TO_GRID`: Delay battery discharge to the

                                grid at higher export prices (> `break_even_export_price`) between `start_time`

                                and `end_time`.


                                7. `BATTERY_PREVENT_CHARGE_TO_EXPORT_SURPLUS_AT_HIGH_EXPORT_PRICE`: Prevent

                                battery charge to allow PV surplus export at high export prices.


                                8. `BATTERY_DISCHARGE_TO_GRID`: Discharge the battery into the grid to

                                benefit from high export prices.


                                9. `BATTERY_DISCHARGE_TO_GRID_TO_FREE_CAPACITY_FOR_WORSE_NEGATIVE_PRICES`:

                                Discharge the battery during negative export prices to free capacity for

                                charging PV surplus later at an even more negative export price, reducing

                                total grid export cost.


                                10. `BATTERY_PREVENT_CHARGE_TO_RESERVE_CAPACITY_FOR_WORSE_NEGATIVE_PRICES`:

                                Prevent battery charge during negative export prices to reserve capacity for

                                charging PV surplus later at an even more negative export price, reducing

                                total grid export cost.


                                11. `EV_CHARGE_IN_LOW_PRICES`: Charge the EV earlier in low `import_price`.

                                The desired SoC expected to be met at `end_time`.


                                12. `EV_CHARGE_IN_EXPECTED_SURPLUS`: Charge the EV with expected PV surplus.

                                The desired SoC expected to be met at `end_time`.


                                13. `EV_CHARGE_TO_SATISFY_DESIRED_SOC`: Force Charge the EV from grid to

                                ensure that the desired SoC at pre-defined departure time (regardless

                                of prices).


                                14. `EV_FORCE_CHARGE`: Force Charge the EV from grid regardless the current

                                import price via QUICK charge mode.


                                15. `EV_STOP_CHARGE`: Prevent the EV from charging via QUICK charge mode


                                16. `EV_KEEP_TO_EXPORT_SURPLUS_AND_CHARGE_FROM_GRID_LATER`: Prevent EV

                                charge to allow PV surplus export at high export prices, and charge EV

                                from grid later at lower import prices.


                                17. `EV_DELAY_CHARGE_TO_LOW_PRICES`: Charge EV later at lower import prices.


                                18. `EV_DELAY_CHARGE_TO_SURPLUS`: Charge EV later from PV surplus.


                                19. `HEAT_PUMP_RECOMMEND_ON_MOTIVE`: Request increased heat pump operation,

                                to avoid potential higher price periods or to use PV surplus.'
                            importPrice:
                              type: number
                              example: 0.1
                              description: Current import price at which the decision is taken.
                            breakEvenImportPrice:
                              type: number
                              example: 0.1
                              description: 'Refers to the minimum import price at which using the stored

                                energy later becomes more profitable than importing from grid, while accounting

                                for battery efficiency losses.'
                            averageImportPrice:
                              type: number
                              example: 0.1
                              description: Average import price at which the stored energy was utilized.
                            exportPrice:
                              type: number
                              example: 0.1
                              description: Current export price at which the decision is taken.
                            breakEvenExportPrice:
                              type: number
                              example: 0.1
                              description: 'Refers to the minimum export price at which selling the stored

                                energy to grid later becomes profitable, while accounting for battery

                                efficiency losses.'
                            averageExportPrice:
                              type: number
                              example: 0.1
                              description: Average export price at which the stored energy was utilized.
                            from:
                              type: string
                              format: date-time
                              example: '2020-09-21T00:00:00Z'
                              description: 'Refers to the start time of an upcoming event justifying the

                                current decision (e.g., start of battery discharge to cover load / to

                                grid).'
                            to:
                              type: string
                              format: date-time
                              example: '2020-09-21T01:00:00Z'
                              description: 'Refers to the end time of an upcoming event justifying the

                                current decision (e.g., end of battery discharge to cover load / to grid).'
                          x-readme-ref-name: DecisionInsight
                        isPriceBasedOptimization:
                          type: boolean
                          description: Indicates if the decision is based on price. In most cases, decisions not based on price correspond to the "default" decision for a particular appliance type.
                      required:
                      - from
                      - to
                      - case_name
                      - isPriceBasedOptimization
                      x-readme-ref-name: Decision
                  metrics:
                    description: ToU decision metrics.
                    type: object
                    properties:
                      percent_decision_taken:
                        type: number
                        format: double
                        example: 75
                        description: 'Percentage of the taken decisions as a share of the total possible decisions during this time interval. Taken decisions are all decisions excluding "no-decision" cases.

                          '
                    required:
                    - percent_decision_taken
                    x-readme-ref-name: DecisionMetrics
                required:
                - decisions
                - metrics
                x-readme-ref-name: Decisions
        '400':
          description: Malformed request.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Bad Request
                  description: 'Bad Request indicates that the request body is not a valid JSON or

                    it contains a invalid json type.

                    '
                  example:
                    message: Problems parsing JSON
                x-readme-ref-name: BadRequestException
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
