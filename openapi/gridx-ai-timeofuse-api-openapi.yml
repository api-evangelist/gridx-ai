  /systems/{systemID}/timeofuse/status/current:
    get:
      operationId: getSystemTimeOfUseCurrentStatus
      summary: Get the last known status of the Time-of-Use service
      description: 'The Time-of-Use (ToU) optimization runs on a given resolution

        of 15 minutes.


        For each time segment, i.e. `[10:00, 10:15]` it publishes an operational status

        for


        associated with a system with `systemID`.


        This endpoint provides the last known, or current, status of the Time-of-Use

        runs."'
      tags:
      - TimeOfUse
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Successful request. Retrieved status for the given parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ToU status entry.
                    type: object
                    properties:
                      from:
                        type: string
                        format: date-time
                        example: '2020-09-21T00:00:00Z'
                        description: 'Timestamp in RFC3339 format that marks the beginning of the

                          period.'
                      to:
                        type: string
                        format: date-time
                        example: '2020-09-21T00:15:00Z'
                        description: Timestamp in RFC3339 format that marks the end of the period.
                      status:
                        type: string
                        enum:
                        - ONLINE
                        - SUBOPTIMAL
                        - OFFLINE
                        - DISABLED
                        - INITIALIZING
                        example: ONLINE
                        description: 'Operational status of Time-of-Use for a specific run.



                          * `ONLINE` - Time-of-Use optimization is running successfully.


                          * `SUBOPTIMAL` - Time-of-Use optimization is running suboptimally.


                          * `OFFLINE` - Time-of-Use optimization failed.


                          * `DISABLED` - Time-of-Use optimization is disabled for the system.


                          * `INITIALIZING` - Time-of-Use optimization is initializing, it may take up

                          to 48h.'
                        x-readme-ref-name: StatusValue
                      error_code:
                        type: string
                        enum:
                        - STATIC_PRICES
                        - MISSING_PRICES
                        - INCOMPLETE_PRICES
                        - MISSING_APPLIANCES
                        - MISSING_GRID_METER
                        - MULTIPLE_GRID_METERS
                        - MULTIPLE_BATTERIES
                        - MULTIPLE_EVCS
                        - MULTIPLE_EV
                        - MULTIPLE_HEAT_PUMPS
                        - MULTIPLE_PVS_CURTAILMENT
                        - MISSING_CONTROLLABLE_APPLIANCE
                        - ALL_CONTROLLABLE_APPLIANCES_OFFLINE
                        - MISSING_EV
                        - UNCONTROLLABLE_EV
                        - OFFLINE_APPLIANCE
                        - EMS_NOT_ENABLED
                        - EMS_CONSENT_NOT_GIVEN
                        - UNKNOWN_INVERTER
                        - MISSING_HISTORICAL_DATA
                        - PV_CURTAILMENT_NOT_SUPPORTED
                        - MISSING_FUSE_IMPORT_LIMIT
                        - MISSING_PV_NOMINAL_POWER_FOR_CURTAILMENT
                        - INTERNAL_GET_CONSTRAINTS_EVCS
                        - INTERNAL_GET_CONSTRAINTS_EV
                        - INTERNAL_GET_FLEXIBILITY_EVCS
                        - INTERNAL_GET_FLEXIBILITY_EV
                        - INTERNAL_BATTERY_FLEXIBILITY_INVALID
                        - INTERNAL_MAP_NODE_CONSTRAINT
                        - INTERNAL_MAP_NODE_CONSTRAINT_MISSING_BATTERY_FIELDS
                        - INTERNAL_MAP_NODE_STATE
                        - INTERNAL_MAP_NODE_STATE_MISSING_BATTERY_STATE_OF_CHARGE
                        - INTERNAL_EXTRACT_HYBRID_INVERTER_BATTERY_CONSTRAINT
                        - INTERNAL_EXTRACT_DRIVER_CONSTRAINTS
                        - INTERNAL_EMPTY_EVCS_DRIVER_CONSTRAINTS
                        - INTERNAL_EMPTY_EV_DRIVER_CONSTRAINTS
                        - INTERNAL_EXTRACT_BATTERY_DRIVER_CONSTRAINTS
                        - INTERNAL_EXTRACT_HEAT_PUMP_DRIVER_CONSTRAINTS
                        - INTERNAL_OPTIMIZATION_SOLVER
                        - INTERNAL_PV_FORECAST
                        - EV_NOT_PLUGGED
                        - EV_DEPARTURE_TIME_ROLLOVER
                        - INTERNAL_ERROR
                        example: INTERNAL_ERROR
                        description: 'Most recent error causing a failure of Time-of-Use specific run.


                          * `STATIC_PRICES` - Time-of-Use failing due to import and export prices are

                          constant.


                          * `MISSING_PRICES` - Time-of-Use failing due to missing import and export

                          prices.


                          * `INCOMPLETE_PRICES` - Time-of-Use failing due to incomplete import and export

                          prices.


                          * `MISSING_APPLIANCES` - Time-of-Use failing due to missing appliances in

                          a system.


                          * `MISSING_GRID_METER` - Time-of-Use failing due to missing grid meter.


                          * `MULTIPLE_GRID_METERS` - Time-of-Use failing due to multiple grid meters

                          within a system.


                          * `MULTIPLE_BATTERIES` - Time-of-Use failing due to multiple batteries within

                          a system.


                          * `MULTIPLE_EVCS` - Time-of-Use failing due to multiple EV charging stations

                          within a system.


                          * `MULTIPLE_EV` - Time-of-Use failing due to multiple EV''s within a system.


                          * `MULTIPLE_HEAT_PUMPS` - Time-of-Use failing due to multiple heat pumps within

                          a system.


                          * `MULTIPLE_PVS_CURTAILMENT` - Time-of-Use failing due to multiple PVs within

                          a system with PV curtailment enabled.


                          * `MISSING_CONTROLLABLE_APPLIANCE` - Time-of-Use failing due to missing controllable

                          device (battery, EV or heat pump).


                          * `ALL_CONTROLLABLE_APPLIANCES_OFFLINE` - Time-of-Use failing due to all controllable

                          devices (battery, EV and heat pump) being offline.


                          * `MISSING_EV` - Time-of-Use failing due to missing EV appliance.


                          * `UNCONTROLLABLE_EV` - Time-of-Use failing due to an uncontrollable EV appliance.


                          * `OFFLINE_APPLIANCE` - Time-of-Use failing due to an offline appliance.


                          * `EMS_NOT_ENABLED` - Time-of-Use failing due to energy management not being

                          enabled on the system.


                          * `EMS_CONSENT_NOT_GIVEN` - Time-of-Use failing due to consent to energy management

                          not being given for the system.


                          * `UNKNOWN_INVERTER` - Time-of-Use failing due to an unknown inverter.


                          * `MISSING_HISTORICAL_DATA` - Time-of-Use failing due to insufficient historical

                          data to generate forecasts.


                          * `PV_CURTAILMENT_NOT_SUPPORTED` - Time-of-Use failing because the inverter

                          does not support PV power curtailment.


                          * `MISSING_FUSE_IMPORT_LIMIT` - Time-of-Use failing due to missing fuse protection

                          import limit.


                          * `MISSING_PV_NOMINAL_POWER_FOR_CURTAILMENT` - time-of-Use failing due to invalid or unavailable

                          nominal PV power with PV curtailment activated.


                          * `INTERNAL_GET_CONSTRAINTS_EVCS` - Time-of-Use failing due to missing EVCS constraints.


                          * `INTERNAL_GET_CONSTRAINTS_EV` - Time-of-Use failing due to missing EV constraints.


                          * `INTERNAL_GET_FLEXIBILITY_EVCS` - Time-of-Use failing due to missing EVCS flexibility.


                          * `INTERNAL_GET_FLEXIBILITY_EV` - Time-of-Use failing due to missing EV flexibility.


                          * `INTERNAL_BATTERY_FLEXIBILITY_INVALID` - Time-of-Use failing due to invalid

                          flexibility (e.g. flexibility is expired).


                          * `INTERNAL_MAP_NODE_CONSTRAINT` - Time-of-Use failing due to incorrect node

                          constraint (e.g. missing some fields).


                          * `INTERNAL_MAP_NODE_CONSTRAINT_MISSING_BATTERY_FIELDS` - Time-of-Use failing

                          due to incorrect node constraint for the battery (e.g. missing some fields).


                          * `INTERNAL_MAP_NODE_STATE` - Time-of-Use failing due to incorrect node flexibility

                          (e.g. missing some fields).


                          * `INTERNAL_MAP_NODE_STATE_MISSING_BATTERY_STATE_OF_CHARGE` - Time-of-Use

                          failing due to missing battery SoC.


                          * `INTERNAL_EXTRACT_HYBRID_INVERTER_BATTERY_CONSTRAINT` - Time-of-Use failing

                          due to some issues extracting driver constraint for the hybrid inverter battery.


                          * `INTERNAL_EXTRACT_DRIVER_CONSTRAINTS` - Time-of-Use failing due to missing

                          driver constraints.


                          * `INTERNAL_EMPTY_EVCS_DRIVER_CONSTRAINTS` - Time-of-Use failing due to empty

                          EVCS driver constraints.


                          * `INTERNAL_EMPTY_EV_DRIVER_CONSTRAINTS` - Time-of-Use failing due to empty

                          EV driver constraints.


                          * `INTERNAL_EXTRACT_BATTERY_DRIVER_CONSTRAINTS` - Time-of-Use failing due

                          to missing driver constraints for the battery.


                          * `INTERNAL_EXTRACT_HEAT_PUMP_DRIVER_CONSTRAINTS` - Time-of-Use failing due

                          to missing driver constraints for the heat pump.


                          * `INTERNAL_OPTIMIZATION_SOLVER`- Time-of-Use failing due to the optimization

                          solver not converging in time.


                          * `INTERNAL_PV_FORECAST` - Time-of-Use failing due to missing PV forecast or failure to compute PV forecast.


                          * `EV_NOT_PLUGGED` - Time-of-Use failing due to EV being unplugged


                          * `EV_DEPARTURE_TIME_ROLLOVER` - Time-of-Use failing due to EV daily departure

                          time rolling over to the next day while still plugged in the same charging session.


                          * `INTERNAL_ERROR` - Time-of-Use failing due to an unknown, internal issue.'
                        x-readme-ref-name: ToUErrorCode
