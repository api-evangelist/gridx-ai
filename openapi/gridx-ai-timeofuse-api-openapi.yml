  /systems/{systemID}/timeofuse/forecasts/meter:
    get:
      operationId: listSystemTimeOfUseForecasts
      summary: Get the Time-of-Use forecasts for the grid connection point
      description: 'The Time-of-Use (ToU) optimization runs on a given resolution

        of 15 minutes.


        For each time segment, i.e. `[10:00, 10:15]` it publishes a series of forecasts

        for


        the grid connection point associated with a system with `systemID`.


        This endpoint requires to specify a time window called `interval` for which

        the forecasts are returned.


        For example `[2021-01-01T02:07:14Z, 2021-01-02T02:07:14Z]`.


        If no interval is provided it is assumed to be `[00:00:00 today, 00:00:00

        in two days]`.


        The maximum size of this interval is 48h.


        This endpoint returns the forecasts **in the selected time window**.


        Please note that the forecasts might not cover the whole time window.


        In this case the largest possible subset is returned.


        If no forecast is available, an empty list is returned.'
      tags:
      - TimeOfUse
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        in: query
        required: false
        schema:
          type: string
          format: datetime
          example: 2018-04-01T15:00:00Z/2018-04-25T00:00:00Z
        description: 'A time interval [start_timestamp, end_timestamp] encoded as a unique string start_timestamp/end_timestamp.


          Each timestamp should be specified in the RFC3339 format.


          The maximum time interval that can be requested is 48 hours.


          IMPORTANT: it has to be fully URL encoded (also known as Percent-encoding), including the `/`.'
      responses:
        '200':
          description: Successful request. Retrieved forecasts for the given parameters.
          content:
            application/json:
              schema:
                description: Grid connection point forecast.
                type: object
                properties:
                  from:
                    type: string
                    format: date-time
                    example: '2020-09-21T00:00:00Z'
                    description: 'Timestamp in RFC3339 format that marks the beginning of the

                      validity period for the forecast.'
                  to:
                    type: string
                    format: date-time
                    example: '2020-09-21T22:10:00Z'
                    description: 'Timestamp in RFC3339 format that marks the end of the validity

                      period for the forecast.'
                  periods:
                    type: array
                    items:
                      description: Grid connection point forecast period.
                      type: object
                      properties:
                        from:
                          type: string
                          format: date-time
                          example: '2020-09-21T00:00:00Z'
                          description: 'Timestamp in RFC3339 format that marks the beginning of the

                            period.'
                        to:
                          type: string
                          format: date-time
                          example: '2020-09-21T00:15:00Z'
                          description: Timestamp in RFC3339 format that marks the end of the period.
                        importActivePower:
                          type: number
                          description: The forecasted import active power in Watts.
                        exportActivePower:
                          type: number
                          description: The forecasted export active power in Watts.
                        maxImportActivePower:
                          type:
                          - number
                          - 'null'
                          description: The maximum forecasted import active power in Watts.
                        maxExportActivePower:
                          type:
                          - number
                          - 'null'
                          description: 'The maximum forecasted export active power in Watts.

                            '
                      x-readme-ref-name: GridConnectionPointPeriod
                  lastUpdated:
                    type: string
                    format: date-time
                    example: '2020-09-21T00:00:00Z'
                    description: Last time when the forecast was updated.
                x-readme-ref-name: GridConnectionPointForecasts
