    get:
      operationId: listSystemGridFees
      x-badges:
      - label: draft
        color: red
      summary: Retrieve grid fees for systems with dynamic tariff
      description: 'Returns the grid fees for the specified system over a time interval,

        but **only if the system''s tariff type is `DYNAMIC`**.


        - If the offtake tariff is not DYNAMIC, the request will result in a 400 Bad Request.

        - If the system is not found, a 404 will be returned.

        - If no grid fee data is available for the requested interval, an empty `periods` array will be returned.'
      tags:
      - TariffV2
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        in: query
        description: 'Requested time interval for fetching end-price tariff in the

          RFC3339 format.


          If the available grid fee data does not fully cover the interval, the largest available subset will still be returned.



          If the lower bound of the interval is not a multiple of the resolution,

          it will be truncated.


          If the upper bound of the interval is not a multiple of the resolution,

          it will be rounded up.'
        required: true
        example: 2020-09-21T00:00:00Z/2022-09-23T00:00:00Z
        schema:
          type: string
          format: datetime
      - name: resolution
        in: query
        description: 'Resolution of the grid fee periods as ISO8601 duration.


          If not specified it will be a 15-min resolution.



          Possible resolutions are:


          - PT15M - 15 minutes


          - PT1H - 1 hour


          - P1D - 1 day'
        required: false
        example: PT1H
        schema:
          type: string
          format: iso8601
      responses:
