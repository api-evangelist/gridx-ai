openapi: 3.2.0
info:
  title: gridX Tariff V2 API
  description: The gridX standard API makes it possible to build customised energy applications.
  version: 2.0.0
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: TariffV2
  x-displayName: TariffV2
paths:
  /systems/{systemID}/tariff:
    get:
      operationId: getSystemTariff
      summary: Retrieve the tariff v2 of a system
      description: Retrieves the tariff v2 of the system.
      tags:
      - TariffV2
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Tariff of the system. Empty if there is none.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: 'The tariff contains settings which specify where to take prices from and how

                  the end prices will be calculated.'
                type: object
                allOf:
                - title: Energy TariffV2
                  type: object
                  description: 'Represents an energy tariff.


                    The tariff contains settings which specify where to take prices from and how

                    the end prices will be calculated.



                    If `feedinType` or `offtakeType` is `MARKET_DATA`, `marketDataSettings` is

                    required.


                    If `feedinType` or `offtakeType` is `STATIC` `staticPeriods` is required.



                    For **external tariffs**, `feedinType` and `offtakeType` **both** have to

                    be set to `EXTERNAL`.


                    External tariffs are tariffs where the prices are sent directly via API and

                    not calculated.


                    The price periods are sent with the `/systems/{systemID}/tariff/prices` endpoint.'
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name of the energy tariff, to be chosen freely.
                      example: E.ON Strom
                    currency:
                      type: string
                      description: Currency code (ISO 4217).
                      example: EUR
                    feedinType:
                      type: string
                      description: Type of feed-in tariff.
                      example: STATIC
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: FeedinTariffType
                    offtakeType:
                      type: string
                      description: Type of off-take tariff.
                      example: MARKET_DATA
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: OfftakeTariffType
                    gridFeeType:
                      type:
                      - string
                      - 'null'
                      description: Name of the grid fee type.
                      readOnly: true
                      enum:
                      - STANDARD
                      - MODULE2
                      - MODULE3
                    energyProvider:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: 'Identifier of the energy provider. The end prices for off-take will be fetched for the

                        corresponding energy provider.


                        If not defined, the end prices will be determined based on the raw market prices and grid fees,

                        without considering the margin of the energy provider.


                        Only valid for tariffs with `offtakeType` set to `DYNAMIC`.'
                    staticPeriods:
                      description: 'Weekly recurring periods with static prices. Used for example

                        for completely static, day/night and weekend tariffs.



                        Static periods have to form a closed loop. The loop must cover the whole

                        week:


                        A period has to end at the start of the next period. The end of the last

                        period has to be the start of the first period.'
                      type: array
                      items:
                        title: TariffV2 Static period
                        description: 'Contains the tariff periods for a tariff with either OfftakeType

                          or FeedinType `STATIC`.



                          The period is active between `from` and `to`. `from` is included in the interval,

                          `to` is excluded.'
                        type: object
                        properties:
                          from:
                            title: TariffV2 static period time
                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
                                type: integer
                                minimum: 0
                                maximum: 6
                                example: 0
                              secondsOfDay:
                                description: The second of the weekday until the period is valid/which the period is valid from
                                type: integer
                                minimum: 0
                                maximum: 86399
                                example: 0
                            required:
                            - weekday
                            - secondsOfDay
                            x-readme-ref-name: TariffV2StaticPeriodTime
                          to:
                            title: TariffV2 static period time
                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
                                type: integer
                                minimum: 0
                                maximum: 6
                                example: 0
                              secondsOfDay:
                                description: The second of the weekday until the period is valid/which the period is valid from
                                type: integer
                                minimum: 0
                                maximum: 86399
                                example: 0
                            required:
                            - weekday
                            - secondsOfDay
                            x-readme-ref-name: TariffV2StaticPeriodTime
                          feedinPrice:
                            description: Price per kWh fed into the grid in the currency of the tariff.
                            type: number
                            example: 0.09
                            default: 0
                          offtakePrice:
                            description: Price per kWh consumed from the grid in the currency of the tariff.
                            type: number
                            example: 0.4
                            default: 0
                        required:
                        - from
                        - to
                        x-readme-ref-name: TariffV2StaticPeriod
                    marketDataSettings:
                      title: Market Data Settings
                      type: object
                      description: Settings specific to market-data-based tariffs.
                      properties:
                        feedinOffset:
                          type: number
                          description: Sets the fee per kWh on top of market prices for feed-in tariffs.
                          example: 2.5
                        offtakeOffset:
                          type: number
                          description: Sets the fee per kWh on top of market prices for off-take tariffs.
                          example: 2.5
                        providerFee:
                          type: number
                          description: Additional fee per kWh on top, after applying VAT.
                          example: 10
                        vat:
                          type: number
                          description: The VAT is the value-added tax rate expressed as a decimal number.
                          example: 0.12
                      x-readme-ref-name: AbstractMarketDataSettings
                    dynamicSettings:
                      title: Dynamic Settings
                      type: object
                      description: Optional settings for DYNAMIC tariffs to apply additional offsets to base dynamic prices.
                      properties:
                        offtakeOffset:
                          type:
                          - number
                          - 'null'
                          description: Additional offset per kWh on top of dynamic base prices for off-take. Can be positive or negative.
                          example: 0.05
                      x-readme-ref-name: AbstractDynamicSettings
                  x-readme-ref-name: AbstractTariffV2
                - properties:
                    systemID:
                      type: string
                      description: ID of the system the tariff is assigned to
                      format: uuid
                      example: 3a07b17f-da57-4d61-b9e4-17c4fcd861c4
                      readOnly: true
                    createdAt:
                      type: string
                      description: Time at which the tariff was created using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                      readOnly: true
                    updatedAt:
                      type: string
                      description: Time at which the tariff was updated using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                      readOnly: true
                    currency:
                      default: EUR
                    marketDataSettings:
                      description: Market data settings specific to market-data-based tariffs.
                      allOf:
                      - title: Market Data Settings
                        type: object
                        description: Settings specific to market-data-based tariffs.
                        properties:
                          feedinOffset:
                            type: number
                            description: Sets the fee per kWh on top of market prices for feed-in tariffs.
                            example: 2.5
                          offtakeOffset:
                            type: number
                            description: Sets the fee per kWh on top of market prices for off-take tariffs.
                            example: 2.5
                          providerFee:
                            type: number
                            description: Additional fee per kWh on top, after applying VAT.
                            example: 10
                          vat:
                            type: number
                            description: The VAT is the value-added tax rate expressed as a decimal number.
                            example: 0.12
                        x-readme-ref-name: AbstractMarketDataSettings
                      - required:
                        - feedinOffset
                        - offtakeOffset
                        - providerFee
                        - vat
                      x-readme-ref-name: MarketDataSettings
                    dynamicSettings:
                      title: Dynamic Settings
                      type: object
                      description: Optional settings for DYNAMIC tariffs to apply additional offsets to base dynamic prices.
                      properties:
                        offtakeOffset:
                          type:
                          - number
                          - 'null'
                          description: Additional offset per kWh on top of dynamic base prices for off-take. Can be positive or negative.
                          example: 0.05
                      x-readme-ref-name: AbstractDynamicSettings
                    biddingZone:
                      type: string
                      description: 'Electricity market bidding zone the tariff is in.

                        Automatically calculated on tariff creation and update based on the biddingzone of the account the system belongs to.'
                      example: 10Y1001A1001A44P
                  required:
                  - name
                  - feedinType
                  - offtakeType
                  - systemID
                  - createdAt
                  - updatedAt
                  - currency
                x-readme-ref-name: TariffV2
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: System not found
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/systems/systemID/tariff"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/systems/systemID/tariff \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/systems/systemID/tariff\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/systems/systemID/tariff', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/systems/systemID/tariff\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/systems/systemID/tariff\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/systems/systemID/tariff")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/systems/systemID/tariff");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    post:
      operationId: setSystemTariff
      summary: Set the tariff v2 of a system
      description: 'Sets the tariff v2 of the system if no tariff settings have been set yet.


        If the tariff settings had already been set, no changes would be made.


        See the response bodies description which fields have to be set for which

        `feedinType`/`offtakeType`.'
      tags:
      - TariffV2
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'The tariff contains settings which specify where to take prices from and how

                the end prices will be calculated.'
              allOf:
              - description: 'The tariff contains settings which specify where to take prices from and how

                  the end prices will be calculated.'
                type: object
                allOf:
                - title: Energy TariffV2
                  type: object
                  description: 'Represents an energy tariff.


                    The tariff contains settings which specify where to take prices from and how

                    the end prices will be calculated.



                    If `feedinType` or `offtakeType` is `MARKET_DATA`, `marketDataSettings` is

                    required.


                    If `feedinType` or `offtakeType` is `STATIC` `staticPeriods` is required.



                    For **external tariffs**, `feedinType` and `offtakeType` **both** have to

                    be set to `EXTERNAL`.


                    External tariffs are tariffs where the prices are sent directly via API and

                    not calculated.


                    The price periods are sent with the `/systems/{systemID}/tariff/prices` endpoint.'
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name of the energy tariff, to be chosen freely.
                      example: E.ON Strom
                    currency:
                      type: string
                      description: Currency code (ISO 4217).
                      example: EUR
                    feedinType:
                      type: string
                      description: Type of feed-in tariff.
                      example: STATIC
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: FeedinTariffType
                    offtakeType:
                      type: string
                      description: Type of off-take tariff.
                      example: MARKET_DATA
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: OfftakeTariffType
                    gridFeeType:
                      type:
                      - string
                      - 'null'
                      description: Name of the grid fee type.
                      readOnly: true
                      enum:
                      - STANDARD
                      - MODULE2
                      - MODULE3
                    energyProvider:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: 'Identifier of the energy provider. The end prices for off-take will be fetched for the

                        corresponding energy provider.


                        If not defined, the end prices will be determined based on the raw market prices and grid fees,

                        without considering the margin of the energy provider.


                        Only valid for tariffs with `offtakeType` set to `DYNAMIC`.'
                    staticPeriods:
                      description: 'Weekly recurring periods with static prices. Used for example

                        for completely static, day/night and weekend tariffs.



                        Static periods have to form a closed loop. The loop must cover the whole

                        week:


                        A period has to end at the start of the next period. The end of the last

                        period has to be the start of the first period.'
                      type: array
                      items:
                        title: TariffV2 Static period
                        description: 'Contains the tariff periods for a tariff with either OfftakeType

                          or FeedinType `STATIC`.



                          The period is active between `from` and `to`. `from` is included in the interval,

                          `to` is excluded.'
                        type: object
                        properties:
                          from:
                            title: TariffV2 static period time
                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
                                type: integer
                                minimum: 0
                                maximum: 6
                                example: 0
                              secondsOfDay:
                                description: The second of the weekday until the period is valid/which the period is valid from
                                type: integer
                                minimum: 0
                                maximum: 86399
                                example: 0
                            required:
                            - weekday
                            - secondsOfDay
                            x-readme-ref-name: TariffV2StaticPeriodTime
                          to:
                            title: TariffV2 static period time
                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
                                type: integer
                                minimum: 0
                                maximum: 6
                                example: 0
                              secondsOfDay:
                                description: The second of the weekday until the period is valid/which the period is valid from
                                type: integer
                                minimum: 0
                                maximum: 86399
                                example: 0
                            required:
                            - weekday
                            - secondsOfDay
                            x-readme-ref-name: TariffV2StaticPeriodTime
                          feedinPrice:
                            description: Price per kWh fed into the grid in the currency of the tariff.
                            type: number
                            example: 0.09
                            default: 0
                          offtakePrice:
                            description: Price per kWh consumed from the grid in the currency of the tariff.
                            type: number
                            example: 0.4
                            default: 0
                        required:
                        - from
                        - to
                        x-readme-ref-name: TariffV2StaticPeriod
                    marketDataSettings:
                      title: Market Data Settings
                      type: object
                      description: Settings specific to market-data-based tariffs.
                      properties:
                        feedinOffset:
                          type: number
                          description: Sets the fee per kWh on top of market prices for feed-in tariffs.
                          example: 2.5
                        offtakeOffset:
                          type: number
                          description: Sets the fee per kWh on top of market prices for off-take tariffs.
                          example: 2.5
                        providerFee:
                          type: number
                          description: Additional fee per kWh on top, after applying VAT.
                          example: 10
                        vat:
                          type: number
                          description: The VAT is the value-added tax rate expressed as a decimal number.
                          example: 0.12
                      x-readme-ref-name: AbstractMarketDataSettings
                    dynamicSettings:
                      title: Dynamic Settings
                      type: object
                      description: Optional settings for DYNAMIC tariffs to apply additional offsets to base dynamic prices.
                      properties:
                        offtakeOffset:
                          type:
                          - number
                          - 'null'
                          description: Additional offset per kWh on top of dynamic base prices for off-take. Can be positive or negative.
                          example: 0.05
                      x-readme-ref-name: AbstractDynamicSettings
                  x-readme-ref-name: AbstractTariffV2
                - type: object
                  properties:
                    marketDataSettings:
                      description: Market data settings specific to market-data-based tariffs.
                      allOf:
                      - title: Market Data Settings
                        type: object
                        description: Settings specific to market-data-based tariffs.
                        properties:
                          feedinOffset:
                            type: number
                            description: Sets the fee per kWh on top of market prices for feed-in tariffs.
                            example: 2.5
                          offtakeOffset:
                            type: number
                            description: Sets the fee per kWh on top of market prices for off-take tariffs.
                            example: 2.5
                          providerFee:
                            type: number
                            description: Additional fee per kWh on top, after applying VAT.
                            example: 10
                          vat:
                            type: number
                            description: The VAT is the value-added tax rate expressed as a decimal number.
                            example: 0.12
                        x-readme-ref-name: AbstractMarketDataSettings
                      - required:
                        - feedinOffset
                        - offtakeOffset
                        - providerFee
                        - vat
                      x-readme-ref-name: MarketDataSettings
                  required:
                  - feedinType
                  - offtakeType
                x-readme-ref-name: TariffV2Creation
              - additionalProperties: false
              x-readme-ref-name: TariffV2CreationStrict
      responses:
        '201':
          description: The newly-set tariff v2.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: 'The tariff contains settings which specify where to take prices from and how

                  the end prices will be calculated.'
                type: object
                allOf:
                - title: Energy TariffV2
                  type: object
                  description: 'Represents an energy tariff.


                    The tariff contains settings which specify where to take prices from and how

                    the end prices will be calculated.



                    If `feedinType` or `offtakeType` is `MARKET_DATA`, `marketDataSettings` is

                    required.


                    If `feedinType` or `offtakeType` is `STATIC` `staticPeriods` is required.



                    For **external tariffs**, `feedinType` and `offtakeType` **both** have to

                    be set to `EXTERNAL`.


                    External tariffs are tariffs where the prices are sent directly via API and

                    not calculated.


                    The price periods are sent with the `/systems/{systemID}/tariff/prices` endpoint.'
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name of the energy tariff, to be chosen freely.
                      example: E.ON Strom
                    currency:
                      type: string
                      description: Currency code (ISO 4217).
                      example: EUR
                    feedinType:
                      type: string
                      description: Type of feed-in tariff.
                      example: STATIC
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: FeedinTariffType
                    offtakeType:
                      type: string
                      description: Type of off-take tariff.
                      example: MARKET_DATA
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: OfftakeTariffType
                    gridFeeType:
                      type:
                      - string
                      - 'null'
                      description: Name of the grid fee type.
                      readOnly: true
                      enum:
                      - STANDARD
                      - MODULE2
                      - MODULE3
                    energyProvider:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: 'Identifier of the energy provider. The end prices for off-take will be fetched for the

                        corresponding energy provider.


                        If not defined, the end prices will be determined based on the raw market prices and grid fees,

                        without considering the margin of the energy provider.


                        Only valid for tariffs with `offtakeType` set to `DYNAMIC`.'
                    staticPeriods:
                      description: 'Weekly recurring periods with static prices. Used for example

                        for completely static, day/night and weekend tariffs.



                        Static periods have to form a closed loop. The loop must cover the whole

                        week:


                        A period has to end at the start of the next period. The end of the last

                        period has to be the start of the first period.'
                      type: array
                      items:
                        title: TariffV2 Static period
