      - lang: python
        label: Python
        source: "import requests\n\nurl = \"https://api.gridx.de/systems/systemID/tariff\"\n\nheaders = {\n    \"accept\": \"application/vnd.gridx.v2+json\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.post(url, headers=headers)\n\nprint(response.text)"
