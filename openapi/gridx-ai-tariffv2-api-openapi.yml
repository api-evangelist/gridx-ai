  /systems/{systemID}/tariff/prices:
    get:
      operationId: listSystemTariffPrices
      summary: Retrieve the tariff end prices of a system
      description: 'Retrieves the end-price tariff for the system in the specified

        resolution (15-minute by default if not specified).


        The end-price is the price the customer is billed for (for market data tariffs

        for example after offset, VAT and provider fee are applied).


        Depending on the tariff settings, the tariff data might have been directly

        posted through the API, originate from market data, external provider


        or is extrapolated from static data.


        If the resolution of the underlying data doesn''t correspond to the requested

        resolution the data will be up- or down-sampled.


        For example the market prices used by market data tariffs have a 1 hour resolution.

        If you request 15min resolution you will


        get 4 equal periods per hour. If you request daily resolution, the average

        prices of 24 hourly periods will be returned per period.


        For EXTERNAL tariffs: if there are missing price periods over the requested interval,

        the end-price tariff will start after the

        last period gap, aligned with the requested resolution.


        That is, if the requested interval for a given day is from 00:00 to 12:00

        and no prices were sent from at 02:15 to 03:45, the first period returned

        will be from 03:45 to 04:00 for a 15-min resolution or from 04:00 to 05:00

        for an hourly resolution.


        However for all other tariff types like DYNAMIC and MARKET_DATA,

        if there are missing price periods over the requested interval,

        the end-price tariff will start at the first valid period available (ignoring a leading gap) and

        end at the beginning of the next gap.


        That is, if the requested interval for a given day is from 00:00 to 12:00

        and no prices were sent from at 02:15 to 03:45, the first period returned

        will be from the 00:00 to 00:15 period until the 02:00 to 02:15 period for a 15-min resolution.


        Once calculated the prices won''t change anymore for the requested period.


        Even if the tariff is reconfigured the returned price will stay the same.


        This is due to the fact that historical prices can not be changed anymore.


        Changes in the tariff will only have an effect in the future.


        Also, `EXTERNAL` prices can be retrieved for as long as they are posted.


        The returned currency is determined by the currency of the underlying tariff

        if not specified otherwise.'
      tags:
      - TariffV2
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: interval
        in: query
        description: 'Requested time interval for fetching end-price tariff in the

          RFC3339 format.


          If the available tariff data does not cover the full interval, the largest

          available subset will still be returned.


          If the lower bound of the interval is not a multiple of the resolution,

          it will be truncated.


          If the upper bound of the interval is not a multiple of the resolution,

          it will be rounded up.'
        required: true
        example: 2020-09-21T00:00:00Z/2022-09-23T00:00:00Z
        schema:
          type: string
          format: datetime
      - name: resolution
        in: query
        description: 'Resolution of the end-price tariff periods as ISO8601 duration.


          If not specified it will be a 15-min resolution.



          Possible resolutions are:


          - PT15M - 15 minutes


          - PT1H - 1 hour


          - P1D - 1 day'
        required: false
        example: PT1H
        schema:
          type: string
          format: iso8601
      - name: currency
        in: query
        description: 'Currency in which the end prices should be returned.



          If the underlying data isn''t already in the requested currency, the prices

          will be converted.


          This uses exchange rates with a daily resolution.'
        example: EUR
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'End-price tariff of the system for the interval requested.


            If the system has no tariff and therefore no end prices can be calculated

            the returned periods will be empty.'
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: Represent a TariffV2 with price periods.
                allOf:
                - title: End-price Tariff V2
                  description: 'Represent a TariffV2 with end price periods.

                    End prices are prices with applied offset, VAT and provider fee.

                    In contrast to normal "TariffV2" EndpriceTariffV2 always is for a particular interval

                    and contains all periods for this interval.

                    '
                  type: object
                  properties:
                    currency:
                      type: string
                      description: Currency code (ISO 4217)
                      example: EUR
                    periods:
                      description: 'List of periods containing end prices over non-overlapping

                        periods.


                        The periods are sorted chronologically.'
                      type: array
                      items:
                        title: End-price Tariff V2 Period
                        type: object
                        description: 'Represents a period of a TariffV2 with end prices.


                          End prices are prices with applied offset, VAT and provider fee.'
                        properties:
                          from:
                            type: string
                            format: date-time
                            example: '2018-04-01T00:00:00Z'
                            description: Time at which the period starts in the RFC3339 format.
                          to:
                            type: string
                            format: date-time
                            example: '2018-04-01T00:15:00Z'
                            description: Time at which the period ends in the RFC3339 format.
                          feedinPrice:
                            type: number
                            format: double
                            example: 0.09
                            description: Price including offset, VAT and provider fee per kWh for fed in energy in the period [from, to).
                          offtakePrice:
                            type: number
                            format: double
                            example: 0.4
                            description: Price including offset, VAT and provider fee per kWh for consumed energy in the period [from, to).
                          marketPrice:
                            type:
                            - number
                            - 'null'
                            format: double
                            example: 0.15
                            description: 'Raw market price (Day-Ahead EPEX Spot price with 60min resolution)

                              per kWh at the time of this period in the bidding zone of the system.


                              Returned regardless if underlying tariff has a market data type or not

                              (if available).



                              For static tariffs (both offtake & feedin =STATIC) this can be `null`,

                              when there is no market price for the requested period.'
                        required:
                        - from
                        - to
                        - feedinPrice
                        - offtakePrice
                        x-readme-ref-name: AbstractEndpriceTariffV2Period
                  x-readme-ref-name: AbstractEndpriceTariffV2
                - type: object
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name of the underlying TariffV2.
                    from:
                      type: string
                      format: date-time
                      example: '2018-04-01T00:00:00Z'
                      description: 'Time at which the contained periods starts in the RFC3339

