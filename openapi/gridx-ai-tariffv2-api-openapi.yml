                    example: '2018-04-01T00:15:00Z'
                    description: Time at which the contained periods end (exclusive), in RFC3339 format.
                  periods:
                    type: array
                    items:
                      description: Represents a TariffV2 grid fee entry.
                      type: object
                      properties:
                        from:
                          type: string
                          format: date-time
                          example: '2018-04-01T00:00:00Z'
                          description: Start of the period (inclusive), in RFC3339 format.
                        to:
                          type: string
                          format: date-time
                          example: '2018-04-01T00:15:00Z'
                          description: End of the period (exclusive), in RFC3339 format.
                        gridFee:
