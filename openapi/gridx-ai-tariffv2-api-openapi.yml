    patch:
      operationId: updateSystemTariff
      summary: Update the tariff v2 of a system
      description: 'Updates the tariff v2 of the system if the tariff settings have already been set and need to be modified.


        See the response bodies description which fields have to be set for which

        `feedinType`/`offtakeType`.'
      tags:
      - TariffV2
      security:
      - HeaderAuth: []
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'The tariff contains settings which specify where to take prices from and how

                the end prices will be calculated.'
              allOf:
              - description: 'The tariff contains settings which specify where to take prices from and how

                  the end prices will be calculated.'
                type: object
                allOf:
                - title: Energy TariffV2
                  type: object
                  description: 'Represents an energy tariff.


                    The tariff contains settings which specify where to take prices from and how

                    the end prices will be calculated.



                    If `feedinType` or `offtakeType` is `MARKET_DATA`, `marketDataSettings` is

                    required.


                    If `feedinType` or `offtakeType` is `STATIC` `staticPeriods` is required.



                    For **external tariffs**, `feedinType` and `offtakeType` **both** have to

                    be set to `EXTERNAL`.


                    External tariffs are tariffs where the prices are sent directly via API and

                    not calculated.


                    The price periods are sent with the `/systems/{systemID}/tariff/prices` endpoint.'
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name of the energy tariff, to be chosen freely.
                      example: E.ON Strom
                    currency:
                      type: string
                      description: Currency code (ISO 4217).
                      example: EUR
                    feedinType:
                      type: string
                      description: Type of feed-in tariff.
                      example: STATIC
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: FeedinTariffType
                    offtakeType:
                      type: string
                      description: Type of off-take tariff.
                      example: MARKET_DATA
                      enum:
                      - MARKET_DATA
                      - STATIC
                      - EXTERNAL
                      - DYNAMIC
                      x-readme-ref-name: OfftakeTariffType
                    gridFeeType:
                      type:
                      - string
                      - 'null'
                      description: Name of the grid fee type.
                      readOnly: true
                      enum:
                      - STANDARD
                      - MODULE2
                      - MODULE3
                    energyProvider:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: 'Identifier of the energy provider. The end prices for off-take will be fetched for the

                        corresponding energy provider.


                        If not defined, the end prices will be determined based on the raw market prices and grid fees,

                        without considering the margin of the energy provider.


                        Only valid for tariffs with `offtakeType` set to `DYNAMIC`.'
                    staticPeriods:
                      description: 'Weekly recurring periods with static prices. Used for example

                        for completely static, day/night and weekend tariffs.



                        Static periods have to form a closed loop. The loop must cover the whole

                        week:


                        A period has to end at the start of the next period. The end of the last

                        period has to be the start of the first period.'
                      type: array
                      items:
                        title: TariffV2 Static period
                        description: 'Contains the tariff periods for a tariff with either OfftakeType

                          or FeedinType `STATIC`.



                          The period is active between `from` and `to`. `from` is included in the interval,

                          `to` is excluded.'
