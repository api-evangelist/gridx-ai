                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
                                type: integer
                                minimum: 0
                                maximum: 6
                                example: 0
                              secondsOfDay:
                                description: The second of the weekday until the period is valid/which the period is valid from
                                type: integer
                                minimum: 0
                                maximum: 86399
                                example: 0
                            required:
                            - weekday
                            - secondsOfDay
                            x-readme-ref-name: TariffV2StaticPeriodTime
                          to:
                            title: TariffV2 static period time
                            description: 'Contains the information when a static period of a TariffV2 starts

                              or ends.


                              Described by the weekday and the seconds of this day."'
                            type: object
                            properties:
                              weekday:
                                description: The weekdays index (Sunday=0, ...)
