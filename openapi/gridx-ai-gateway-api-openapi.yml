openapi: 3.2.0
info:
  title: Gridx Ai Gateway API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Gateway across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Gateway
  x-displayName: Gateway
paths:
  /gateways:
    get:
      operationId: listGateways
      summary: List all Gateways
      description: List gateways that are accessible to the authenticated user.
      tags:
      - Gateway
      parameters:
      - name: page
        description: 'Requested page, to be used in combination with the `per_page` parameter.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
        example: 1
      - name: per_page
        description: 'Requested number of items per page.

          '
        in: query
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 20
          maximum: 500
        example: 10
      - name: sort
        description: 'The field to sort the results by, to be used in combination with the `order` parameter.

          Defaults to `created`.

          '
        in: query
        schema:
          type: string
          enum:
          - updated
          - serialnumber
          - created
          - type
          default: created
        example: updated
      - name: order
        description: 'Order direction of the results, to be used in combination with the `sort` parameter.

          Defaults to `asc`.

          '
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: desc
      - name: include
        description: "This query param allows to set certain fields only when needed.\nThis makes the request faster as it requires to load only necessary data.\n\nIf this param is set, only the specified fields are included.\nAll other fields, which are possible to include, will be excluded then.\n\n**Note:** `connectionStatus` is always included in the response and does not need to be specified.\nThis value is deprecated and will be removed in a future version.\n\n**Note:** `additionalIdentifiers` is always included in the response if the gateway has any, and \ndoes not need to be specified.\nThis value is deprecated and will be removed in a future version.\n"
        in: query
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - applianceComposition
            - connectionStatus
            - additionalIdentifiers
            - systems
            - scanners
      - name: start_code
        description: 'Filter by gateway startcode.

          A startcode belongs to one gateway, so using this will return only one gateway.

          '
        in: query
        schema:
          type: string
          example: 39FDDF7D85BAAD2D
          pattern: ^[A-F0-9]{16}$
      - name: serial_number
        description: 'Filter by gateway serial number.

          A serial number is unique, so using this will return only one gateway.

          '
        in: query
        schema:
          type: string
          example: C083-200-000-000-199-P-X
      responses:
        '200':
          description: 'An array of gateways of up to `per_page` gateways, sorted by `sort` and `order`.


            Each entry in the array is a separate gateway. If no gateway is available, the resulting array will be empty.

            '
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  allOf:
                  - title: Gateway
                    description: 'A gateway used to monitor and control appliances.


                      For instance, our beloved gridbox is a gateway.

                      '
                    type: object
                    properties:
                      name:
                        deprecated: true
                        type: string
                        maxLength: 255
                        description: Name of the gateway.
                      debugModeUntil:
                        deprecated: true
                        type: string
                        format: date-time
                        description: 'Date until which debug messages are logged in RFC3339 format.

                          **Deprecated**: defaults to `createdAt` + 3 days.

                          '
                    x-readme-ref-name: AbstractGateway
                  - properties:
                      id:
                        type: string
                        format: uuid
                        example: 6dd0a658-5828-4d30-bc65-a03c6d6e425f
                        description: Unique identifier of a gateway.
                        readOnly: true
                      type:
                        type: string
                        description: 'Type of the gateway.


                          **Deprecated** - Non-physical gateways will no longer be supported from 01.03.2024. This field will consequently be removed.

                          '
                        deprecated: true
                        enum:
                        - VIRTUAL
                        - PHYSICAL
                        - OTHER
                        x-readme-ref-name: GatewayType
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the Gateway was created in RFC3339 format.
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the Gateway was last updated in RFC3339 format.
                      registeredAt:
                        deprecated: true
                        type: string
                        format: date-time
                        readOnly: true
                        description: 'Date when the Gateway was first registered in RFC3339 format.

                          **Deprecated**: defaults to `createdAt`.

                          '
                      connectionStatus:
                        title: Connection Status
                        type: object
                        readOnly: true
                        properties:
                          status:
                            type: string
                            description: "Indicates the connection status. Is one of:\n  * `AVAILABLE`: Gateway has sent data in the last 5 minutes\n  * `TEMPORARILY_UNAVAILABLE`: Gateway has not sent data in the last 5 minutes\n  * `UNAVAILABLE`: Gateway has not sent data in the last 24 hours\n  * `UNKNOWN`: Gateway was never online and never sent data or the connection status can't be determined."
                            enum:
                            - AVAILABLE
                            - TEMPORARILY_UNAVAILABLE
                            - UNAVAILABLE
                            - UNKNOWN
                          contactedAt:
                            type: string
                            format: date-time
                            deprecated: true
                            description: 'When the gateway/appliance has last contacted the gridX cloud.


                              In case the gateway was never online and never sent data, this field is null.


                              Deprecated: Gateway heartbeats will be removed in future versions and this will be only estimated. Use `statusChangedAt` instead.

                              '
                          statusChangedAt:
                            type: string
                            format: date-time
                            description: 'When the gateway status last changed. In case the gateway was never online this field is null.

                              '
                        required:
                        - status
                        x-readme-ref-name: ConnectionStatus
                      vendorID:
                        deprecated: true
                        description: 'ID of the vendor account to which the corresponding system is assigned.

                          **Deprecated**: omitted from responses by default.

                          '
                        type: string
                        format: uuid
                        example: 6dd0a658-5828-4d30-bc65-a03c6d6e425f
                      startcode:
                        description: Code used to register a new gateway.
                        type: string
                        example: 39FDDF7D85BAAD2D
                      manufacturer:
                        deprecated: true
                        description: 'Manufacturer of the gateway.

                          **Deprecated**: defaults to `gridX`.

                          '
                        type: string
                        example: gridX
                        readOnly: true
                      model:
                        description: Model of the gateway.
                        type: string
                        example: 2.00P-X
                        readOnly: true
                      serialnumber:
                        description: Serial number of the gateway.
                        type: string
                        example: C083-200-000-000-199-P-X
                        readOnly: true
                      additionalIdentifiers:
                        description: Additional identifiers used by the gateway.
                        type: array
                        items:
                          title: Additional identifiers of the gridBox.
                          description: Additional identifiers used by the gridBox.
                          type: object
                          properties:
                            service:
                              type: string
                              readOnly: true
                              description: The service this identifier is referring to, e.g the protocol used for the appliance-gridBox handshake
                              example: EEBUS
                            type:
                              type: string
                              readOnly: true
                              description: The type of the identifier.
                              example: SKI
                              enum:
                              - UNKNOWN
                              - SKI
                            identifier:
                              type: string
                              readOnly: true
                              description: The actual identifier, e.g "SKI" used in the TLS certificate for the communication. If type is "SKI", it is hexadecimal-encoded.
                          x-readme-ref-name: AdditionalIdentifier
                        readOnly: true
                      scanners:
