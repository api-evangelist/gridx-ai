  /gateways/{gatewayID}/firmware:
    get:
      operationId: getGatewayFirmware
      summary: Get a gateway's firmware information
      description: 'Get information about the firmware that is selected to be run on a gateway.


        For gateways with the CHARGE solution, the response also includes the

        `releaseChannel` field indicating which release channel (alpha, stable,

        checkpoint, or custom) the gateway is assigned to. This field is omitted

        for gateways running other solutions.


        Note: For offline gateways, this endpoint returns the firmware that is

        scheduled for installation once the gateway reconnects to the cloud.


        The firmware information is fetched on demand on a "best effort"

        basis, which may intermittently report no firmware data for an

        otherwise healthy gateway. In such cases this endpoint returns

        `204 No Content` with an empty body.'
      tags:
      - Gateway
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      responses:
        '200':
          description: Returned firmware information for a gateway.
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: Firmware
                description: Represents information about a gateway's firmware.
                type: object
                properties:
                  components:
                    description: An application or component running on the gateway.
                    type: array
                    items:
                      title: FirmwareComponent
                      description: Represents a firmware component running on a gateway.
                      type: object
                      properties:
                        name:
