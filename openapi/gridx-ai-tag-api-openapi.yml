openapi: 3.2.0
info:
  title: Gridx Ai Tag API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Tag across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Tag
  x-displayName: Tag
paths:
  /systems/{systemID}/tags:
    put:
      summary: Replace and create all tags for a specific system
      description: 'Replaces all tags associated with a specific system. If the request payload contains tags,

        all existing tags will be removed and replaced with the ones provided.

        If an empty array is provided, all tags will be removed for the system.'
      operationId: setSystemTags
      tags:
      - Tag
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      requestBody:
        description: 'Array of tags to be assigned to the system.

          All existing tags will be replaced with the ones provided in the request payload.

          A request payload with an empty array `[]` will remove all tags for the system.

          '
        required: true
        content:
          application/json:
            schema:
              description: 'An array of tags where each tag includes a name and a value.

                '
              type: array
              items:
                allOf:
                - type: object
                  description: "A Tag represents a key-value pair that can be associated with a specific system.\nIt allows categorization, labeling, or providing metadata to systems.\nEach tag consists of a name and value, where the name is constrained to lowercase letters and hyphens, \nand both the name and value have a maximum length of 128 characters.\n"
                  required:
                  - name
                  - value
                  properties:
                    name:
                      type: string
                      description: "The unique identifier of the tag within the context of the system.\nThe tag name must consist only of lowercase letters (a-z), numbers (0-9), and hyphens (-), and must not start or end with a hyphen. \nIt can be at most 128 characters long.\n"
                      maxLength: 128
                      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                      example: category
                    value:
                      type: string
                      description: 'The value associated with the tag name.

                        This can be any valid string up to 128 characters.

                        '
                      maxLength: 128
                      example: technology
                  x-readme-ref-name: AbstractTag
                - additionalProperties: false
                x-readme-ref-name: AbstractTagStrict
              x-readme-ref-name: AbstractTagsStrict
      responses:
        '200':
          description: Tags successfully created for the system.
          content:
            application/json:
              schema:
                description: 'An array of tags.

                  '
                type: array
                items:
                  allOf:
                  - type: object
                    description: "A Tag represents a key-value pair that can be associated with a specific system.\nIt allows categorization, labeling, or providing metadata to systems.\nEach tag consists of a name and value, where the name is constrained to lowercase letters and hyphens, \nand both the name and value have a maximum length of 128 characters.\n"
                    required:
                    - name
                    - value
                    properties:
                      name:
                        type: string
                        description: "The unique identifier of the tag within the context of the system.\nThe tag name must consist only of lowercase letters (a-z), numbers (0-9), and hyphens (-), and must not start or end with a hyphen. \nIt can be at most 128 characters long.\n"
                        maxLength: 128
                        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                        example: category
                      value:
                        type: string
                        description: 'The value associated with the tag name.

                          This can be any valid string up to 128 characters.

                          '
                        maxLength: 128
                        example: technology
                    x-readme-ref-name: AbstractTag
                  - properties:
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the system tag was created in RFC3339 format.
                        example: '2017-12-22T14:20:50Z'
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the system tag was last updated in RFC3339 format.
                        example: '2017-12-24T08:33:00Z'
                  x-readme-ref-name: Tag
                example:
                - name: category
                  value: technology
                  createdAt: '2017-12-22T14:20:50Z'
                  updatedAt: '2017-12-22T14:20:50Z'
                - name: priority
                  value: high
                  createdAt: '2017-12-22T14:20:50Z'
                  updatedAt: '2017-12-22T14:20:50Z'
                x-readme-ref-name: Tags
        '400':
          description: Malformed request.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Bad Request
                  description: 'Bad Request indicates that the request body is not a valid JSON or

                    it contains a invalid json type.

                    '
                  example:
                    message: Problems parsing JSON
                x-readme-ref-name: BadRequestException
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
