    get:
      summary: List Tags for a Specific System
      description: Retrieves a list of tags associated with a specific system. Optionally filters tags by their names and values using prefix, suffix, and substring filters. All provided filters are combined using logical AND, meaning only tags that satisfy **all** filter conditions will be returned. If no filters are provided, all tags for the specified post are returned. **Note:** All filtering is case-sensitive.
      operationId: listSystemTags
      tags:
      - Tag
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: nameHasPrefix
        in: query
        description: Filters tags where the name starts with the specified prefix.
        required: false
        schema:
          type: string
          example: cat
      - name: nameHasSuffix
        in: query
        description: Filters tags where the name ends with the specified suffix.
        required: false
        schema:
          type: string
          example: ory
      - name: nameContains
        in: query
        description: Filters tags where the name contains the specified substring.
        required: false
        schema:
          type: string
          example: ate
      - name: value
        in: query
        description: Filters tags by an exact match on the tag value.
        required: false
        schema:
          type: string
          example: technology
      - name: valueHasPrefix
        in: query
        description: Filters tags where the value starts with the specified prefix.
        required: false
        schema:
          type: string
          example: tech
      - name: valueHasSuffix
        in: query
        description: Filters tags where the value ends with the specified suffix.
        required: false
        schema:
          type: string
          example: logy
      - name: valueContains
        in: query
        description: Filters tags where the value contains the specified substring.
        required: false
        schema:
          type: string
          example: chnol
      responses:
        '200':
          description: Tags that match provided optional filters returned.
          content:
            application/json:
              schema:
                description: 'An array of tags.

                  '
                type: array
                items:
                  allOf:
                  - type: object
                    description: "A Tag represents a key-value pair that can be associated with a specific system.\nIt allows categorization, labeling, or providing metadata to systems.\nEach tag consists of a name and value, where the name is constrained to lowercase letters and hyphens, \nand both the name and value have a maximum length of 128 characters.\n"
                    required:
                    - name
                    - value
                    properties:
                      name:
                        type: string
                        description: "The unique identifier of the tag within the context of the system.\nThe tag name must consist only of lowercase letters (a-z), numbers (0-9), and hyphens (-), and must not start or end with a hyphen. \nIt can be at most 128 characters long.\n"
                        maxLength: 128
                        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                        example: category
                      value:
                        type: string
                        description: 'The value associated with the tag name.

                          This can be any valid string up to 128 characters.

                          '
                        maxLength: 128
                        example: technology
                    x-readme-ref-name: AbstractTag
                  - properties:
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the system tag was created in RFC3339 format.
                        example: '2017-12-22T14:20:50Z'
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the system tag was last updated in RFC3339 format.
                        example: '2017-12-24T08:33:00Z'
                  x-readme-ref-name: Tag
                example:
                - name: category
                  value: technology
                  createdAt: '2017-12-22T14:20:50Z'
                  updatedAt: '2017-12-22T14:20:50Z'
                - name: priority
                  value: high
                  createdAt: '2017-12-22T14:20:50Z'
