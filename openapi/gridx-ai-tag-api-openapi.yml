        source: "import requests\n\nurl = \"https://api.gridx.de/systems/systemID/tags\"\n\nheaders = {\n    \"accept\": \"application/json\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.put(url, headers=headers)\n\nprint(response.text)"
