  /systems/{systemID}/tags/{tagName}:
    put:
      summary: Create or update a tag for a system
      description: 'Creates or updates a tag for a specific system. If the tag doesn''t exist, it will be created,

        and the status code `201 Created` will be returned.

        If the tag exists, its value will be updated and the status code `200 OK` will be returned

        (even if the new value is the same as the previous one).'
      operationId: setSystemTag
      tags:
      - Tag
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: tagName
        in: path
        required: true
        description: The name of the tag to create or update. Must only contain lowercase letters and hyphens, and must not start or end with a hyphen. Must be 128 characters max.
        schema:
          type: string
          maxLength: 128
          pattern: ^[a-z]+(-[a-z]+)*$
      requestBody:
        description: The value to associate with the tag.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                description: 'A TagValue represents a value for a key-value tag pair that can be associated with a specific system.

                  Each tag has a value which has a maximum length of 128 characters.

                  '
                required:
                - value
                properties:
                  value:
                    type: string
                    description: 'The value associated with the tag name.

                      This can be any valid string up to 128 characters.

                      '
                    maxLength: 128
                    example: technology
                x-readme-ref-name: TagValue
              - additionalProperties: false
              x-readme-ref-name: TagValueStrict
      responses:
        '200':
          description: Tag was successfully updated.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: "A Tag represents a key-value pair that can be associated with a specific system.\nIt allows categorization, labeling, or providing metadata to systems.\nEach tag consists of a name and value, where the name is constrained to lowercase letters and hyphens, \nand both the name and value have a maximum length of 128 characters.\n"
                  required:
                  - name
                  - value
                  properties:
                    name:
                      type: string
                      description: "The unique identifier of the tag within the context of the system.\nThe tag name must consist only of lowercase letters (a-z), numbers (0-9), and hyphens (-), and must not start or end with a hyphen. \nIt can be at most 128 characters long.\n"
                      maxLength: 128
                      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
