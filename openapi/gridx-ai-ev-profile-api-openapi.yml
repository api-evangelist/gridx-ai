openapi: 3.2.0
info:
  title: Gridx Ai EV Profile API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged EV Profile across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: EV Profile
  x-displayName: EV Profile
paths:
  /systems/{systemID}/ev-profiles:
    get:
      operationId: listSystemEVProfiles
      summary: List available EV profiles
      description: Lists EV profiles that belong the the specified system.
      tags:
      - EV Profile
      security:
      - HeaderAuth:
        - EVProfilesRead
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Available EV profiles.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  allOf:
                  - title: ElectricVehicleProfile
                    description: Represents data related to an EV Profile.
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the EV profile.
                        example: My profile
                      manufacturer:
                        type: string
                        description: The manufacturer of the EV.
                        example: Tesla
                      model:
                        type: string
                        description: The model of the EV (manufacturer-dependent).
                        example: Model-3
                      color:
                        type: string
                        description: The color of the EV.
                        example: red
                      capacity:
                        type: number
                        description: Battery capacity of the EV in Wh.
                        example: 12000
                      averageConsumption:
                        type: number
                        description: The average consumption of the EV provided in Wh/100km.
                        example: 30000
                      phasesCount:
                        type: number
                        format: int64
                        description: The number of phases used for charging the EV (range 1-3).
                        example: 1
                      minChargePower:
                        description: "The minimum total power that the EV should be charged with in Watt.   \n\nIf the EV Profile is assigned to a charging station, this configuration will be applied, \notherwise, the [EV Charging Station Configuration](https://developer.gridx.ai/reference/get_gateways-gatewayid-appliances-applianceid-ev-configuration) will be used.\n"
                        type: number
                        format: double
                        example: 8000
                      userSoc:
                        description: "The State of Charge (SoC) level read and set by the user for the connected EV.\nThis should be the SoC at the moment the EV is plugged, as the EMS extrapolates the currently estimated SoC \nduring the charging session from this value onwards.\nThis parameter can not be used to update the current SoC of an EV while a charging session is already \nongoing as this would lead to SoC misestimations.\n\nThis is needed in cases where the SoC cannot be determined automatically.\nValue is between 0.0 - 100.0 in %.\nIf the EV Profile is assigned to a charging station, this configuration will be applied,\notherwise, the [EV Charging Station Configuration](https://developer.gridx.ai/reference/get_gateways-gatewayid-appliances-applianceid-ev-configuration) will be used.\n"
                        type: number
                        format: double
                        minimum: 0
                        maximum: 100
                        example: 50
                      image:
                        description: Image to be used when displaying the EV profile in base64 encoding. Format must be `jpeg` or `png`.
                        type: string
                        example: data:image/jpeg;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==
                      minChargePowerPerPhase:
                        type: number
                        description: Defines the minimum charge power in W for one phase set by the user.
                        example: 2070
                      minRequestedSoc:
                        type: number
                        description: The minimum state of charge the EV shall have and keep to guarantee the range for the next usage. This is set by the user. The value ranges from 0.0 - 100.0 in %.
                        example: 70
                      zeroLockDuration:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 2147483647
                        description: Defines how long the EV is limited to zero charging power after an initial zero limit is issued. Given in seconds.
                      phaseSwitchFeatureEnabled:
                        type: boolean
                        description: Defines whether the phase switch feature is enabled.
                    x-readme-ref-name: AbstractElectricVehicleProfile
                  - properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of an EV profile.
                        example: 51c0c70f-dfcc-4520-b535-0ecc44c75e12
                      systemID:
                        description: Unique identifier of the system that this EV profile belongs to.
                        type: string
                        format: uuid
                        example: 938b84d9-17e9-44e5-b422-4fb95ea3550b
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the EV profile was created in UTC using the RFC3339 format.
                        example: '2022-11-10T23:20:50Z'
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date when the EV profile was updated the last time in UTC using the RFC3339 format.
                        example: '2022-11-12T23:20:50Z'
                      chargingStationApplianceIDs:
                        readOnly: true
                        title: ChargingStationApplianceIDs
                        description: 'ChargingStationApplianceIDs represents the charging station appliances the EV is assigned to.

                          '
                        type: array
                        items:
                          type: string
                          format: uuid
                        example:
                        - 6dd0a658-5828-4d30-bc65-a03c6d6e425f
                        - e3bb9553-78a6-4f4f-98d5-5c5f9012251d
                    required:
                    - id
                    - systemID
                    - createdAt
                    - updatedAt
                  x-readme-ref-name: ElectricVehicleProfile
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: Requested entity not found.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
