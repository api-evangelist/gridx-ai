                    default: 0
                    format: int64
                x-readme-ref-name: AbstractImportPowerLimit
              - additionalProperties: false
              x-readme-ref-name: ImportPowerLimitSetStrict
            examples:
              ThreePhaseHousehouldAsymmetricLimits:
                summary: Three phase household with asymmetric limits.
                value:
                  numberOfPhases: 3
                  maxImportTotal: 15000
                  maxImportL1: 4000
                  maxImportL2: 6000
                  maxImportL3: 5000
              ThreePhaseHouseholdAsymmetricLimitsAdditionalMargin:
                summary: Three phase household with asymmetric limits and an additional safety margin of 1kW.
                value:
                  numberOfPhases: 3
                  maxImportTotal: 15000
                  maxImportL1: 4000
                  maxImportL2: 6000
                  maxImportL3: 5000
                  importEVMarginTotal: 1000
                  maxImportEVMarginL1: 1000
                  maxImportEVMarginL2: 1000
                  maxImportEVMarginL3: 1000
              SinglePhaseHouseholdUnknownPhase:
                summary: Single phase household with asymmetric limits. If the phase the household is being measured on is unknown, all phase limits can be provided with the same value.
