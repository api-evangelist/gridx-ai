openapi: 3.2.0
info:
  title: Gridx Ai Import Power Limit API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Import Power Limit across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Import Power Limit
  x-displayName: Import Power Limit
paths:
  /systems/{systemID}/gateways/{gatewayID}/import-power-limit:
    get:
      summary: Retrieve gateway's current import power limit
      operationId: getSystemGatewayImportPowerLimit
      tags:
      - Import Power Limit
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      responses:
        '200':
          description: Import power limit returned.
          content:
            application/vnd.gridx.v2+json:
              schema:
                allOf:
                - title: Import power limit
                  type: object
                  properties:
                    numberOfPhases:
                      type: integer
                      description: Number of phases the import power limit is set for. 1 or 3. Default is 3.
                      enum:
                      - 1
                      - 3
                      example: 3
                      default: 3
                      format: int32
                    maxImportTotal:
                      type: integer
                      description: Maximum total import power in W.
                      default: 0
                      format: int64
                    maxImportL1:
                      type: integer
                      description: Maximum total import power in the first phase in W.
                      default: 0
                      format: int64
                    maxImportL2:
                      type: integer
                      description: Maximum total import power in the second phase in W.
                      default: 0
                      format: int64
                    maxImportL3:
                      type: integer
                      description: Maximum total import power in the third phase in W.
                      default: 0
                      format: int64
                    importEVMarginTotal:
                      type: integer
                      description: Maximum import power margin in W. This is the safety margin to the limit.
                      default: 0
                      format: int64
                    importEVMarginPhase:
                      deprecated: true
                      type: integer
                      format: int64
                    maxImportEVMarginL1:
                      type: integer
                      description: Maximum import power margin in the first phase in W. This is the safety margin to the limit.
                      default: 0
                      format: int64
                    maxImportEVMarginL2:
                      type: integer
                      description: Maximum import power margin in the second phase in W. This is the safety margin to the limit.
                      default: 0
                      format: int64
                    maxImportEVMarginL3:
                      type: integer
                      description: Maximum import power margin in the third phase in W. This is the safety margin to the limit.
                      default: 0
                      format: int64
                    maxImportEVWorstCase:
                      type: integer
                      description: The assumed maximum charging power in W for all EVs in case the connection to the grid connection point meter is lost.
                      default: 0
                      format: int64
                    maxImportEVWorstCaseL1:
                      type: integer
                      description: The assumed maximum charging power in W for all EVs in case the connection to the grid connection point meter is lost for the first phase.
                      default: 0
                      format: int64
                    maxImportEVWorstCaseL2:
                      type: integer
                      description: The assumed maximum charging power in W for all EVs in case the connection to the grid connection point meter is lost for the second phase.
                      default: 0
                      format: int64
                    maxImportEVWorstCaseL3:
                      type: integer
                      description: The assumed maximum charging power in W for all EVs in case the connection to the grid connection point meter is lost for the third phase.
                      default: 0
                      format: int64
                  x-readme-ref-name: AbstractImportPowerLimit
                - properties:
                    internalDeviceID:
                      type: string
                      description: Unique ID to identify the gateway the import power limit belongs to.
                      example: aeb639cf0793e81f0804c6647af7f0900a847921c0596726f1afdfd04a3a3186
                      readOnly: true
                    createdAt:
                      type: string
                      description: Time at which the import power limit was created in UTC using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                      readOnly: true
                    updatedAt:
                      type: string
                      description: Time at which the import power limit was updated in UTC using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                      readOnly: true
                  required:
                  - numberOfPhases
                  - internalDeviceID
                  - createdAt
                  - updatedAt
                  - maxImportTotal
                  - maxImportL1
                  - maxImportL2
                  - maxImportL3
                  - importEVMarginTotal
                  - maxImportEVMarginL1
                  - maxImportEVMarginL2
                  - maxImportEVMarginL3
                  - maxImportEVWorstCase
                  - maxImportEVWorstCaseL1
                  - maxImportEVWorstCaseL2
                  - maxImportEVWorstCaseL3
                x-readme-ref-name: ImportPowerLimit
        '403':
          description: Forbidden.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: UnauthorizedError - Forbidden Error
                  description: Forbidden Error
                  example:
                    message: Bad credentials
                x-readme-ref-name: ForbiddenException
        '404':
          description: Import power limit not found.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '422':
          description: Validation failed.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Validation
                  description: 'Validation indicates that the request body contains fields which

                    does not pass the validation.

                    '
                  type: object
                  required:
                  - message
                  - details
                  example:
                    message: Validation failed
                    details:
                    - email is not valid
                x-readme-ref-name: InvalidException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      security:
      - HeaderAuth:
        - SystemsRead
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/systems/systemID/gateways/gatewayID/import-power-limit"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
