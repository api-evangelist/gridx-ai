  /systems/{systemID}/import-power-limit-schedule:
    get:
      operationId: getSystemImportPowerLimitSchedule
      summary: Retrieve an import power limit schedule
      description: 'Retrieves the import power limit schedule.


        IMPORTANT: This is currently only supported for systems which have Time-of-Use (ToU) optimization enabled.'
      tags:
      - Import Power Limit
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      responses:
        '200':
          description: Returned import power limit schedule.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: An import power limit schedule defines recurring import power limits which are be applied to the grid connection point.
                type: object
                required:
                - periods
                properties:
                  timezone:
                    type: string
                    description: 'Fully qualified identifier of the timezone ([IANA timezone database identifiers](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)) this schedule should be applied in.

                      Used to determine time of day of the timeframes.'
                    default: UTC
                  reserveSoc:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: 'Reserve state of charge for the battery as a fraction (0.0-1.0).


                      If not specified, defaults to 0.15 (15%).'
                    default: 0.15
                    example: 0.2
                  periods:
                    description: 'List of periods defining which import limit should be applied at which time of the day.


                      The period is active between `from` and `to`. `from` is included in the interval,

                      `to` is excluded.


                      Missing periods (gaps between defined periods) are interpreted as no import limit should be applied.


                      Overlapping or duplicate periods are invalid.'
                    type: array
                    items:
                      type: object
                      required:
                      - from
                      - to
                      properties:
                        from:
                          type: string
                          format: time
                          example: 00:00:00
                          description: Start of the period (inclusive), in HH:MM:SS format.
                        to:
                          type: string
                          format: time
                          example: 00:00:00
                          description: End of the period (exclusive), in HH:MM:SS format.
                        weekdays:
                          description: 'Specifies a list of weekdays this rule should apply to.


                            Omitting this is the same as selecting all days.'
                          type: array
                          example:
                          - MO
                          - WE
                          - FR
                          items:
                            type: string
                            enum:
                            - SU
                            - MO
                            - TU
                            - WE
                            - TH
                            - FR
                            - SA
                        maxImportTotal:
                          description: 'Maximum import power at the grid connection point in Watt.


                            Omitting this field is the same as selecting no import power limit for this period.'
                          type: integer
                          format: int64
                          minimum: 0
                          example: 10000
                x-readme-ref-name: ImportPowerLimitSchedule
