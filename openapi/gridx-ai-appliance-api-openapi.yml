                            sensorL2:
                              type: integer
                              description: '**DEPRECATED:** This property is only applicable to `METER` asset types.


                                SensorID for phase 2 of the appliance

                                '
                            sensorL3:
                              type: integer
                              description: '**DEPRECATED:** This property is only applicable to `METER` asset types.


                                SensorID for phase 3 of the appliance

                                '
                          x-readme-ref-name: AbstractSensorSettings
                        - required:
                          - createdAt
                          - updatedAt
                          properties:
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                        x-readme-ref-name: SensorSettings
                      source:
                        title: Source
                        type: object
                        required:
                        - origin
                        properties:
                          origin:
                            type: string
                            description: "Specifies who created the appliance. This can be one of:\n- `GRIDBOX` if the appliance was found during a scan using a gridBox.\n- `API` if a user of the gridX API used the 'Create Appliance' endpoint\n  to create this appliance.\n- `UNKNOWN` otherwise.\n"
                            enum:
                            - UNKNOWN
                            - GRIDBOX
                            - API
                            example: API
                          uri:
                            type: string
                            deprecated: true
                            description: 'Contains an URI identifying the exact resource that created this appliance.


                              If origin is ''GRIDBOX'' the value will point to the gateway object of the gridBox. If

                              origin is ''API'' the value will be empty.

                              The ''UNKNOWN'' origin should not occur in practice and is reserved for special cases (for now).

                              '
                            example: gateways/b30510fa-a8a5-475f-a75d-82a46cb62582
                        x-readme-ref-name: Source
                      commissioningKind:
                        title: Commissioning Kind
                        description: 'Indicates special requirements to be fulfilled during the commissioning for this appliance.


                          If empty or unset (default), the appliance can be commissioned as regular.

                          - `property:CryptoSettings` means that the appliance property `CryptoSettings` needs to be set, e.g. for authenticating towards it with an appliance-specific API token.

                          - `flow:Pairing` means that a coupling or pairing flow has to be initiated and run-through in order for the appliance to behave correctly.

                          '
                        type: string
                        enum:
                        - property:CryptoSettings
                        - flow:Pairing
                        x-readme-ref-name: CommissioningKind
                      state:
                        title: State
                        description: Contains information about the appliance's state.
                        type: object
                        allOf:
                        - title: State
                          description: Contains information about the appliance's state.
                          type: object
                          properties:
                            current:
                              description: The state the appliance is currently in.
                              example: SCANNED
                              title: Appliance State
                              type: string
                              enum:
                              - UNKNOWN_APPLIANCE_STATE
                              - SCANNED
                              - CONNECTING
                              - VERIFYING
                              - UNTRUSTED
                              - CONNECTED
                              - DISCONNECTED
                              x-readme-ref-name: ApplianceState
                            transitions:
                              description: "List with all the possible state transitions an appliance can go through. \nAn appliance can go from a `starting` state to a `target` state.\n"
                              type: array
                              items:
                                title: State Transition
                                description: Defines the properties of a transition an appliance can go through.
                                type: object
                                required:
                                - start
                                - target
                                properties:
                                  start:
                                    description: The starting state of the appliance.
                                    example: CONNECTING
                                    title: Appliance State
                                    type: string
                                    enum:
                                    - UNKNOWN_APPLIANCE_STATE
                                    - SCANNED
                                    - CONNECTING
                                    - VERIFYING
                                    - UNTRUSTED
                                    - CONNECTED
                                    - DISCONNECTED
                                    x-readme-ref-name: ApplianceState
                                  target:
                                    description: The target state of the appliance.
                                    example: DISCONNECTED
                                    title: Appliance State
                                    type: string
                                    enum:
                                    - UNKNOWN_APPLIANCE_STATE
                                    - SCANNED
                                    - CONNECTING
                                    - VERIFYING
                                    - UNTRUSTED
                                    - CONNECTED
                                    - DISCONNECTED
                                    x-readme-ref-name: ApplianceState
                                x-readme-ref-name: StateTransition
