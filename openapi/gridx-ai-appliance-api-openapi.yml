      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/gateways/gatewayID/appliances"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/gateways/gatewayID/appliances \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/gateways/gatewayID/appliances\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/gateways/gatewayID/appliances', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/gateways/gatewayID/appliances\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/gateways/gatewayID/appliances\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/gateways/gatewayID/appliances")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/gateways/gatewayID/appliances");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    servers:
    - url: https://api.gridx.de
      description: Production
  /gateways/{gatewayID}/appliances/{applianceID}:
    get:
      operationId: getGatewayAppliance
      summary: Retrieve an Appliance
      description: Retrieves the details of an existing appliance.
      tags:
      - Appliance
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      - name: applianceID
        description: 'Unique identifier used to access an appliance.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      responses:
        '200':
          description: Returned Appliance.
          content:
            application/vnd.gridx.v2+json:
              schema:
                title: Appliance
                description: 'Appliance represents a monitor-/controllable device such as Inverters,

                  Meters and Heat Pumps.

                  '
                readOnly: true
                oneOf:
                - title: Inverter
                  description: 'Inverter represents a monitor-/controllable inverter. It can be of kind:

                    - `PV`/`PV_EXTERNAL`: used as photovoltaic only.

                    - `BATTERY`: used as battery only.

                    - `HYBRID`: used as both photovoltaic and battery.

                    - `UNKNOWN`: default, when the inverter kind is not determined.

                    '
                  allOf:
                  - title: Base Appliance
                    description: 'BaseAppliance contains fields that all appliances have in common.


                      Specific appliance types extend this schema and add new fields.

                      '
                    type: object
                    required:
                    - id
                    - inactive
                    - createdAt
                    - updatedAt
                    - type
                    - position
                    - reverseFlow
                    - connectionStatus
                    - gatewayType
                    - state
                    - deviceID
                    - systemID
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: ec4d0c89-a604-49ac-82f0-427f9cb42204
                        description: Uniquely identifies the appliance.
                      createdAt:
                        type: string
                        format: date-time
                        description: Specifies when the appliance was created.
                      updatedAt:
                        type: string
                        format: date-time
                        description: Specifies when the appliance was updated the last time.
                      connectionStatus:
                        title: Appliance connection status
                        type: object
                        readOnly: true
                        required:
                        - status
                        properties:
                          status:
                            type: string
                            description: "Indicates the connection status of an appliance.\n    \nThe connection status of an appliance is determined by the gateway. The gateway regularly\nsends the connection status of all connected appliances.\n\nIt is one of:\n- `AVAILABLE`: Appliance was reported as available by the gateway.\n- `UNAVAILABLE`: Appliance was reported as unavailable by the gateway.\n- `UNKNOWN`: The gateway didn't report a status for the appliance.\n\nIn case the connection status of the gateway this appliance belongs to is `TEMPORARILY_UNAVAILABLE` or `UNAVAILABLE`\nthe status is always `UNAVAILABLE`. \n"
                            enum:
                            - AVAILABLE
                            - UNAVAILABLE
                            - UNKNOWN
                          contactedAt:
                            type: string
                            format: date-time
                            deprecated: true
                            description: "No longer supported. \n\nWill be set approximately to a value matching the status field.\nIf the appliance is `AVAILABLE`, it will be the current datetime.\nIf the appliance is `UNAVAILABLE`, it will be a datetime 24 hours in the past. \n"
                          lastHeartbeatReceivedAt:
                            type: string
                            format: date-time
                            description: 'When the last heartbeat of the gateway this appliance is connected was received.


                              Deprecated: gateway heartbeats will be removed in future versions and this will be only estimated.

                              '
                            deprecated: true
                        x-readme-ref-name: ApplianceConnectionStatus
                      gatewayType:
                        type: string
                        x-extensible-enum:
                        - GRIDBOX
                        - CLOUD
                        description: 'Type of the gateway used to communicate with this asset:

                          GRIDBOX → The asset is physically connected to a gridbox, through which it sends measurements and can be controlled.

                          CLOUD → The asset is connected via a cloud-to-cloud integration, through which we receive measurements and can send commands.

                          '
                      status:
                        description: 'Status of the appliance. This field is set dynamically in the appliance handler.


                          **Deprecated** - Use `ConnectionStatus` instead.

                          '
                        type: string
                        enum:
                        - UNDEFINED
                        - OK
                        - WARNING
                        - ERROR
                        deprecated: true
                        x-readme-ref-name: ApplianceStatus
                      type:
                        type: string
                        example: INVERTER
                        description: 'Describes the ''physical'' type of the appliance.


                          See `kind` for further distinction of the type in terms of the appliance''s purpose/role,

                          e.g. appliance with type=INVERTER and kind=BATTERY represents a battery inverter.

                          '
