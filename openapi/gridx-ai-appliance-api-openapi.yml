openapi: 3.2.0
info:
  title: Gridx Ai Appliance API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Appliance across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Appliance
  x-displayName: Appliance
paths:
  /gateways/{gatewayID}/appliances/{applianceID}/measurements/appliance:
    get:
      operationId: getSystemRawMeasurements
      summary: List Appliance's Raw Measurements
      description: 'Lists raw measurements of an appliance over a period of time.


        The provided `interval` must not span more than 24 hours.


        The resolution cannot be controlled. The granularity at which we store

        measurements varies from appliance to appliance, firmware and

        configuration.


        To retrieve raw measurements of hybrid inverters, use the appliance IDs

        of the children (battery or PV) appliances.


        Listing raw measurements is only supported for appliances of type:

        * `INVERTER`

        * `METER`

        * `EVSTATION`

        * `HEAT_PUMP`'
      tags:
      - Appliance
      security:
      - HeaderAuth:
        - ApplianceMeasurementsRead
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      - name: applianceID
        description: 'Unique identifier used to access an appliance.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      - name: interval
        description: 'Requested time interval, formatted in ISO8601.


          In this format the start and end point of the interval are formatted according

          to RFC3339 and separated by a slash "/".

          '
        in: query
        required: true
        allowReserved: true
        example: 2021-12-24T18:21:00Z/2021-12-25T18:21:00Z
        schema:
          type: string
          format: datetime
      responses:
        '200':
          description: Returned raw measurement.
          content:
            application/vnd.gridx.v2+json:
              schema:
                description: List of raw measurements of an appliance.
                type: array
                items:
                  description: Raw measurement of an appliance.
                  type: object
                  oneOf:
                  - title: Inverter's Measurements
                    type: object
                    properties:
                      measuredAt:
                        type: string
                        format: date-time
                        description: Time when the data was measured.
                      gridFrequency:
                        type: integer
                        format: int32
                        description: The locally measured grid frequency in centi (10^-2) Hz.
                      acCurrent:
                        type: integer
                        format: int32
                        description: AC current in mA.
                      l1ACCurrent:
                        type: integer
                        format: int32
                        description: AC current on phase L1 in mA.
                      l2ACCurrent:
                        type: integer
                        format: int32
                        description: AC current on phase L2 in mA.
                      l3ACCurrent:
                        type: integer
                        format: int32
                        description: AC current on phase L3 in mA.
                      l1ACVoltage:
                        type: integer
                        format: int32
                        description: AC voltage on phase L1 in mV.
                      l2ACVoltage:
                        type: integer
                        format: int32
                        description: AC voltage on phase L2 in mV.
                      l3ACVoltage:
                        type: integer
                        format: int32
                        description: AC voltage on phase L3 mV.
                      acActivePower:
                        type: integer
                        format: int32
                        description: AC active power in mW.
                      acReactivePower:
                        type: integer
                        format: int32
                        description: AC reactive power in VAr.
                      acApparentPower:
                        type: integer
                        format: int32
                        description: AC apparent power VA.
                      dcCurrent:
                        type: integer
                        format: int32
                        description: DC current in mA.
                      dcVoltage:
                        type: integer
                        format: int32
                        description: DC voltage in mV.
                      dcPower:
                        type: integer
                        format: int32
                        description: DC power in mW.
                      battery:
                        title: A measurement produced by a battery (inverter).
                        type: object
                        properties:
                          measuredAt:
                            type: string
                            format: date-time
                            description: Time when the data was measured in UTC using RFC3339 format.
                          capacity:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Capacity in Wh.
                          nominalCapacity:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Nominal capacity in Wh.
                          stateOfCharge:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Value in range 0-100, state of charge in percent.
                          stateOfHealth:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Value in range 0-100, health of the battery in percent.
                          temperature:
                            type: integer
                            format: int32
                            description: Temperature of the battery in degrees Celsius.
                          presentCharge:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Current charge of the battery in mW.
                          presentDischarge:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Current discharge of the battery in mW.
                        x-readme-ref-name: BatteryMeasurementRaw
                    required:
                    - measuredAt
                    x-readme-ref-name: InverterMeasurement
