                        connectionStatus:
                          title: Appliance connection status
                          type: object
                          readOnly: true
                          required:
                          - status
                          properties:
                            status:
                              type: string
                              description: "Indicates the connection status of an appliance.\n    \nThe connection status of an appliance is determined by the gateway. The gateway regularly\nsends the connection status of all connected appliances.\n\nIt is one of:\n- `AVAILABLE`: Appliance was reported as available by the gateway.\n- `UNAVAILABLE`: Appliance was reported as unavailable by the gateway.\n- `UNKNOWN`: The gateway didn't report a status for the appliance.\n\nIn case the connection status of the gateway this appliance belongs to is `TEMPORARILY_UNAVAILABLE` or `UNAVAILABLE`\nthe status is always `UNAVAILABLE`. \n"
                              enum:
                              - AVAILABLE
                              - UNAVAILABLE
                              - UNKNOWN
                            contactedAt:
                              type: string
                              format: date-time
                              deprecated: true
                              description: "No longer supported. \n\nWill be set approximately to a value matching the status field.\nIf the appliance is `AVAILABLE`, it will be the current datetime.\nIf the appliance is `UNAVAILABLE`, it will be a datetime 24 hours in the past. \n"
                            lastHeartbeatReceivedAt:
                              type: string
                              format: date-time
                              description: 'When the last heartbeat of the gateway this appliance is connected was received.


                                Deprecated: gateway heartbeats will be removed in future versions and this will be only estimated.

