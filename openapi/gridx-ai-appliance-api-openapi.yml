      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/gateways/gatewayID/appliances/applianceID"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
        label: Shell
        source: "curl --request GET \\\n     --url https://api.gridx.de/gateways/gatewayID/appliances/applianceID \\\n     --header 'accept: application/vnd.gridx.v2+json'"
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl := \"https://api.gridx.de/gateways/gatewayID/appliances/applianceID\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\treq.Header.Add(\"accept\", \"application/vnd.gridx.v2+json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\n\tfmt.Println(string(body))\n\n}"
      - lang: javascript
        label: Javascript
        source: "const options = {method: 'GET', headers: {accept: 'application/vnd.gridx.v2+json'}};\n\nfetch('https://api.gridx.de/gateways/gatewayID/appliances/applianceID', options)\n  .then(res => res.json())\n  .then(res => console.log(res))\n  .catch(err => console.error(err));"
      - lang: java
        label: Java
        source: "OkHttpClient client = new OkHttpClient();\n\nRequest request = new Request.Builder()\n  .url(\"https://api.gridx.de/gateways/gatewayID/appliances/applianceID\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build();\n\nResponse response = client.newCall(request).execute();"
      - lang: java
        label: Kotlin
        source: "val client = OkHttpClient()\n\nval request = Request.Builder()\n  .url(\"https://api.gridx.de/gateways/gatewayID/appliances/applianceID\")\n  .get()\n  .addHeader(\"accept\", \"application/vnd.gridx.v2+json\")\n  .build()\n\nval response = client.newCall(request).execute()"
      - lang: javascript
        label: Swift
        source: 'import Foundation


          let url = URL(string: "https://api.gridx.de/gateways/gatewayID/appliances/applianceID")!

          var request = URLRequest(url: url)

          request.httpMethod = "GET"

          request.timeoutInterval = 10

          request.allHTTPHeaderFields = ["accept": "application/vnd.gridx.v2+json"]


          let (data, _) = try await URLSession.shared.data(for: request)

          print(String(decoding: data, as: UTF8.self))'
      - lang: csharp
        label: C#
        source: 'using RestSharp;



          var options = new RestClientOptions("https://api.gridx.de/gateways/gatewayID/appliances/applianceID");

          var client = new RestClient(options);

          var request = new RestRequest("");

          request.AddHeader("accept", "application/vnd.gridx.v2+json");

          var response = await client.GetAsync(request);


          Console.WriteLine("{0}", response.Content);

          '
    patch:
      operationId: updateGatewayAppliance
      summary: Update an Appliance
      description: 'Updates the specific appliance by setting the values of the body parameters.


        Any parameters not provided will be left unchanged.'
      tags:
      - Appliance
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      - name: applianceID
        description: 'Unique identifier used to access an appliance.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      requestBody:
        description: Partially updates an appliance.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - title: Appliance Update
                description: 'ApplianceUpdate contains fields of an appliance that can be updated.

                  '
                type: object
                properties:
                  inactive:
                    type: boolean
                    x-readme-ref-name: ApplianceInactive
                  name:
                    type: string
                    description: Name of the appliance.
                    x-readme-ref-name: ApplianceName
                  reverseFlow:
                    description: "**Supported ONLY for Meters.**\nFor all other asset types (e.g., EV Chargers, Inverters), this field is unused and **scheduled for removal**.\n\n**Usage (Meters only):**\nIf true, changes the energy flow's direction.\nIf during installation the input/output wiring is mixed up, set it to true in order to compensate for that.\nThis impact the consumption/production calculation as follows: \nIt switches the algebraic sign of the appliance's measurements, e.g. if an appliance measurement showed supply (+), it will change to feed-in (-) after this field is set to true (and vice versa).\n"
                    type: boolean
                    x-readme-ref-name: ApplianceReverseFlow
                  room:
                    type: string
                    description: The physical room/location of the appliance in the building.
                    x-readme-ref-name: ApplianceRoom
                  loadSettings:
                    title: Load Settings
                    description: Configure load of appliance.
                    type: object
                    required:
                    - disabled
                    properties:
                      disabled:
                        type: boolean
                        description: If true, disable electrical load of the appliance (e.g. stops charging for EV charging station).
                    x-readme-ref-name: LoadSettings
                  kind:
                    description: 'Indicates the specific kind or role of the appliance.

                      Only settable for appliances of type `INVERTER` or `METER`.

                      For `INVERTER` appliances of kind `HYBRID`, it is not possible to update the kind,

                      as this break the link to the `PV` and `BATTERY` children, making them orphans.

                      If you wish to reset a `HYBRID` inverter, you can instead delete it and rescan,

                      it will be recreated with `UNKNOWN` kind.

                      '
                    type: string
                    x-extensible-enum:
                    - UNKNOWN
                    - PV
                    - PV_EXTERNAL
                    - BATTERY
                    - HYBRID
                    - GRID
                    - HEAT_PUMP
                    - FUEL_CELL
                    - HEAT_PUMP_EXTERNAL
                    - EVSTATION
                    - BTTP
                    - HEATING
                    - MISC
                    - CLUSTER
                    - WIND_TURBINE
                    - AIR_CONDITIONER
