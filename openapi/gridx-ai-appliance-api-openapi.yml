                          x-readme-ref-name: LoadSettings
                        sensorSettings:
                          title: Sensor Settings
                          type: object
                          allOf:
                          - title: Sensor Settings
                            description: '**DEPRECATED:** This is being phased out. It is historically only applicable to `METER` asset types and is deprecated/ignored for all other asset types.


                              Settings specific to B-Control sensorbar appliances.

                              Allows grouping sensors of one bar as different phases of a single appliance.

