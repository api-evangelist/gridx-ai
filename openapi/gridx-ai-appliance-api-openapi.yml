      - lang: python
        label: Python
        source: "import requests\n\nurl = \"https://api.gridx.de/gateways/gatewayID/appliances/applianceID\"\n\nheaders = {\n    \"accept\": \"application/vnd.gridx.v2+json\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.patch(url, headers=headers)\n\nprint(response.text)"
