    servers:
    - url: https://api.gridx.de
      description: Production
  /gateways/{gatewayID}/appliances/{applianceID}/measurements:
    get:
      operationId: getSystemCombinedMeasurements
      summary: List Appliance's Combined Measurements
      description: 'Lists combinations of appliance measurements and energy management

        measurements.


        This endpoints adds a "convenience" method for fetching raw measurements

        and energy management measurements together, by combining them into a

        single measurement object.


        It is usually used to inspect the EMS behavior in correspondence to raw

        values reported by the appliance.


        The requested `interval` must not span more than 24 hours.


        To retrieve raw measurements of hybrid inverters, use the appliance IDs

        of the children (battery or PV) appliances.


        Listing combined measurements is only supported for appliances of type:

        * `INVERTER`

        * `METER`

        * `EVSTATION`

        * `HEAT_PUMP`'
      tags:
      - Appliance
      security:
      - HeaderAuth:
        - ApplianceMeasurementsRead
      parameters:
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      - name: applianceID
        description: 'Unique identifier used to access an appliance.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: bb2681ab-9526-49ca-bc52-a5f4ec366958
      - name: interval
        description: 'Requested time interval, formatted in ISO8601.


          In this format the start and end point of the interval are formatted according

          to RFC3339 and separated by a slash "/".

          '
        in: query
        required: true
        allowReserved: true
        example: 2021-12-24T18:21:00Z/2021-12-25T18:21:00Z
        schema:
          type: string
          format: datetime
      responses:
        '200':
          description: Combined measurements have been returned successfully.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  type: object
                  description: Combined appliance and energy management measurement.
                  allOf:
                  - oneOf:
                    - title: Inverter's Measurements
                      type: object
                      properties:
                        measuredAt:
