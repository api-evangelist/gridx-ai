  /user/stars/systems:
    get:
      operationId: listStarredSystems
      summary: List all starred Systems
      description: List starred systems of the authenticated user.
      tags:
      - Star
      responses:
        '200':
          description: Starred systems of the authenticated user.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: array
                items:
                  description: 'Represents a starred system which holds minimal system and gateway information and a

                    starredAt timestamp.

                    '
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      readOnly: true
                      description: Unique identifier of a system.
                      example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
                    name:
                      type:
                      - string
                      - 'null'
                      maxLength: 200
                      description: Name of the System.
                      example: gridX Headquarter
                    starredAt:
                      description: Date when the system was starred in RFC3339 format.
                      type: string
                      format: date-time
                      example: '2020-11-10T13:13:00Z'
                      readOnly: true
                    gateways:
                      description: The gateways connected to the system.
                      type: array
                      readOnly: true
                      items:
                        description: 'Represents minimal gateway information used for the starred system feature.

                          '
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 6dd0a658-5828-4d30-bc65-a03c6d6e425f
                            description: Unique identifier of a gateway.
                            readOnly: true
                          connectionStatus:
                            title: Connection Status
                            type: object
                            readOnly: true
                            properties:
                              status:
                                type: string
                                description: "Indicates the connection status. Is one of:\n  * `AVAILABLE`: Gateway has sent data in the last 5 minutes\n  * `TEMPORARILY_UNAVAILABLE`: Gateway has not sent data in the last 5 minutes\n  * `UNAVAILABLE`: Gateway has not sent data in the last 24 hours\n  * `UNKNOWN`: Gateway was never online and never sent data or the connection status can't be determined."
                                enum:
                                - AVAILABLE
                                - TEMPORARILY_UNAVAILABLE
                                - UNAVAILABLE
                                - UNKNOWN
                              contactedAt:
                                type: string
                                format: date-time
                                deprecated: true
                                description: 'When the gateway/appliance has last contacted the gridX cloud.


                                  In case the gateway was never online and never sent data, this field is null.


                                  Deprecated: Gateway heartbeats will be removed in future versions and this will be only estimated. Use `statusChangedAt` instead.

                                  '
                              statusChangedAt:
                                type: string
                                format: date-time
                                description: 'When the gateway status last changed. In case the gateway was never online this field is null.

                                  '
                            required:
                            - status
                            x-readme-ref-name: ConnectionStatus
                          type:
                            type: string
                            description: 'Type of the gateway.


                              **Deprecated** - Non-physical gateways will no longer be supported from 01.03.2024. This field will consequently be removed.

                              '
                            deprecated: true
                            enum:
                            - VIRTUAL
                            - PHYSICAL
                            - OTHER
                            x-readme-ref-name: GatewayType
                          serialnumber:
                            description: Serial number of the gateway.
                            type: string
                            example: C083-200-000-000-199-P-X
                            readOnly: true
                        required:
                        - id
                        - type
                        - connectionStatus
                        x-readme-ref-name: StarredSystemGateway
                  required:
                  - id
                  - name
                  - starredAt
                  x-readme-ref-name: StarredSystem
        '403':
          description: Forbidden (missing authorization)
        '500':
          description: Internal Server Error
      security:
      - HeaderAuth:
        - UserRead
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/user/stars/systems"


          headers = {"accept": "application/vnd.gridx.v2+json"}


          response = requests.get(url, headers=headers)


          print(response.text)'
      - lang: shell
