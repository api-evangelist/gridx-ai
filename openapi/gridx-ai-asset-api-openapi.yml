openapi: 3.2.0
info:
  title: Gridx Ai Asset API
  version: 2.0.0
  contact:
    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Asset across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Asset
  x-displayName: Asset
paths:
  /systems/{systemID}/assets:
    get:
      operationId: listSystemAsset
      summary: List System's Assets
      description: Lists assets that belong to the given system.
      tags:
      - Asset
      x-badges:
      - label: draft
        color: red
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: include
        deprecated: true
        description: 'This query param allows to set certain fields only when needed.

          This makes the request faster as it requires to load only necessary data.


          If this param is unset, only the core asset fields are included.


          Deprecated: The `gateway` field is now always included in the response.

          Use `gatewayType` from the appliance response for the gateway type.

          '
        in: query
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - gateway
      responses:
        '200':
          description: The list of assets belonging to a system.
          content:
            application/vnd.gridx.v2+json:
              schema:
                type: object
                description: A list of assets.
                properties:
                  assets:
                    type: array
                    items:
                      title: Asset
                      description: 'Asset represents a monitor-/controllable device such as Inverters,

                        Meters and Heat Pumps.

                        '
                      readOnly: true
                      oneOf:
                      - title: Inverter
                        description: 'Inverter represents a monitor-/controllable inverter. It can be of kind:

                          - `PV`/`PV_EXTERNAL`: used as photovoltaic only.

                          - `BATTERY`: used as battery only.

                          - `HYBRID`: used as both photovoltaic and battery.

                          - `UNKNOWN`: default, when the inverter kind is not determined.

                          '
                        allOf:
                        - title: Base Asset
                          description: 'BaseAsset contains fields that all assets have in common.


                            Specific asset types extend this schema and add new fields.

                            '
                          type: object
                          required:
                          - id
                          - createdAt
                          - updatedAt
                          - connectionStatus
                          - type
                          - gatewayType
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: 'Uniquely identifies the asset.

                                '
                              example: ec4d0c89-a604-49ac-82f0-427f9cb42204
                            createdAt:
                              type: string
                              format: date-time
                              description: 'Specifies when the asset was created.

                                '
                            updatedAt:
                              type: string
                              format: date-time
                              description: 'Specifies when the asset was updated the last time.

                                '
                            connectionStatus:
                              title: Asset connection status
                              type: object
                              readOnly: true
                              required:
                              - status
                              properties:
                                status:
                                  type: string
                                  description: "Indicates the connection status of an asset.\n    \nThe connection status of an asset is determined by the gateway. The gateway regularly\nsends the connection status of all connected assets.\n\nIt is one of:\n- `AVAILABLE`: Asset was reported as available by the gateway.\n- `UNAVAILABLE`: Asset was reported as unavailable by the gateway.\n- `UNKNOWN`: The gateway didn't report a status for the asset.\n\nIn case the connection status of the gateway this asset belongs to is `TEMPORARILY_UNAVAILABLE` or `UNAVAILABLE`\nthe status is always `UNAVAILABLE`.\nFor cloud-connected assets, the connection status will always be `AVAILABLE`: they have no gateway heartbeat\nand are reached through a cloud integration, so they are assumed to be reachable.\n"
                                  x-extensible-enum:
                                  - AVAILABLE
                                  - UNAVAILABLE
                                  - UNKNOWN
                              x-readme-ref-name: AssetConnectionStatus
                            type:
                              type: string
                              description: 'Describes the ''physical'' type of the asset.


                                See `kind` for further distinction of the type in terms of the asset''s purpose/role,

                                e.g. asset with type=INVERTER and kind=BATTERY represents a battery inverter.

                                '
                              example: INVERTER
                            gatewayType:
                              type: string
                              x-extensible-enum:
                              - GRIDBOX
                              - CLOUD
                              description: 'Type of the gateway used to communicate with this asset:

                                GRIDBOX → The asset is physically connected to a gridbox, through which it sends measurements and can be controlled.

                                CLOUD → The asset is connected via a cloud-to-cloud integration, through which we receive measurements and can send commands.

                                '
                            parent:
                              type: string
                              format: uuid
                              description: 'Specifies the ID of the parent asset, for an asset which is the child of another.

                                '
                            manufacturer:
                              type: string
                              description: 'Manufacturer of the asset.

                                '
                              example: TQ Systems
                            name:
                              type: string
                              description: 'Name of the asset.

                                '
                            serialnumber:
                              type: string
                              description: 'Serial number of the asset.

                                '
                              example: GD3Y3VMATKBY79142
                            model:
                              type: string
                              description: 'Model of the asset.

                                '
                              example: Sunny Boy Storage 2.5
                            gateway:
                              type: object
                              deprecated: true
                              description: 'Gateway used to communicate with the asset.

                                Excluded by default, can be optionally included in the repsonse using the `include` query parameter.


                                Deprecated: Use `gatewayType` field instead.

                                For the gateway UUID of gridbox-connected assets, retrieve the system''s gateway via the system API (`GET /systems/{systemID}?include=gateways` or `GET /systems/list?include=gateways`).

                                '
                              required:
                              - uuid
                              - type
                              properties:
                                uuid:
                                  type: string
                                  format: uuid
                                  description: Uniquely identifies the gateway.
                                type:
                                  type: string
                                  x-extensible-enum:
                                  - GRIDBOX
                                  - CLOUD
                                  description: 'Type of the gateway:

                                    GRIDBOX → The asset is physically connected to a gridbox, through which it send measurements and be controlled.

                                    CLOUD → The asset is connected via a cloud-to-cloud integration, through which we receive measurements and can send commands.

                                    '
                          x-readme-ref-name: BaseAsset
                        - required:
                          - kind
                          properties:
                            type:
                              type: string
                              enum:
                              - INVERTER
                            kind:
                              type: string
                              description: 'Indicates the role of the inverter.


                                Setting the kind impacts the system measurements. So it''s best to set it up correctly as early as possible

                                in accordance to the actual installation in order for the measurement calculation to be correct (best during commissioning).

                                '
                              x-extensible-enum:
                              - UNKNOWN
                              - PV
                              - PV_EXTERNAL
                              - BATTERY
                              - HYBRID
                            firmware:
                              type: string
                              description: 'Firmware version of the inverter.

                                '
                              example: 2.4.23.R
                            maxActivePowerOutput:
                              type: integer
                              description: 'Maximum active power output of the inverter in mW; set manually. Zero if not set.

                                '
                            nominalPowerLimit:
                              type: integer
                              description: 'Designed maximal power output of the inverter in mW.

                                '
                            hybridCalcMode:
                              type: integer
                              description: 'The calculation mode for inverters of `HYBRID` kind.

                                '
                              x-extensible-enum:
                              - 0
                              - 1
                              - 2
                            hardwareStatus:
                              title: Hardware Status
                              type: object
                              description: "HardwareStatus provides information about the condition of the inverter and in case of issues, \npossible follow-up actions the user/installer can perform to resolve them.\n"
                              properties:
                                state:
                                  type: string
                                  description: State of the inverter.
                                  x-extensible-enum:
                                  - UNKNOWN
                                  - OK
                                  - WARNING
                                  - ERROR
                                action:
                                  type: string
                                  description: Recommended action to resolve ERROR/WARNING state.
                                  x-extensible-enum:
                                  - CONSULT_DEVICE_READOUT
                                  - CONTACT_INSTALLER
                                  - CONTACT_MANUFACTURER
                                  - CONTACT_GRID_OPERATOR
                                errorCode:
                                  type: string
                                  description: Inverter manufacturer/model dependent error code formatted as it would be shown on display.
                                description:
                                  type: string
                                  description: Contains details about the inverter ERROR and WARNING states.
                                  x-extensible-enum:
                                  - OTHER
                                  - GRID_FAULT
                                  - INSULATION_FAILURE
                                  - INTERFERENCE_DEVICE
                                  - FAN_FAULT
                                  - WAIT_FOR_UPDATE
                                  - SOFTWARE_FAULT
                                  - HARDWARE_FAULT
                                  - PARAMETER_FAULT
                                  - HIGH_TEMPERATURE
                                  - HIGH_DC_VOLTAGE
                                  - LOW_DC_POWER
                                  - DC_OVERCURRENT
                                  - INSTALLATION_FAULT
                                  - COMMUNICATION_FAULT
                                  - BATTERY_FAULT
                                measuredAt:
                                  type: string
                                  format: date-time
                                  example: '2018-04-15T00:00:00Z'
                              x-readme-ref-name: AssetHardwareStatus
                            battery:
                              title: Battery
                              type: object
                              description: The battery-specific information for inverters of BATTERY and HYBRID kind.
                              required:
                              - controllable
                              properties:
                                maxCharge:
                                  type: integer
                                  format: int64
                                  description: Battery's maximum charge in mW
                                  minimum: 0
                                maxDischarge:
                                  type: integer
                                  format: int64
                                  description: Battery's maximum discharge in mW
                                  minimum: 0
                                controllable:
                                  type: boolean
                                  description: Controllable is true if the battery charging/discharging can be controlled.
                                dischargeLimit:
                                  type: integer
                                  description: DischargeLimit is the minimum state of charge in % from 0-100 to discharge to.
                                rechargeLimit:
                                  type: integer
                                  description: "RechargeLimit is the state of charge in % from 0-100 to which the battery needs to \nrecharge before allowing discharging again.\n"
                                controlSettings:
                                  type: object
                                  description: Indicates the currently desired control settings for the battery.
                                  required:
                                  - value
                                  - command
                                  properties:
                                    value:
                                      type: integer
                                      description: Represents the charge/discharge power in mW.
                                    command:
                                      type: string
                                      description: Represents the current control command.
                                      x-extensible-enum:
                                      - none
                                      - charge
                                      - discharge
                              x-readme-ref-name: BatteryAsset
                        x-readme-ref-name: InverterAsset
                      - title: Meter
                        description: 'Meter represents a monitor-/controllable meter.

                          '
                        allOf:
                        - title: Base Asset
                          description: 'BaseAsset contains fields that all assets have in common.


                            Specific asset types extend this schema and add new fields.

