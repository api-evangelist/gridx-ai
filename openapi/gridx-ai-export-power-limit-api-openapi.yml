    name: gridX
    url: https://www.gridx.ai/module/api
    email: developer-community@gridx.de
  license:
    name: All rights reserved.
    url: https://www.gridx.ai/
  x-api-id: ba9d6a25-ae1a-4ac8-af7a-70b76db17021
  x-audience: public-external
  description: 'Operations tagged Export Power Limit across 2 of this provider''s published API definitions: gridx-api.json, gridx-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gridx.de
  description: Production
tags:
- name: Export Power Limit
  x-displayName: Export Power Limit
paths:
  /systems/{systemID}/gateways/{gatewayID}/export-power-limit:
    get:
      summary: Retrieve gateway's current export power limit
      operationId: getSystemGatewayExportPowerLimit
      x-badges:
      - label: draft
        color: red
      tags:
      - Export Power Limit
      parameters:
      - name: systemID
        description: 'Unique identifier used to access a system.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: aa3e5a93-bb38-4b15-b7f2-af40daf3a1dc
      - name: gatewayID
        description: 'Unique identifier used to access a gateway.

          '
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 4ef41512-8445-4b90-aa53-8f8549b3f4bd
      responses:
        '200':
          description: Export Power limit returned.
          content:
            application/vnd.gridx.v2+json:
              schema:
                allOf:
                - title: Export power limit
                  type: object
                  properties:
                    maxExportTotal:
                      type: integer
                      description: Maximum total export power in W.
                      format: int64
                      minimum: 0
                    maxExportL1:
                      type: integer
                      description: Maximum total export power in the first phase in W.
                      format: int64
                      minimum: 0
                    maxExportL2:
                      type: integer
                      description: Maximum total export power in the second phase in W.
                      format: int64
                      minimum: 0
                    maxExportL3:
                      type: integer
                      description: Maximum total export power in the third phase in W.
                      format: int64
                      minimum: 0
                  x-readme-ref-name: AbstractExportPowerLimit
                - properties:
                    internalDeviceID:
                      type: string
                      description: Unique ID to identify the gateway the import power limit belongs to.
                      example: aeb639cf0793e81f0804c6647af7f0900a847921c0596726f1afdfd04a3a3186
                    createdAt:
                      type: string
                      description: Time at which the import power limit was created in UTC using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                    updatedAt:
                      type: string
                      description: Time at which the import power limit was updated in UTC using the RFC3339 format.
                      example: '2021-10-10T23:20:50Z'
                      format: date-time
                  required:
                  - internalDeviceID
                  - createdAt
                  - updatedAt
                x-readme-ref-name: ExportPowerLimit
        '400':
          description: Malformed request.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Bad Request
                  description: 'Bad Request indicates that the request body is not a valid JSON or

                    it contains a invalid json type.

                    '
                  example:
                    message: Problems parsing JSON
                x-readme-ref-name: BadRequestException
        '404':
          description: Requested entity not found.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ClientError - Not Found
                  description: Not Found indicates that the entity was not found.
                  example:
                    message: Not Found
                x-readme-ref-name: NotFoundException
        '500':
          description: There has been an internal error on our side. We're looking into it.
          content:
            application/vnd.gridx.v2+json:
              schema:
                readOnly: true
                allOf:
                - title: General Exception
                  description: Represents a general error structure returned by our REST API.
                  type: object
                  properties:
                    message:
                      type: string
                      description: Message represents the message reported to the user.
                    details:
                      type: array
                      description: 'Details represents detail information for the user to fix this

                        problem

                        '
                      items:
                        type: string
                  required:
                  - message
                  x-readme-ref-name: GeneralException
                - title: ServerSideError - Internal Server Error
                  description: Internal Server Error
                  example:
                    message: Internal Server Error
                x-readme-ref-name: InternalException
      security:
      - HeaderAuth:
        - SystemsRead
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "https://api.gridx.de/systems/systemID/gateways/gatewayID/export-power-limit"


