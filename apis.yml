aid: gridx-ai

name: gridX

description: 'gridX (gridX GmbH, Aachen, Germany) provides XENON, a white-label connectivity and flexibility
  platform for distributed energy resources. It covers home energy management systems (HEMS) and EV charging
  infrastructure: connecting PV, batteries, heat pumps and AC/DC chargers via the gridBox gateway or cloud
  connectivity, controlling and optimizing energy flows with dynamic tariffs, peak shaving and dynamic load
  management, and aggregating asset flexibility for energy-market trading. The gridX API exposes live and
  historic system and asset data and webhooks, documented in its developer community.'

url: https://raw.githubusercontent.com/api-evangelist/gridx-ai/refs/heads/main/apis.yml

